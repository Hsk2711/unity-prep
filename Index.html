<style>
/* Layout: an Inspector-style study workspace with labeled property rows, one focused question card, and a side navigator in mock mode */
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --panel2:#F5F7FA; --ink:#141C26; --muted:#5A6676; --line:#D3DAE3;
  --acc:#2C6BD1; --accSoft:#E3ECFA; --ok:#1C8556; --okSoft:#E1F3EA; --bad:#BF3B34; --badSoft:#FBE7E5; --warn:#B9790B; --warnSoft:#FBF0D9;
  --f-display:'Chakra Petch','Segoe UI',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161C; --panel:#1B2129; --panel2:#222A34; --ink:#E4E9F0; --muted:#97A3B3; --line:#313C4A;
  --acc:#5E9DF2; --accSoft:#1D2E47; --ok:#43B67E; --okSoft:#17322A; --bad:#E7675E; --badSoft:#3A1F1E; --warn:#E2A73C; --warnSoft:#3A2E17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161C; --panel:#1B2129; --panel2:#222A34; --ink:#E4E9F0; --muted:#97A3B3; --line:#313C4A;
  --acc:#5E9DF2; --accSoft:#1D2E47; --ok:#43B67E; --okSoft:#17322A; --bad:#E7675E; --badSoft:#3A1F1E; --warn:#E2A73C; --warnSoft:#3A2E17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);}
#app{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:24px 64px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.35rem;font-weight:600} h3{font-size:1.02rem;font-weight:600}
p{margin:0} a{color:var(--acc)} code{font-family:var(--f-mono);font-size:.88em;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.muted{color:var(--muted)} .small{font-size:.85rem} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.lede{font-size:1.05rem;max-width:65ch;color:var(--muted)}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.btn{font:600 .9rem var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:9px 16px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--acc)} .btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff} .btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent} .btn.big{padding:13px 20px;font-size:1rem;width:100%}
.btn.small{padding:5px 11px;font-size:.82rem} .btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.flagged{border-color:var(--warn);color:var(--warn)}
.link{background:none;border:0;color:var(--acc);font:600 .9rem var(--f-body);cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chip{font:500 .84rem var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip.on{background:var(--accSoft);border-color:var(--acc);color:var(--acc)} .chip small{font-family:var(--f-mono);color:var(--muted);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.tag.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.meter{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:1}
.meter i{display:block;height:100%;background:var(--acc)} .meter i.ok{background:var(--ok)} .meter i.mid{background:var(--warn)} .meter i.bad{background:var(--bad)} .meter.thin{height:5px}
/* hero */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:32px;align-items:center;padding-block:18px}
.hero-txt{display:flex;flex-direction:column;gap:16px;min-width:0}
.hero h1{font-size:clamp(2.4rem,6vw,3.9rem);font-weight:700;letter-spacing:-.01em}

.hero-stats div{display:flex;flex-direction:column;border-top:2px solid var(--acc);padding-top:6px}
.hero-stats b{font:600 1.5rem var(--f-mono);font-variant-numeric:tabular-nums} .hero-stats span{font-size:.78rem;color:var(--muted)}
.inspector{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);font-size:.84rem;overflow:hidden;box-shadow:0 10px 30px -18px rgba(20,40,80,.35)}

.ins-h span{color:var(--muted);font-weight:400}

.ins-row span{color:var(--muted)} .ins-row b{font-weight:500;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 7px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins-sub{padding:8px 12px 4px;font:600 .8rem var(--f-body);color:var(--acc)}
.chk{width:15px;height:15px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);display:inline-block}
/* exam cards */
.exam-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.exam-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.exam-card h3{font-size:1.3rem} .exam-card p{color:var(--muted);font-size:.92rem;flex:1}
.ec-top{display:flex;justify-content:space-between;align-items:center}
.lvl{font:600 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.lvl-associate{background:var(--okSoft);color:var(--ok)} .lvl-professional{background:var(--warnSoft);color:var(--warn)}
.ec-count{font:600 .85rem var(--f-mono);color:var(--muted)}
.ec-meta{display:flex;gap:14px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ec-actions{display:flex;gap:8px;flex-wrap:wrap}
.method{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.steps{margin:0;padding-left:22px;display:grid;gap:8px} .steps li::marker{font-family:var(--f-mono);color:var(--acc)}
.foot{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
/* exam view */
.crumbs{display:flex;gap:10px;align-items:center;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.ex-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.ex-title{font-size:clamp(1.7rem,4vw,2.4rem)} .ex-sub{color:var(--muted);font-size:.9rem;margin-top:6px}
.ex-switch{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:-8px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:600 .92rem var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)} .tab em{font:600 .72rem var(--f-mono);font-style:normal;background:var(--badSoft);color:var(--bad);border-radius:99px;padding:1px 6px}
#pane{display:flex;flex-direction:column;gap:18px}
.setup{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.setup-col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.field{display:grid;gap:4px;font-size:.84rem;color:var(--muted)}
select,input[type=search],textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{font-family:var(--f-mono);font-size:.82rem}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem}
.facts{margin:0;padding-left:18px;display:grid;gap:4px}
/* run */
.runbar{display:flex;align-items:center;gap:14px;font-size:.88rem;color:var(--muted)}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qmeta{display:flex;gap:6px;flex-wrap:wrap}
.qtext{font:600 1.22rem/1.4 var(--f-body);max-width:70ch}
.code{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;margin:0;font:13px/1.55 var(--f-mono)}
.code code{background:none;border:0;padding:0;font-size:inherit}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:11px 14px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .key{font:600 .8rem var(--f-mono);border:1px solid var(--line);border-radius:4px;min-width:24px;height:24px;display:grid;place-items:center;background:var(--panel);flex:none}
.opt .otxt{min-width:0;padding-top:1px}
.opt.sel{border-color:var(--acc);background:var(--accSoft)} .opt.sel .key{background:var(--acc);color:#fff;border-color:var(--acc)}
.opt.right{border-color:var(--ok);background:var(--okSoft)} .opt.right .key{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badSoft)} .opt.wrong .key{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.7} .opt:disabled{cursor:default}
.explain{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:16px}
.verdict{font:700 1.15rem var(--f-display)} .explain.good .verdict{color:var(--ok)} .explain.bad .verdict{color:var(--bad)}
.verdict span{font:500 .95rem var(--f-body);color:var(--ink);margin-left:6px}
.explain h3{font-size:.8rem;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.why li.r{border-color:var(--ok);background:var(--okSoft)} .why li.you.w{border-color:var(--bad);background:var(--badSoft)}
.why .mk{font-weight:700;flex:none;width:16px} .why li.r .mk{color:var(--ok)} .why li.w .mk{color:var(--bad)}
.why li div{min-width:0} .why p{color:var(--muted);font-size:.9rem;margin-top:2px}
.youtag{font:600 .7rem var(--f-mono);font-style:normal;text-transform:uppercase;color:var(--bad);margin-left:6px}
.deep{max-width:72ch}
.diag{margin:0;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.diag figcaption{font-family:var(--f-display);font-size:1rem}
.diag p{font-size:.88rem;color:var(--muted)}
.svgwrap{overflow-x:auto} .svgwrap svg{width:100%;max-width:720px;min-width:520px;height:auto;display:block}
.k-box{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.k-acc{fill:var(--accSoft);stroke:var(--acc)} .k-ok{fill:var(--okSoft);stroke:var(--ok)} .k-warn{fill:var(--warnSoft);stroke:var(--warn)}
.k-zone{fill:none;stroke:var(--line);stroke-dasharray:5 4}
.k-t{fill:var(--ink);font:500 12px var(--f-body)} .k-s{fill:var(--muted);font:11px var(--f-body)} .k-lab{fill:var(--acc);font:600 10.5px var(--f-mono);letter-spacing:.08em}
.k-ln{stroke:var(--muted);stroke-width:1.4;fill:none} .k-acc-ln{stroke:var(--acc);stroke-width:2} .k-dash{stroke-dasharray:4 4}
.k-head{fill:var(--muted)} .k-dot{fill:var(--acc)}
.k-curve{fill:none;stroke:var(--acc);stroke-width:2.5} .k-curve2{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 4}
.learn{display:flex;gap:8px;flex-wrap:wrap}
.lbtn{font:600 .85rem var(--f-body);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:8px 13px;color:var(--ink);background:var(--panel)}
.lbtn:hover{border-color:var(--acc)} .lbtn.vid{border-color:var(--bad);color:var(--bad)}
.nextrow{display:flex;justify-content:flex-end}
.done,.results,.empty{display:flex;flex-direction:column;gap:14px}
.empty{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:28px;align-items:flex-start}
.big-score{font:700 3.6rem/1 var(--f-mono);font-variant-numeric:tabular-nums} .big-score.ok{color:var(--ok)} .big-score.mid{color:var(--warn)} .big-score.bad{color:var(--bad)}
.sum-list{display:grid;gap:4px}
.sum{display:flex;gap:10px;font-size:.88rem;padding:6px 10px;border-radius:5px;background:var(--panel);border:1px solid var(--line)}
.sum span{font:600 .82rem var(--f-mono);flex:none;width:24px} .sum.ok span{color:var(--ok)} .sum.bad span{color:var(--bad)}
/* mock */
.mock{display:grid;grid-template-columns:1fr 260px;gap:20px;align-items:start}
.mock-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.mock-side{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:320px;overflow:auto}
.cell{font:600 .72rem var(--f-mono);aspect-ratio:1;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:4px;cursor:pointer;padding:0}
.cell.ans{background:var(--accSoft);color:var(--acc);border-color:var(--acc)} .cell.fl{box-shadow:inset 0 -3px 0 var(--warn)} .cell.cur{outline:2px solid var(--ink)}
.mock-nav{display:flex;justify-content:space-between}
.timer{font-size:1.05rem;color:var(--ink);margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:2px 10px} .timer.low{color:var(--bad);border-color:var(--bad)}
.confirm{border:1px solid var(--bad);border-radius:6px;padding:10px;display:grid;gap:8px;font-size:.88rem}
.res-top{display:flex;gap:24px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.res-top>div:last-child{display:flex;flex-direction:column;gap:8px}
.drows{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.drow{display:grid;grid-template-columns:minmax(120px,240px) 1fr 52px;gap:12px;align-items:center;font-size:.88rem}
/* notes & bank & guide */
.notes,.guide{display:flex;flex-direction:column;gap:18px}
.note-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.note ul,.note ol{margin:0;padding-left:18px;display:grid;gap:6px;font-size:.92rem}
.note .link{align-self:flex-start;font-size:.84rem}
.plan li::marker{color:var(--acc);font-family:var(--f-mono)}
.bank{display:flex;flex-direction:column;gap:10px}
.search{font-size:1rem;padding:11px 14px}
.bq{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.bq summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.bq[open]{display:flex;flex-direction:column;gap:10px} .bq .why{margin-top:10px}
.mast{font:600 .7rem var(--f-mono);font-style:normal;color:var(--ok);text-transform:uppercase}
.gsteps{margin:0;padding:0;list-style:none;counter-reset:g;display:grid;gap:12px}
.gsteps li{counter-increment:g;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 18px 64px;position:relative;display:flex;flex-direction:column;gap:8px;min-width:0}
.gsteps li::before{content:counter(g,decimal-leading-zero);position:absolute;left:18px;top:16px;font:700 1.2rem var(--f-mono);color:var(--acc)}
.gsteps p{max-width:75ch}

@media (max-width:860px){

  .setup,.mock{grid-template-columns:1fr} .mock-side{position:static}

@media (max-width:480px){
  #app{padding-inline:16px} .hero-stats{grid-template-columns:repeat(2,1fr)} .qcard{padding:16px} .qtext{font-size:1.08rem}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

window.QB=[{"id":"GD-1","ex":["GD","PP"],"d":"Programming","q":"Which lifecycle method is called once when a script instance is first loaded, before any Start() calls?","o":["Start()","Awake()","Update()","OnEnable()"],"a":1,"w":["Start() runs once too, but only after every Awake() has finished and only if the script is enabled.",null,"Update() runs every frame, not once at load.","OnEnable() runs each time the object or component is enabled; it fires after Awake() and can fire many times."],"r":"","e":"Awake() runs once when the object is loaded into the scene, before any Start() methods are called.","src":"doc","g":"lifecycle"},{"id":"GD-2","ex":["GD","PP"],"d":"Programming","q":"Which method should physics-related code (e.g., applying forces to a Rigidbody) be placed in?","o":["Update()","LateUpdate()","FixedUpdate()","OnGUI()"],"a":2,"w":["Update() runs once per rendered frame, so frame rate changes would make forces inconsistent.","LateUpdate() runs after Update() each frame; it suits cameras, not physics.",null,"OnGUI() is the legacy IMGUI callback and can run several times per frame."],"r":"","e":"FixedUpdate() runs on a fixed timestep synced with the physics engine, giving consistent physics behavior. Unity 6 note: Rigidbody.velocity was renamed linearVelocity, and drag became linearDamping.","src":"doc","g":"lifecycle"},{"id":"GD-3","ex":["GD","PP"],"d":"Programming","q":"What is the primary advantage of using a Coroutine?","o":["It runs on a separate thread","It can pause execution and resume later without blocking the main thread","It replaces the need for Update()","It automatically manages garbage collection"],"a":1,"w":["Coroutines run on the main thread. For real threads use the C# Job System or async tasks.",null,"Coroutines complement Update(); they don't replace it.","Coroutines don't manage garbage collection. Each new yield instruction can even allocate memory."],"r":"","e":"Coroutines use yield to pause and resume over time on the main thread — ideal for delays and sequences.","src":"doc","g":"profiler"},{"id":"GD-4","ex":["GD","PP"],"d":"Programming","q":"Which attribute exposes a private field in the Inspector without making it public?","o":["[HideInInspector]","[SerializeField]","public","static"],"a":1,"w":["[HideInInspector] does the opposite: it hides a field that would otherwise be shown.",null,"public shows the field, but it also exposes it to every other script and breaks encapsulation.","static fields are not serialized by Unity and never appear in the Inspector."],"r":"","e":"[SerializeField] makes a private field editable in the Inspector while keeping it inaccessible from other scripts.","src":"doc","g":"lifecycle"},{"id":"GD-5","ex":["GD","PP"],"d":"Programming","q":"Which C# collection is best for a fixed-size set of spawn points known at compile time?","o":["List<T>","Dictionary<K,V>","Array","Queue<T>"],"a":2,"w":["List<T> is resizable. It works, but it's the better choice when the count changes at runtime.","Dictionary<K,V> is for key-to-value lookups, not an ordered fixed set.",null,"Queue<T> is first-in-first-out processing, not fixed indexed storage."],"r":"","e":"Arrays are efficient and appropriate when the size is fixed and known ahead of time.","src":"doc","g":"lifecycle"},{"id":"GD-6","ex":["GD","PP"],"d":"Programming","q":"Which method runs every frame, after all Update() calls have finished, and is commonly used for camera-follow logic?","o":["FixedUpdate()","LateUpdate()","OnUpdate()","Awake()"],"a":1,"w":["FixedUpdate() runs on the physics timestep, not after Update().",null,"OnUpdate() is not a Unity message; Unity never calls it.","Awake() runs once at load, not every frame."],"r":"","e":"LateUpdate() runs after every Update() call in the frame, so it sees the final position of tracked objects.","src":"doc","g":"lifecycle"},{"id":"GD-7","ex":["GD","PP"],"d":"Programming","q":"Which method detects the start of a physical collision between two non-trigger colliders?","o":["OnTriggerEnter()","OnCollisionEnter()","OnTriggerStay()","Update() with a manual raycast"],"a":1,"w":["OnTriggerEnter() fires only when at least one collider has Is Trigger enabled.",null,"OnTriggerStay() is for trigger overlaps and fires every physics step while the overlap continues.","A manual raycast detects things along a line; it isn't the collision callback."],"r":"","e":"OnCollisionEnter() fires when a Rigidbody's non-trigger collider first contacts another collider.","src":"doc","g":"trigger"},{"id":"GD-8","ex":["GD","PP"],"d":"Programming","q":"In the New Input System, which component reads Input Action data on a GameObject?","o":["Rigidbody","PlayerInput","CharacterController","Animator"],"a":1,"w":["Rigidbody handles physics simulation, not input.",null,"CharacterController handles collision-constrained movement. It needs input from elsewhere.","Animator plays animation; it does not read Input Actions."],"r":"","e":"The PlayerInput component connects an Input Action Asset to a GameObject's input-handling scripts.","src":"doc","g":"animator"},{"id":"GD-9","ex":["GD","PP"],"d":"Programming","q":"Which C# access modifier makes a field visible and editable in the Inspector by default?","o":["private","protected","public","internal"],"a":2,"w":["private fields are hidden unless you add [SerializeField].","protected fields are not serialized by default.",null,"internal fields are not serialized by default."],"r":"","e":"Public fields on a MonoBehaviour are serialized and shown in the Inspector by default.","src":"doc","g":"lifecycle"},{"id":"GD-10","ex":["GD","PP"],"d":"Programming","q":"A NullReferenceException in a Unity script is most commonly caused by:","o":["A missing semicolon","Trying to access a member of a reference that was never assigned","Using FixedUpdate() incorrectly","Exceeding an array's bounds"],"a":1,"w":["A missing semicolon is a compile error (CS1002). The game would never reach Play mode.",null,"Using FixedUpdate() incorrectly causes jitter or wrong timing, not a null reference.","Going past an array's end throws IndexOutOfRangeException, a different exception."],"r":"","e":"NullReferenceException occurs when code tries to use an object reference that is null (unassigned).","src":"doc","g":"lifecycle"},{"id":"GD-11","ex":["GD","PP"],"d":"Programming","q":"What is the recommended approach for repeatedly spawning and removing the same enemy prefab?","o":["Instantiate and Destroy every time","Use an Object Pool to reuse instances","Use DontDestroyOnLoad on each instance","Keep a static list of prefabs"],"a":1,"w":["Instantiate/Destroy every time allocates memory and causes GC spikes and frame hitches.",null,"DontDestroyOnLoad keeps objects alive across scene loads; it doesn't make spawning cheaper.","A static list of prefabs is only a reference list. You'd still be instantiating copies."],"r":"","e":"Object pooling reuses existing instances instead of paying the cost of repeated Instantiate/Destroy calls.","src":"doc","g":"pool"},{"id":"GD-12","ex":["GD","PP"],"d":"Programming","q":"What does the [RequireComponent] attribute do?","o":["Automatically adds a required component to the GameObject if it's missing","Hides a component from the Inspector","Deletes unused components on build","Marks a component required only for compilation"],"a":0,"w":[null,"[HideInInspector] hides fields; [RequireComponent] adds dependencies.","Unity does not strip components at build time based on this attribute.","It works in the Editor when you add the component, not at compile time."],"r":"","e":"[RequireComponent] ensures a dependency component is automatically added when the script is attached.","src":"doc","g":"lifecycle"},{"id":"GD-13","ex":["GD","PP"],"d":"Programming","q":"Which API call turns a scene GameObject into a reusable Prefab asset in the Project window?","o":["Instantiate()","PrefabUtility.SaveAsPrefabAsset()","GameObject.Find()","AssetDatabase.Refresh()"],"a":1,"w":["Instantiate() clones an object into the scene at runtime; it doesn't create an asset.",null,"GameObject.Find() looks up objects by name.","AssetDatabase.Refresh() re-imports changed files; it doesn't create prefabs."],"r":"","e":"PrefabUtility.SaveAsPrefabAsset() saves a GameObject as a Prefab asset on disk.","src":"doc","g":"prefab"},{"id":"GD-14","ex":["GD","PP"],"d":"Programming","q":"Why should AddComponent() be avoided inside frequently-executed, performance-critical code?","o":["It's deprecated","It allocates memory and can trigger garbage-collection overhead on every call","It only works in Edit mode","It doesn't work at runtime"],"a":1,"w":["AddComponent() is not deprecated.",null,"It works at runtime as well as in Edit mode.","It does work at runtime. The problem is the cost when called often."],"r":"","e":"Repeated AddComponent() calls allocate memory each time, which can cause GC spikes if called every frame.","src":"doc","g":"profiler"},{"id":"GD-15","ex":["GD","PP"],"d":"Physics","q":"Which component must a GameObject have to be affected by gravity and forces?","o":["Collider only","Rigidbody","Transform","Animator"],"a":1,"w":["A Collider alone gives shape for collisions but no gravity or forces.",null,"Every GameObject has a Transform. It stores position only and has no physics.","Animator drives animation, not physics."],"r":"","e":"A Rigidbody is what hands a GameObject over to Unity's physics simulation.","src":"doc","g":"animator"},{"id":"GD-16","ex":["GD","PP"],"d":"Physics","q":"What happens when 'Is Trigger' is enabled on a Collider?","o":["The collider is disabled entirely","It fires enter/exit events but produces no physical collision response","It doubles collision detection accuracy","It automatically becomes kinematic"],"a":1,"w":["The collider stays active. It just stops blocking.",null,"Trigger mode does not change accuracy. Use Collision Detection mode (Continuous) for that.","Is Trigger and Is Kinematic are separate settings."],"r":"","e":"Trigger colliders let objects pass through while still reporting overlap events.","src":"doc","g":"trigger"},{"id":"GD-17","ex":["GD","PP"],"d":"Physics","q":"Which callback fires when two trigger colliders overlap?","o":["OnCollisionEnter()","OnTriggerEnter()","OnTriggerCollide()","OnHit()"],"a":1,"w":["OnCollisionEnter() is for solid, non-trigger contacts.",null,"OnTriggerCollide() is not a Unity message.","OnHit() is not a Unity message."],"r":"","e":"OnTriggerEnter() is called when a collider marked as a trigger overlaps another collider.","src":"doc","g":"trigger"},{"id":"GD-18","ex":["GD","PP"],"d":"Physics","q":"How do Primitive Colliders (Box, Sphere, Capsule) compare to Mesh Colliders?","o":["Mesh Colliders are always faster","Primitive Colliders are simpler shapes and generally more performant; Mesh Colliders match exact geometry but cost more","They behave identically in every case","Mesh Colliders cannot fire trigger events"],"a":1,"w":["Mesh Colliders are the most expensive collider type.",null,"They differ in cost and in rules: concave Mesh Colliders can't be used on non-kinematic Rigidbodies.","Mesh Colliders can be triggers when set to Convex."],"r":"","e":"Primitive shapes are cheaper to compute, which is why they're preferred where exact geometry isn't required.","src":"doc","g":"trigger"},{"id":"GD-19","ex":["GD","PP"],"d":"Physics","q":"Raycasting is most commonly used for:","o":["Rendering dynamic shadows","Detecting what lies along a line, such as for shooting or ground checks","Applying textures to a mesh","Baking lightmaps"],"a":1,"w":["Shadows are produced by lights and shadow maps, not raycasts.",null,"Textures are applied through UV coordinates and materials.","Baking lightmaps is done by the Progressive Lightmapper."],"r":"","e":"A Raycast checks for intersections along a line — a core tool for hit detection and ground/interaction checks.","src":"doc","g":"raycast"},{"id":"GD-20","ex":["GD","PP"],"d":"Physics","q":"What determines whether two GameObjects' colliders are allowed to physically interact?","o":["Their Tags","Their Layers, combined with the Physics Collision Matrix","Their Sorting Layers","Their Material color"],"a":1,"w":["Tags identify objects in code (CompareTag). They don't filter physics.",null,"Sorting Layers control 2D draw order, not physics.","Material color has nothing to do with physics."],"r":"","e":"Layers plus the Collision Matrix (Project Settings > Physics) define which layers can collide with each other.","src":"doc","g":"collision"},{"id":"GD-21","ex":["GD","PP"],"d":"Physics","q":"Setting a Rigidbody to 'Kinematic' means:","o":["It is fully controlled by physics forces and gravity","It ignores forces/gravity and is moved only by script or animation, while still generating collision events","It automatically becomes a trigger","It permanently disables its collider"],"a":1,"w":["That describes a dynamic (non-kinematic) Rigidbody.",null,"Kinematic and Is Trigger are independent settings.","The collider stays fully active."],"r":"","e":"Kinematic Rigidbodies are moved manually (script/animation) but still interact with other colliders' events.","src":"doc","g":"trigger"},{"id":"GD-22","ex":["GD","PP"],"d":"Physics","q":"Which Rigidbody setting restricts movement or rotation to specific axes?","o":["Constraints","Collider bounds","Layer settings","Animator constraints"],"a":0,"w":[null,"Collider bounds are the shape's extents. They don't lock axes.","Layer settings filter collisions, not motion axes.","Animator has no physics axis constraints. Animation Rigging constraints are a different system."],"r":"","e":"The Constraints section of the Rigidbody component freezes position/rotation on chosen axes.","src":"doc","g":"animator"},{"id":"GD-23","ex":["GD","PP"],"d":"Physics","q":"What is the main purpose of combining Layers and Tags on a GameObject?","o":["To organize script files","To control collisions selectively and identify/filter objects efficiently in code","To control scene lighting","To manage audio channels"],"a":1,"w":["Script files are organized with folders and assemblies.",null,"Lights use culling masks (which use layers), but that isn't the main purpose of combining tags and layers.","Audio is routed through Audio Mixer groups."],"r":"","e":"Layers control physics/rendering behavior; Tags let scripts quickly identify object types (e.g., 'Enemy').","src":"doc","g":"trigger"},{"id":"GD-24","ex":["GD","PP"],"d":"Physics","q":"What does a Physic Material control on a Collider?","o":["Rendering order","Friction and bounciness of physical interactions","Texture tiling","Audio reverb"],"a":1,"w":["Rendering order is set by the render queue or sorting layers.",null,"Texture tiling is a material property.","Reverb is an audio effect or Audio Reverb Zone."],"r":"","e":"A Physic Material defines how surfaces interact physically — how much they slide (friction) or bounce (restitution).","src":"doc","g":"shader"},{"id":"GD-25","ex":["GD","AA"],"d":"Asset Management","q":"What is the preferred file format for importing 3D models into Unity?","o":["OBJ","FBX","BLEND","STL"],"a":1,"w":["OBJ imports static meshes only. No rigs, no animation.",null,".blend works only if Blender is installed, because Unity converts it through Blender. It's fragile in teams.","STL is a 3D-printing format with no UVs or materials."],"r":"","e":"FBX reliably carries mesh, rig, and animation data, making it the standard import format for Unity.","src":"doc","g":"assets"},{"id":"GD-26","ex":["GD","AA"],"d":"Asset Management","q":"What happens when you drag a GameObject from the Hierarchy into the Project window?","o":["It duplicates the current scene","It creates a Prefab asset","It deletes the GameObject from the scene","It creates a new empty scene"],"a":1,"w":["Scenes are duplicated with Ctrl/Cmd+D in the Project window.",null,"The original stays in the scene and becomes a prefab instance (blue icon).","New scenes are made from File > New Scene."],"r":"","e":"This is the standard way to turn a configured GameObject into a reusable Prefab.","src":"doc","g":"prefab"},{"id":"GD-27","ex":["GD","AA"],"d":"Asset Management","q":"What is a Prefab Variant?","o":["An unrelated, brand-new Prefab","A Prefab that inherits from a base Prefab but overrides specific properties","A compressed copy of a Prefab","A Prefab converted into a scene"],"a":1,"w":["A Variant is linked to its base, not unrelated.",null,"Prefabs are not compressed copies.","Prefabs and scenes are different asset types."],"r":"","e":"Variants let you customize instances while still inheriting future changes from the base Prefab.","src":"doc","g":"prefab"},{"id":"GD-28","ex":["GD","AA"],"d":"Asset Management","q":"What do .meta files store?","o":["Scene layout data","Import settings and the unique ID Unity uses to track an asset","Backup copies of scripts","Final build output"],"a":1,"w":["Scene layout lives in the .unity scene file.",null,".meta files are not backups.","Build output is written to the build folder."],"r":"","e":"Every imported asset gets a .meta file holding its GUID and import settings — never delete it separately from the asset.","src":"doc","g":"assets"},{"id":"GD-29","ex":["GD","AA"],"d":"Asset Management","q":"Why are textures commonly sized as powers of two (e.g., 512x512, 1024x1024)?","o":["It's a strict requirement on all platforms","They compress more efficiently and are handled better by GPU mipmapping","It only matters for audio assets","It has no real performance effect"],"a":1,"w":["Non-power-of-two textures are allowed; some compression formats and mipmaps just handle them less well.",null,"Power-of-two sizing is a texture concern, not an audio one.","It affects compression support and mipmap quality."],"r":"","e":"Power-of-two textures work best with mipmapping and common GPU compression formats.","src":"doc","g":"assets"},{"id":"GD-30","ex":["GD","AA"],"d":"Asset Management","q":"Is a Unity project stored as a single file?","o":["Yes, always a single .unity file","No — it's a folder structure of assets, settings, and metadata","Only when exported for the Asset Store","Only in 2D projects"],"a":1,"w":["A .unity file is one scene, not the whole project.",null,"Even Asset Store packages (.unitypackage) are archives of many files.","2D and 3D projects use the same folder structure."],"r":"","e":"A Unity project is a directory containing Assets, ProjectSettings, Packages, and other folders.","src":"doc","g":"assets"},{"id":"GD-31","ex":["GD","AA"],"d":"Asset Management","q":"Which window lets you view, sort, and organize all assets in a project?","o":["Inspector","Project window","Console","Hierarchy"],"a":1,"w":["The Inspector shows the properties of the current selection.",null,"The Console shows logs, warnings and errors.","The Hierarchy shows GameObjects in the open scenes."],"r":"","e":"The Project window shows the full asset folder structure of the project.","src":"doc","g":"assets"},{"id":"GD-32","ex":["GD","AA"],"d":"Asset Management","q":"What is a Nested Prefab?","o":["A Prefab with no children","A Prefab instance placed inside another Prefab, retaining its own link to its source","A duplicated Prefab file","A Prefab converted into a scene file"],"a":1,"w":["A prefab with no children is just a simple prefab.",null,"A duplicate prefab file is independent and has no link to the original.","Prefabs cannot be converted into scenes."],"r":"","e":"Nested Prefabs let you compose larger Prefabs from smaller, independently-updatable Prefab instances.","src":"doc","g":"prefab"},{"id":"GD-33","ex":["GD","AA"],"d":"Asset Management","q":"Which strategy helps reduce final build size?","o":["Import all assets at maximum resolution regardless of use","Compress textures/audio appropriately and remove unused assets","Avoid using Addressables/Asset Bundles entirely","Keep every asset fully uncompressed"],"a":1,"w":["Max resolution on everything bloats the build and memory.",null,"Addressables and Asset Bundles help control content size and delivery.","Uncompressed assets give the largest build."],"r":"","e":"Right-sizing compression and stripping unused content are the standard ways to control build size.","src":"doc","g":"assets"},{"id":"GD-34","ex":["GD","AA","PA"],"d":"Animation","q":"Which system manages transitions between animation states based on parameters?","o":["Timeline","Animator Controller","Animation Curve","Sprite Renderer"],"a":1,"w":["Timeline sequences cinematics on tracks; it isn't a parameter-driven state machine.",null,"An Animation Curve is one property's value over time.","Sprite Renderer draws sprites."],"r":"","e":"The Animator Controller is a state machine that transitions between clips based on parameters.","src":"doc","g":"animator"},{"id":"GD-35","ex":["GD","AA","PA"],"d":"Animation","q":"What is a Blend Tree used for?","o":["Merging multiple scenes together","Smoothly blending between animations based on a parameter like speed or direction","Compressing animation clip file size","Syncing audio to a single animation only"],"a":1,"w":["Scenes are combined with additive scene loading, not Blend Trees.",null,"Clip size is reduced with animation compression in import settings.","Blend Trees blend motion clips; they don't sync audio."],"r":"","e":"Blend Trees interpolate between clips (e.g., walk/run) based on continuous parameter values.","src":"doc","g":"blendtree"},{"id":"GD-36","ex":["GD","AA","PA"],"d":"Animation","q":"Which component must be on a GameObject to play an Animator Controller?","o":["Animation","Animator","Rigidbody","Skinned Mesh Renderer"],"a":1,"w":["Animation is the legacy component that plays clips without a controller.",null,"Rigidbody is physics.","Skinned Mesh Renderer deforms and draws the mesh. The Animator moves the bones."],"r":"","e":"The Animator component references and runs an Animator Controller asset.","src":"doc","g":"animator"},{"id":"GD-37","ex":["GD","AA","PA"],"d":"Animation","q":"What does Root Motion do?","o":["Controls camera movement","Lets the animation clip itself drive the GameObject's actual position/movement","Rigs bones for import only","Bakes lightmaps for animated objects"],"a":1,"w":["Cameras are moved by scripts, Cinemachine or Timeline.",null,"Rigging is set on the model's Rig import tab.","Root Motion has nothing to do with lightmaps."],"r":"","e":"With Root Motion enabled, the character's movement in the clip translates directly to world-space movement.","src":"doc","g":"lightmodes"},{"id":"GD-38","ex":["GD","AA","PA"],"d":"Animation","q":"What is an Animation Event?","o":["A UI popup window","A function call triggered at a specific frame or time within a clip","A physics trigger volume","A particle effect preset"],"a":1,"w":["UI popups are UI elements.",null,"Trigger volumes are colliders with Is Trigger.","Particle presets are Particle System assets."],"r":"","e":"Animation Events call a chosen script method at a specific point in the timeline of a clip (e.g., a footstep sound).","src":"doc","g":"animator"},{"id":"GD-39","ex":["GD","AA","PA"],"d":"Animation","q":"What does an Avatar define in Unity's animation system?","o":["A player's user profile","A mapping of a model's bone structure used to retarget humanoid animations","A texture atlas layout","A UI icon set"],"a":1,"w":["Unity's Avatar is a bone mapping, not a user profile.",null,"Texture atlases are made with Sprite Atlas or DCC tools.","UI icons are sprites."],"r":"","e":"The Avatar lets humanoid animations be shared/retargeted across different character rigs.","src":"doc","g":"animator"},{"id":"GD-40","ex":["GD","AA","PA"],"d":"Animation","q":"Which Animator parameter type is best suited to trigger a one-shot action like a jump?","o":["Float","Trigger","Vector3","String"],"a":1,"w":["Float suits continuous values like Speed.",null,"The Animator has no Vector3 parameter type.","The Animator has no String parameter type."],"r":"","e":"Trigger parameters fire once and automatically reset, ideal for instantaneous actions.","src":"doc","g":"animator"},{"id":"GD-41","ex":["GD","AA","PA"],"d":"Animation","q":"What does the Layers feature in the Animator window enable?","o":["Sorting render order","Blending or overriding animations for different body parts (e.g., upper vs. lower body)","Managing physics layers","Controlling lighting layers"],"a":1,"w":["Render order is set by sorting layers or the render queue.",null,"Physics layers live in Tags & Layers and the Collision Matrix.","Lighting layers are a render pipeline feature, unrelated to Animator layers."],"r":"","e":"Animator Layers let separate state machines drive different parts of a character and blend together.","src":"doc","g":"animator"},{"id":"GD-42","ex":["GD","AA","PA"],"d":"Lighting","q":"What does 'baking' lighting mean in Unity?","o":["Compiling C# scripts","Precomputing static lighting/shadows into lightmaps for runtime performance","Exporting a platform build","Rendering a texture atlas"],"a":1,"w":["Script compilation is not baking.",null,"Exporting a build is File > Build Profiles / Build Settings.","Atlases are packed, not baked."],"r":"","e":"Baking calculates lighting ahead of time so the GPU doesn't have to compute it every frame.","src":"doc","g":"lightmodes"},{"id":"GD-43","ex":["GD","AA","PA"],"d":"Lighting","q":"What is a Lightmap?","o":["A script controlling light intensity","A texture storing precomputed lighting information for static objects","A UI layout element","A camera exposure setting"],"a":1,"w":["A script can change light intensity, but that isn't a lightmap.",null,"Lightmaps are textures, not UI.","Exposure is a camera or post-processing setting."],"r":"","e":"Lightmaps are baked textures applied to static geometry to store lighting data.","src":"doc","g":"lightmodes"},{"id":"GD-44","ex":["GD","AA","PA"],"d":"Lighting","q":"What is the key difference between Realtime and Baked lighting?","o":["There is no real difference","Realtime recalculates every frame (dynamic); Baked is precomputed and static","Baked lighting only works in 2D projects","Realtime lighting is always cheaper"],"a":1,"w":["They differ greatly in runtime cost and flexibility.",null,"Baked lighting works in 3D (and 2D URP has its own lights).","Realtime lighting is usually the more expensive option."],"r":"","e":"Realtime lighting updates continuously and costs more at runtime; baked lighting is precomputed once.","src":"doc","g":"lightmodes"},{"id":"GD-45","ex":["GD","AA","PA"],"d":"Lighting","q":"Which light type simulates the sun, casting parallel rays across the entire scene?","o":["Point Light","Spot Light","Directional Light","Area Light"],"a":2,"w":["Point lights radiate in all directions from one position, with limited range.","Spot lights emit a cone from one position.",null,"Area lights are rectangles or discs and are mostly bake-only in Built-in/URP."],"r":"","e":"A Directional Light has no position, only a direction, mimicking distant sunlight.","src":"doc","g":"lightmodes"},{"id":"GD-46","ex":["GD","AA","PA"],"d":"Lighting","q":"What must a static GameObject be marked as to properly contribute to and receive baked lighting?","o":["Dynamic","Static (Contribute GI)","Kinematic","Trigger"],"a":1,"w":["There is no \"Dynamic\" flag. Non-static objects are dynamic by default and get lit by probes.",null,"Kinematic is a Rigidbody setting.","Trigger is a Collider setting."],"r":"","e":"Marking an object's Static/Contribute GI flag tells the lightmapper to include it in baking.","src":"doc","g":"trigger"},{"id":"GD-47","ex":["GD","AA","PA"],"d":"Lighting","q":"What is a Light Probe used for?","o":["Lighting only static geometry","Capturing lighting data so moving/dynamic objects are lit correctly","Baking shadows on terrain exclusively","Controlling audio reverb zones"],"a":1,"w":["Static geometry uses lightmaps. Probes are for objects that move.",null,"Probes aren't terrain-specific or shadow-specific.","Reverb zones are audio."],"r":"","e":"Light Probes sample baked lighting at points in space so dynamic objects passing through are lit consistently.","src":"doc","g":"probes"},{"id":"GD-48","ex":["GD","AA","PA"],"d":"Lighting","q":"What does a Reflection Probe capture?","o":["Shadow map resolution","The surrounding environment, for use on reflective materials","Animation curve data","Particle system data"],"a":1,"w":["Shadow map resolution is a quality / URP Asset setting.",null,"Animation curves are animation data.","Particle data belongs to the Particle System."],"r":"","e":"Reflection Probes bake a cubemap of the surroundings so reflective surfaces show the correct environment.","src":"doc","g":"probes"},{"id":"GD-49","ex":["GD","AA","PA"],"d":"Materials & Effects","q":"What does a Shader define?","o":["Physics collision behavior","How a surface is rendered, including lighting and texture calculations","Audio playback routing","Animation timing curves"],"a":1,"w":["Physics behavior is set by Colliders, Rigidbodies and Physic Materials.",null,"Audio routing is done in the Audio Mixer.","Animation timing curves are animation data."],"r":"","e":"Shaders are programs that determine how geometry and textures are rendered on screen.","src":"doc","g":"shader"},{"id":"GD-50","ex":["GD","AA","PA"],"d":"Materials & Effects","q":"What is the relationship between a Shader and a Material?","o":["A Material stores mesh geometry","A Material is an instance of a shader with specific texture/property values applied","A Material stores collision data","A Material stores script logic"],"a":1,"w":["Mesh geometry is stored in the Mesh asset (Mesh Filter).",null,"Collision data is stored in Colliders.","Logic is written in scripts."],"r":"","e":"Materials plug specific textures and parameter values into a shader to define a surface's final look.","src":"doc","g":"shader"},{"id":"GD-51","ex":["GD","AA","PA"],"d":"Materials & Effects","q":"Which render pipeline is Unity's modern, scalable option balancing performance and visual fidelity for general-purpose projects?","o":["Built-in Render Pipeline","Universal Render Pipeline (URP)","The Legacy Deferred Pipeline only","The Editor's default pipeline (none exists)"],"a":1,"w":["Built-in is the older legacy pipeline and is being phased out in favor of URP/HDRP.",null,"\"Legacy Deferred\" is a Built-in rendering path, not a modern pipeline.","Unity always has a default pipeline: URP in new templates."],"r":"","e":"URP is Unity's current recommended pipeline for most projects across platforms.","src":"doc","g":"pipeline"},{"id":"GD-52","ex":["GD","AA","PA"],"d":"Materials & Effects","q":"What does a Normal Map simulate on a low-poly surface?","o":["Color variation only","Fine surface detail and bumps without adding real geometry","Full transparency","Motion blur"],"a":1,"w":["Color comes from the albedo / base map.",null,"Transparency comes from alpha and Surface Type.","Motion blur is a post-processing effect."],"r":"","e":"Normal maps fake lighting responses for surface detail that isn't actually modeled in the mesh.","src":"doc","g":"pbr"},{"id":"GD-53","ex":["GD","AA","PA"],"d":"Materials & Effects","q":"Which system is used to create effects like fire, smoke, or rain?","o":["Animator Controller","Particle System","Terrain Tool","Light Probe Group"],"a":1,"w":["The Animator Controller animates objects; it doesn't spawn particles.",null,"The Terrain Tool sculpts landscapes.","Light Probe Groups store lighting samples."],"r":"","e":"The Particle System generates and animates large numbers of small sprites/meshes for effects.","src":"doc","g":"animator"},{"id":"GD-54","ex":["GD","AA","PA"],"d":"Materials & Effects","q":"What does a Material's Rendering Mode (e.g., Opaque, Transparent) control?","o":["Physics collision response","How transparency and blending are handled during rendering","Audio mixing behavior","Animation blend weights"],"a":1,"w":["Physics is unaffected by material rendering settings.",null,"Audio is unaffected by material rendering settings.","Blend weights are animation data."],"r":"","e":"Rendering Mode determines whether/how a surface blends with what's behind it. Unity 6 note: in URP/HDRP this is called Surface Type (Opaque/Transparent). \"Rendering Mode\" is the Built-in Standard shader name.","src":"doc","g":"shader"},{"id":"GD-55","ex":["GD","AA","PA"],"d":"Materials & Effects","q":"What commonly causes visual 'z-fighting' between two overlapping surfaces?","o":["Incorrect UV mapping only","Two surfaces sitting at nearly the same depth, causing flicker over which draws on top","Missing textures","Incorrect audio settings"],"a":1,"w":["Bad UVs cause stretched or misaligned textures, not depth flicker.",null,"Missing textures show magenta or plain color, not flicker.","Audio settings have no visual effect."],"r":"","e":"Z-fighting occurs when depth values are too close together for the renderer to consistently resolve draw order.","src":"doc","g":"shader"},{"id":"GD-56","ex":["GD","AA"],"d":"Audio","q":"Which component is required on a GameObject to play a sound?","o":["Audio Listener only","Audio Source","Audio Mixer","An Audio Clip with no source"],"a":1,"w":["An Audio Listener hears sound but doesn't play clips.",null,"An Audio Mixer routes and processes sound that sources play.","A clip is data. A source must play it."],"r":"","e":"An Audio Source references a clip and controls how/when it plays.","src":"doc","g":"audio"},{"id":"GD-57","ex":["GD","AA"],"d":"Audio","q":"How many Audio Listeners should typically exist in a scene?","o":["As many as there are sound sources","Exactly one","None","One per camera, regardless of active state"],"a":1,"w":["Many sources, one listener.",null,"With no listener you hear nothing.","Only one should be active, even with several cameras."],"r":"","e":"Unity expects a single active Audio Listener per scene (usually on the Main Camera); more than one causes warnings.","src":"doc","g":"audio"},{"id":"GD-58","ex":["GD","AA"],"d":"Audio","q":"What does the Audio Mixer allow you to do?","o":["Import 3D models","Group, route, and apply shared effects (reverb, ducking, etc.) to multiple sources","Bake scene lighting","Control animation blend weights"],"a":1,"w":["Models are imported through the Model Importer.",null,"Lighting is baked with the Lighting window.","Blend weights are animation data."],"r":"","e":"The Audio Mixer organizes sources into groups and applies effects/volume control across them.","src":"doc","g":"audio"},{"id":"GD-59","ex":["GD","AA"],"d":"Audio","q":"Setting an Audio Source's Spatial Blend fully to 3D means:","o":["Volume/panning stay constant regardless of distance","Volume and panning change based on distance/position relative to the Listener","The audio automatically becomes mono","The sound is disabled"],"a":1,"w":["That describes 2D (Spatial Blend 0).",null,"Spatial Blend doesn't downmix the file. The importer's Force To Mono does that.","The sound stays active."],"r":"","e":"3D spatial blend makes the sound behave positionally in the world relative to the Audio Listener.","src":"doc","g":"spatial"},{"id":"GD-60","ex":["GD","AA"],"d":"Audio","q":"Which audio formats does Unity commonly support on import?","o":["Only MP3","WAV, MP3, OGG Vorbis, and AIFF, among others","Only WAV","Only a proprietary Unity format"],"a":1,"w":["MP3 is supported, but so are many others.",null,"WAV is supported, but so are many others.","Unity imports standard formats and converts them for the target platform."],"r":"","e":"Unity supports a range of common audio formats for import, including WAV, MP3, OGG, and AIFF.","src":"doc","g":"audio"},{"id":"GD-61","ex":["GD","AA"],"d":"Audio","q":"What is 'audio ducking' typically used for?","o":["Raising music volume during dialogue","Automatically lowering background music when dialogue or key SFX play","Muting all audio in the scene","Converting mono audio to stereo"],"a":1,"w":["Ducking lowers volume. It doesn't raise it.",null,"Muting everything is AudioListener.pause or volume = 0.","Mono/stereo is an import setting."],"r":"","e":"Ducking temporarily reduces one audio group's volume so another (like dialogue) can be heard clearly.","src":"doc","g":"audio"},{"id":"GD-62","ex":["GD","AA"],"d":"Game Design","q":"What is a 'core game loop'?","o":["A programming for-loop","The central, repeating cycle of player actions (e.g., explore, fight, reward, repeat)","A looping audio track","A physics simulation step"],"a":1,"w":["A for-loop is a code construct, not a design term.",null,"A looping audio track is audio.","A physics step is FixedUpdate timing."],"r":"","e":"The core loop is the fundamental repeated sequence of actions that defines moment-to-moment play.","src":"doc","g":"feedback"},{"id":"GD-63","ex":["GD","AA"],"d":"Game Design","q":"What does 'player agency' refer to?","o":["A publishing contract clause","The degree of meaningful choice and control a player has over outcomes","An NPC's AI behavior script","The game's marketing plan"],"a":1,"w":["Contracts aren't player agency.",null,"NPC AI is the computer's behavior, not the player's choice.","Marketing has nothing to do with agency."],"r":"","e":"Player agency is about how much the player's decisions actually shape what happens.","src":"doc","g":"feedback"},{"id":"GD-64","ex":["GD","AA"],"d":"Game Design","q":"What is the main purpose of playtesting during development?","o":["To find bugs exclusively","To gather feedback on fun, balance, and usability from real players before release","To finalize marketing materials","To reduce build file size"],"a":1,"w":["QA finds bugs. Playtesting checks whether the game is fun and understandable.",null,"Marketing materials are not the goal of playtesting.","Build size is a technical concern."],"r":"","e":"Playtesting validates whether the game is actually fun and understandable, beyond just working correctly.","src":"doc","g":"feedback"},{"id":"GD-65","ex":["GD","AA"],"d":"Game Design","q":"What does 'game balance' primarily address?","o":["Visual symmetry in level layouts","Fairness and appropriate difficulty/challenge across mechanics","Frame rate stability","Audio mixing levels"],"a":1,"w":["Symmetry is a visual or layout choice.",null,"Frame rate is performance.","Mixing levels are audio."],"r":"","e":"Balance ensures mechanics, difficulty, and rewards feel fair and well-tuned relative to each other.","src":"doc","g":"feedback"},{"id":"GD-66","ex":["GD","AA"],"d":"Game Design","q":"What is a 'feedback loop' in game mechanics?","o":["An audio delay effect","A system where player actions produce results that influence future decisions","A rendering technique","A save-file backup system"],"a":1,"w":["An audio delay is an effect.",null,"That's a rendering technique, not a design concept.","Save backups are a technical system."],"r":"","e":"Feedback loops connect cause and effect for the player, reinforcing or discouraging certain play patterns.","src":"doc","g":"feedback"},{"id":"GD-67","ex":["GD","AA"],"d":"Game Design","q":"How does intrinsic motivation differ from extrinsic motivation?","o":["They are effectively the same thing","Intrinsic comes from enjoying the activity itself; extrinsic comes from external rewards","Extrinsic motivation is always stronger","Intrinsic motivation only applies in multiplayer games"],"a":1,"w":["They are distinct, and design treats them differently.",null,"Extrinsic rewards can undermine intrinsic enjoyment (the overjustification effect).","Both apply in any game."],"r":"","e":"Intrinsic motivation is enjoyment-driven; extrinsic motivation relies on rewards like points or unlocks.","src":"doc","g":"feedback"},{"id":"GD-68","ex":["GD","AA"],"d":"Game Design","q":"What is the purpose of a 'vertical slice' in development?","o":["A specific UI layout style","A small, polished portion of the game representing intended final quality across all systems","A terrain-cutting tool","A rendering optimization technique"],"a":1,"w":["It's a production milestone, not a UI style.",null,"Not a terrain tool.","Not a rendering technique."],"r":"","e":"A vertical slice demonstrates the full experience (art, audio, mechanics) in one representative section.","src":"doc","g":"feedback"},{"id":"GD-69","ex":["GD","AA"],"d":"Game Design","q":"What does 'onboarding' refer to in game design?","o":["Hiring new developers","Teaching new players the game's mechanics and controls, typically early on","Uploading a build to a storefront","The server login process"],"a":1,"w":["Hiring is HR onboarding, not game design.",null,"Uploading builds is distribution.","Login is a technical flow."],"r":"","e":"Onboarding covers the tutorials and early moments that teach players how to play.","src":"doc","g":"feedback"},{"id":"GD-70","ex":["GD","AA","PA"],"d":"Game Art","q":"What does 'polycount' refer to in 3D art?","o":["The number of textures on a model","The number of polygons in a 3D model, affecting performance","The number of animations attached","The number of materials only"],"a":1,"w":["Texture count is separate from polycount.",null,"Animation count is separate from polycount.","Material count is separate from polycount; it affects draw calls."],"r":"","e":"Polycount is a direct measure of geometric complexity and rendering cost.","src":"doc","g":"drawcall"},{"id":"GD-71","ex":["GD","AA","PA"],"d":"Game Art","q":"What is a Texture Atlas?","o":["A single large image combining multiple smaller textures to reduce draw calls","A 3D model file format","A lighting baking technique","An audio compression method"],"a":0,"w":[null,"Model formats include FBX and OBJ.","Lightmaps are baked, not atlased.","Audio compression is Vorbis, ADPCM and so on."],"r":"","e":"Combining textures into an atlas lets multiple objects share one texture, reducing draw calls.","src":"doc","g":"drawcall"},{"id":"GD-72","ex":["GD","AA","PA"],"d":"Game Art","q":"What does 'UV mapping' refer to?","o":["Lighting calculations","Projecting a 2D texture onto the surface of a 3D model","Defining physics collision shapes","Positioning cameras in a scene"],"a":1,"w":["Lighting is calculated by shaders and lights.",null,"Collision shapes are Colliders.","Camera placement is the Transform."],"r":"","e":"UV mapping defines how a flat texture wraps around a 3D mesh's surface.","src":"doc","g":"drawcall"},{"id":"GD-73","ex":["GD","AA","PA"],"d":"Game Art","q":"What is the benefit of Level of Detail (LOD) groups?","o":["They improve texture resolution automatically","They swap to lower-detail meshes as objects move farther from the camera, improving performance","They add more polygons automatically at a distance","They increase baked lighting quality"],"a":1,"w":["LOD reduces detail. It never increases texture resolution.",null,"LOD removes polygons at a distance.","LOD doesn't change lightmap quality."],"r":"","e":"LOD groups reduce mesh complexity for distant objects where fine detail isn't visible anyway.","src":"doc","g":"lod"},{"id":"GD-74","ex":["GD","AA","PA"],"d":"Game Art","q":"What is a Sprite Atlas used for in 2D game art?","o":["Slowing down rendering intentionally","Combining multiple 2D sprites into one texture to reduce draw calls","Adding 3D depth to 2D sprites","Controlling audio playback"],"a":1,"w":["Atlases speed rendering up.",null,"Depth comes from sorting or 3D setups.","Audio is unrelated."],"r":"","e":"Sprite Atlases are the 2D equivalent of texture atlases, batching multiple sprites into one texture.","src":"doc","g":"drawcall"},{"id":"GD-75","ex":["GD","AA","PA"],"d":"Game Art","q":"Why is 'silhouette readability' important in character/prop design?","o":["It affects file compression","It ensures a shape is recognizable from its outline alone, even without color/detail","It affects audio clarity","It controls animation playback speed"],"a":1,"w":["Compression is about file size.",null,"Clarity is an audio concern.","Playback speed is the Animator."],"r":"","e":"A strong, distinct silhouette helps players instantly recognize characters and objects at a glance.","src":"doc","g":"drawcall"},{"id":"GD-76","ex":["GD","AA","PA"],"d":"Game Art","q":"What is a 'draw call', and why does minimizing them matter?","o":["A UI button press, irrelevant to performance","An instruction sent to the GPU to render an object; fewer draw calls generally improve performance","A physics event affecting only collisions","A save/load file operation"],"a":1,"w":["Draw calls matter a lot for performance.",null,"Draw calls are rendering, not physics.","Not file I/O."],"r":"","e":"Each draw call has CPU/GPU overhead, so batching and reducing draw calls is a key optimization technique.","src":"doc","g":"drawcall"},{"id":"GD-77","ex":["GD","AA"],"d":"Industry Awareness","q":"What does 'live service game' typically mean?","o":["A one-time purchase game with no further updates","A game continuously updated post-launch with new content, events, and monetization","A game that only works offline","A game exclusive to consoles"],"a":1,"w":["That's a premium, one-time product.",null,"Live services are online by nature.","Live services span all platforms."],"r":"","e":"Live service games are designed for ongoing content updates and player retention after release.","src":"doc","g":"roles"},{"id":"GD-78","ex":["GD","AA"],"d":"Industry Awareness","q":"Which is a common monetization model for free-to-play mobile games?","o":["Physical retail sales only","In-app purchases and/or advertising","Cable subscription bundling","Government licensing fees"],"a":1,"w":["Retail is premium, not F2P.",null,"Not a game business model.","Not a game business model."],"r":"","e":"F2P mobile games typically monetize through IAP and/or ads rather than an upfront purchase price.","src":"doc","g":"roles"},{"id":"GD-79","ex":["GD","AA"],"d":"Industry Awareness","q":"What does 'crunch' refer to in the game industry?","o":["A specific scoring system in games","A period of extended overtime work near a deadline","A file compression algorithm","A type of marketing event"],"a":1,"w":["Not a scoring system.",null,"Not compression.","Not marketing."],"r":"","e":"Crunch describes intense, often unsustainable overtime periods common before major milestones or launches.","src":"doc","g":"roles"},{"id":"GD-80","ex":["GD","AA"],"d":"Industry Awareness","q":"What role does a publisher typically play in game development?","o":["Writing the game's source code","Providing funding, marketing, and distribution support for a developer's game","Performing QA testing exclusively","Composing the game's music"],"a":1,"w":["Developers write the code.",null,"QA can be part of a publisher deal, but it isn't their main role.","Composers write the music."],"r":"","e":"Publishers commonly fund, market, and distribute games so studios can focus on development.","src":"doc","g":"roles"},{"id":"GD-81","ex":["GD","AA"],"d":"Industry Awareness","q":"What does 'cross-platform play' refer to?","o":["Playing across multiple monitors at once","Players on different platforms (e.g., PC, console) playing together in the same session","Switching a game's art style","Dual-booting operating systems"],"a":1,"w":["Multi-monitor is a display setup.",null,"Art style isn't platform play.","Dual-booting is an OS concern."],"r":"","e":"Cross-platform play lets players on different hardware share the same online game session.","src":"doc","g":"roles"},{"id":"GD-82","ex":["GD","AA"],"d":"Employment Preparedness","q":"What is typically the most effective way to demonstrate skill to potential employers?","o":["A written resume alone","A portfolio showcasing completed, playable projects","A cover letter only","A list of installed software"],"a":1,"w":["Resumes help, but playable proof is stronger.",null,"A cover letter alone shows no skill.","A software list proves nothing."],"r":"","e":"A portfolio of finished, playable work is the strongest, most concrete evidence of applied skill.","src":"doc","g":"portfolio"},{"id":"GD-83","ex":["GD","AA"],"d":"Employment Preparedness","q":"What is a 'game jam'?","o":["A licensing negotiation between studios","A short, time-boxed event where developers build a game from scratch, often for portfolios","A marketing campaign for a launch","A source code repository"],"a":1,"w":["Not licensing.",null,"Not marketing.","Not a code repository."],"r":"","e":"Game jams (e.g., 48 hours) push developers to rapidly prototype and ship a small, complete project.","src":"doc","g":"portfolio"},{"id":"GD-84","ex":["GD","AA"],"d":"Employment Preparedness","q":"Why is version control (e.g., Git) considered an important professional skill?","o":["It's relevant to artists only","It tracks changes, enables collaboration, and allows reverting to earlier project states","It replaces the need for testing","It only matters on solo projects"],"a":1,"w":["Everyone on a team uses version control.",null,"Testing is still required.","It's essential even when working solo."],"r":"","e":"Version control is standard practice for tracking history and collaborating safely on shared codebases.","src":"doc","g":"portfolio"},{"id":"GD-85","ex":["GD","AA"],"d":"Employment Preparedness","q":"What should a game developer's portfolio ideally emphasize?","o":["A large quantity of unfinished prototypes","A few polished, complete projects demonstrating relevant skills","Concept art exclusively","Source code with no playable build"],"a":1,"w":["Unfinished work signals that you can't ship.",null,"Concept art suits art roles only.","Employers want to play the build."],"r":"","e":"Quality and completeness of a small number of projects is generally more persuasive than quantity alone.","src":"doc","g":"portfolio"},{"id":"GD-86","ex":["GD","AA"],"d":"Employment Preparedness","q":"What is the professional value of contributing to open-source or team projects?","o":["It has little to no professional value","It demonstrates collaboration skills and produces visible, verifiable work","It replaces the need for formal education entirely","It's relevant to artists only"],"a":1,"w":["It has strong professional value.",null,"It doesn't replace education.","Programmers benefit even more."],"r":"","e":"Collaborative contributions give employers verifiable evidence of teamwork and real-world code/asset quality.","src":"doc","g":"portfolio"},{"id":"GD-87","ex":["GD","AA","PP"],"d":"Project Management","q":"What is a 'Milestone' in game project management?","o":["A type of visual asset","A significant, agreed-upon checkpoint marking progress in development","A physics constraint setting","A rendering pipeline setting"],"a":1,"w":["Not an asset.",null,"Not physics.","Not rendering."],"r":"","e":"Milestones mark key checkpoints used to track whether a project is on schedule.","src":"doc","g":"scrum"},{"id":"GD-88","ex":["GD","AA","PP"],"d":"Project Management","q":"What does 'scope creep' refer to?","o":["A camera post-processing effect","The uncontrolled expansion of a project's features beyond its original plan","A lighting-related bug","A sound design technique"],"a":1,"w":["Not a camera effect.",null,"Not a lighting bug.","Not sound design."],"r":"","e":"Scope creep happens when new features keep getting added without adjusting timeline or resources, endangering the schedule.","src":"doc","g":"scrum"},{"id":"GD-89","ex":["GD","AA","PP"],"d":"Project Management","q":"What is the purpose of a Minimum Viable Product (MVP)?","o":["The final, fully polished release","The smallest version of the game that demonstrates its core functionality/value","A marketing trailer for investors","A legal contract template"],"a":1,"w":["That describes the gold master / final release.",null,"A trailer is marketing.","Not legal."],"r":"","e":"An MVP proves out the core concept with the least amount of work, before investing in full production.","src":"doc","g":"scrum"},{"id":"GD-90","ex":["GD","AA","PP"],"d":"Project Management","q":"Which project management approach organizes work into short, iterative cycles called sprints?","o":["Waterfall","Agile/Scrum","Six Sigma","Linear production"],"a":1,"w":["Waterfall is linear and phase-based.",null,"Six Sigma is manufacturing quality control.","Linear production is Waterfall-like."],"r":"","e":"Agile/Scrum breaks work into short sprints with regular review and adaptation, unlike a rigid Waterfall plan.","src":"doc","g":"scrum"},{"id":"GD-91","ex":["GD","AA","PP"],"d":"Project Management","q":"What is the purpose of a build/version numbering system (e.g., v1.2.3)?","o":["To make releases harder to track on purpose","To track and communicate progress and changes across releases","To set audio mixing levels","To manage baked lighting settings"],"a":1,"w":["Version numbers make tracking easier, not harder.",null,"Not audio.","Not lighting."],"r":"","e":"Version numbers give a clear, consistent way to identify and communicate what has changed between builds.","src":"doc","g":"scrum"},{"id":"GD-92","ex":["GD","AA","PP"],"d":"Project Management","q":"Why schedule playtesting regularly throughout development rather than only at the end?","o":["Regular playtesting isn't actually necessary","It allows fun, balance, and usability issues to be caught and fixed early, when cheaper to change","It fully replaces the need for QA","It only matters for multiplayer titles"],"a":1,"w":["Regular playtesting is necessary.",null,"Playtesting and QA serve different goals.","It matters for every genre."],"r":"","e":"Catching problems earlier in development is far cheaper than discovering them right before launch.","src":"doc","g":"scrum"},{"id":"GD-93","ex":["GD","AA","PP"],"d":"Project Management","q":"What is the purpose of a 'post-mortem' after a project ships?","o":["To delete unused assets from the repository","To reflect on what went well and what didn't, to improve future projects","To finalize the game's retail price","To update graphics drivers on team machines"],"a":1,"w":["Asset cleanup is housekeeping.",null,"Pricing is business.","Drivers are IT."],"r":"","e":"Post-mortems capture lessons learned to improve process and outcomes on the next project.","src":"doc","g":"scrum"},{"id":"GD-94","ex":["GD"],"d":"Services","q":"What does Unity Cloud Build provide?","o":["In-editor lighting previews","Automated building of your project in the cloud across platforms, without manual local builds","Audio hosting exclusively","A replacement for version control"],"a":1,"w":["Lighting previews happen in the Editor.",null,"It builds projects, not audio hosting.","It pulls from version control. It doesn't replace it."],"r":"","e":"Cloud Build automatically compiles builds for chosen platforms whenever the project changes, in the cloud. Unity 6 note: Cloud Build is now called Unity Build Automation (part of Unity DevOps).","src":"doc","g":"ugs"},{"id":"GD-95","ex":["GD"],"d":"Services","q":"What is Unity Analytics used for?","o":["Rendering dynamic shadows","Collecting data on player behavior to inform design and monetization decisions","Compressing textures on import","Managing Prefab variants"],"a":1,"w":["Shadows are rendering.",null,"Compression is set in the importer.","Prefab variants are an Editor workflow."],"r":"","e":"Analytics tracks player behavior/events to help teams make data-informed design and business decisions. Unity 6 note: Analytics is now part of Unity Gaming Services (UGS) Analytics.","src":"doc","g":"prefab"},{"id":"GD-96","ex":["GD"],"d":"Services","q":"What does Unity Ads allow developers to do?","o":["Sell physical merchandise directly","Integrate video/interactive ads into a game to generate revenue","Bake scene lighting automatically","Manage source control branches"],"a":1,"w":["Physical merchandise is outside Unity's services.",null,"Lighting is baked with the Lighting window.","Branches are managed by version control."],"r":"","e":"Unity Ads is a monetization service for showing video/playable ads inside a game.","src":"doc","g":"lightmodes"},{"id":"GD-97","ex":["GD"],"d":"Services","q":"What is Unity's In-App Purchasing (IAP) service used for?","o":["Managing Prefab variants across scenes","Implementing purchasable content/currency across multiple app stores with one API","Building custom shaders","Baking NavMesh data"],"a":1,"w":["Prefab management is an Editor workflow.",null,"Shaders are written in Shader Graph or HLSL.","NavMesh is baked by AI Navigation."],"r":"","e":"IAP provides a unified API to sell in-game content across different storefronts (App Store, Google Play, etc.).","src":"doc","g":"lightmodes"},{"id":"GD-98","ex":["GD"],"d":"Services","q":"What is Remote Config used for in Unity Gaming Services?","o":["Configuring local hardware drivers","Changing game parameters/settings remotely without requiring a new build submission","Configuring render pipeline settings only","Managing local save files"],"a":1,"w":["Hardware drivers are an OS concern.",null,"It can tune any game value, not only render settings.","Local saves are PlayerPrefs or file I/O."],"r":"","e":"Remote Config lets live game values be tuned server-side without resubmitting a new app build.","src":"doc","g":"ugs"},{"id":"GD-99","ex":["GD"],"d":"Services","q":"What is the benefit of Unity's multiplayer/networking services (e.g., Netcode for GameObjects)?","o":["They only function offline","They provide a framework for synchronizing game state across networked players","They replace the need for a Rigidbody","They only handle audio synchronization"],"a":1,"w":["Netcode is for online play.",null,"Physics still needs Rigidbodies.","It syncs gameplay state, not only audio."],"r":"","e":"Netcode solutions handle replicating and synchronizing gameplay state across clients over a network.","src":"doc","g":"ugs"},{"id":"GD-100","ex":["GD"],"d":"Services","q":"What is the purpose of Unity's Cloud Diagnostics / Crash and Exception Reporting?","o":["To improve in-game lighting","To automatically collect crash and exception data from players to help identify and fix bugs","To manage in-app purchases","To bake NavMesh data"],"a":1,"w":["Lighting is not diagnostics.",null,"Purchases are IAP.","NavMesh is AI Navigation."],"r":"","e":"Cloud Diagnostics surfaces real-world crash/exception reports from players' devices to speed up bug fixing. Unity 6 note: crash reporting now lives in Unity Cloud Diagnostics within the Unity Cloud dashboard.","src":"doc","g":"ugs"},{"id":"TA-1","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"Which menu path creates a new Tilemap in a scene?","o":["GameObject > 2D Object > Tilemap","Assets > Create > Tilemap","Window > 2D > Tilemap","Component > Rendering > Tilemap"],"a":0,"w":[null,"Assets > Create > 2D creates Tile assets or palettes, not a Tilemap in the scene.","Window > 2D > Tile Palette opens the palette window; it doesn't create a Tilemap.","There is no Component > Rendering > Tilemap entry. The Tilemap is created as a GameObject."],"r":"","e":"Tilemaps (and their parent Grid) are created via GameObject > 2D Object > Tilemap, with options like Rectangular, Hexagon, or Isometric.","src":"doc","g":"tilemap"},{"id":"TA-2","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"A Grid component defines the cell size and layout that its child Tilemaps use.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"The Grid component (on the parent object) sets cell size, gap, and layout (Rectangle, Hexagon, Isometric) shared by all Tilemaps beneath it.","src":"doc","g":"tilemap"},{"id":"TA-3","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"Which Tile Palette tool removes tiles from the Tilemap where you click or drag?","o":["Brush Tool","Eraser Tool","Fill Tool","Picker Tool"],"a":1,"w":["The Brush paints tiles; it doesn't remove them.",null,"Fill floods an area with tiles.","The Picker samples an existing tile so you can paint with it."],"r":"","e":"The Eraser Tool clears tiles from the cells you paint over, leaving them empty.","src":"doc","g":"tilemap"},{"id":"TA-4","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"Tiles can be placed or changed at runtime using a script call such as Tilemap.SetTile().","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Tilemap.SetTile() (and related API) lets you modify tiles programmatically at runtime, e.g., for procedural generation or destructible terrain.","src":"doc","g":"tilemap"},{"id":"TA-5","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"What is the purpose of a Rule Tile?","o":["It plays a sound when stepped on","It automatically chooses a different sprite variant depending on its neighboring tiles","It forces the Tilemap to use only one sprite","It disables collision on that tile only"],"a":1,"w":["Tiles don't play sounds by themselves.",null,"It does the opposite: it switches between many sprites.","Collision is per-tile via the Collider Type setting, not Rule Tile logic."],"r":"","e":"Rule Tiles apply configurable rules to automatically pick the correct sprite (e.g., edge, corner, center) based on which tiles are adjacent — ideal for paths, water, and walls. Rule Tiles come from the 2D Tilemap Extras package (installed with the 2D feature set).","src":"doc","g":"tilemap"},{"id":"TA-6","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"A Tilemap Renderer requires a Material to be assigned in order to correctly display tiles.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Like any renderer, the Tilemap Renderer needs a material (Unity assigns a default Sprite material automatically) to draw its tiles.","src":"doc","g":"tilemap"},{"id":"TA-7","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"Which Tilemap Renderer property controls whether tiles are batched into larger chunks or rendered as individual sprites?","o":["Mode (Chunk vs. Individual)","Sorting Layer","Mask Interaction","Detect Chunk Culling Bounds"],"a":0,"w":[null,"Sorting Layer sets draw order, not batching.","Mask Interaction sets how tiles respond to Sprite Masks.","Detect Chunk Culling Bounds sets how culling bounds are calculated, not batching mode."],"r":"","e":"The Mode setting on Tilemap Renderer switches between Chunk mode (batched, more performant) and Individual mode (per-sprite, useful when tiles need per-tile sorting).","src":"doc","g":"tilemap"},{"id":"TA-8","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"Hexagonal Tilemaps support both pointy-top and flat-top hexagon orientations.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Unity's Hexagon cell layout can be configured as either Point Top or Flat Top, matching different hex-grid art styles.","src":"doc","g":"tilemap"},{"id":"TA-9","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"Which component is responsible for visually drawing the tiles that have been painted onto a Tilemap?","o":["Tilemap","Tilemap Renderer","Grid","Tilemap Collider 2D"],"a":1,"w":["Tilemap stores the data but doesn't draw it.",null,"Grid defines the layout only.","The collider handles physics only."],"r":"","e":"The Tilemap component stores which tiles occupy which cells; the Tilemap Renderer actually draws them to the screen.","src":"doc","g":"tilemap"},{"id":"TA-10","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"A Tile Palette asset is saved inside the Scene file rather than as its own Project asset.","o":["True","False"],"a":1,"w":["The statement is false, so \"True\" is incorrect. See the explanation on the correct option.",null],"r":"","e":"A Tile Palette is saved as its own asset in the Project (typically a prefab-like file in a folder you choose), independent of any particular scene.","src":"doc","g":"tilemap"},{"id":"TA-11","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"What happens if you delete the parent Grid GameObject of several child Tilemaps?","o":["Only the Grid is removed; child Tilemaps remain in t
