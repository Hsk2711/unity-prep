s Scaler setting fixes this?","o":["UI Scale Mode = Scale With Screen Size, with Reference Resolution 1920×1080","UI Scale Mode = Constant Pixel Size","Render Mode = World Space","Increase each Text component's font size"],"w":[null,"That keeps the same pixel size, which is the cause of the problem.","That places UI in 3D space. It doesn't fix screen-relative scaling.","It's a manual fix that breaks at other resolutions."],"a":0,"r":"The canvas scales relative to the reference, so the UI keeps the same proportion of the screen.","e":"With Scale With Screen Size, set Match (Width ↔ Height) to 0.5 for mixed aspect ratios, or toward Height for landscape-first games. Combine it with proper anchors.","src":"new","g":"canvas"},{"id":"NGD-46","ex":["GD","AA"],"d":"UI","q":"Which UI system does Unity recommend for runtime and Editor UI built with UXML documents and USS style sheets?","o":["UI Toolkit","Unity UI (uGUI)","IMGUI","TextMeshPro"],"w":[null,"uGUI uses GameObjects with RectTransforms and Canvas, not UXML/USS.","IMGUI is the immediate-mode OnGUI() system, used mainly for Editor tools and debug.","TMP is a text renderer, not a full UI framework."],"a":0,"r":"UI Toolkit uses UXML (structure), USS (styling, CSS-like) and C# with a UIDocument component. It's Unity's newer UI system.","e":"Exam framing: uGUI = GameObject-based, good for world-space UI and animation. UI Toolkit = retained-mode, web-like, made for complex menus and Editor tools. UI Builder is the visual editor for UXML.","src":"new","g":"canvas"},{"id":"NGD-47","ex":["GD"],"d":"Programming","q":"What does this code print to the Console when the object is first created and enabled?","code":"void Start()  { Debug.Log(\"Start\"); }\nvoid Awake()  { Debug.Log(\"Awake\"); }\nvoid OnEnable(){ Debug.Log(\"OnEnable\"); }","o":["Awake, OnEnable, Start","Start, Awake, OnEnable","OnEnable, Awake, Start","Awake, Start, OnEnable"],"w":[null,"That's the order in the source file, but Unity calls them in its own fixed lifecycle order.","Awake always comes before OnEnable on the same script.","OnEnable comes right after Awake, before Start."],"a":0,"r":"Unity calls Awake, then OnEnable (if the object is active), then Start before the first Update. The order in the file doesn't matter.","e":"Lifecycle: Awake → OnEnable → Start → (FixedUpdate → physics → OnTrigger/OnCollision) → Update → coroutines → LateUpdate → render → OnDisable → OnDestroy. Use Awake for self-initialization, Start for references to other objects.","src":"new","g":"lifecycle"},{"id":"NGD-48","ex":["GD"],"d":"Programming","q":"Which code moves a character at a constant speed no matter the frame rate?","o":["transform.position += direction * speed * Time.deltaTime;","transform.position += direction * speed;","transform.position += direction * speed * Time.time;","transform.position = direction * speed;"],"w":[null,"This moves speed units every frame, so 144 fps moves faster than 30 fps.","Time.time is seconds since startup, so the movement keeps speeding up.","This sets a fixed position. It doesn't move the object over time."],"a":0,"r":"Multiplying by deltaTime (seconds since last frame) turns \"units per frame\" into \"units per second\".","e":"In FixedUpdate, Time.deltaTime returns fixedDeltaTime automatically. For Rigidbodies prefer rb.linearVelocity (Unity 6; formerly rb.velocity) or rb.MovePosition in FixedUpdate instead of changing the transform.","src":"new","g":"lifecycle"},{"id":"NGD-49","ex":["GD"],"d":"Programming","q":"You need to call a method on another component on the same GameObject many times per frame. What is the best practice?","o":["Cache the reference once (in Awake) with GetComponent<T>() and reuse it","Call GetComponent<T>() every time inside Update","Use GameObject.Find(\"Name\").GetComponent<T>() every frame","Make the target component static"],"w":[null,"It works, but it wastes CPU every frame.","Find scans the scene. It's very slow and breaks if the name changes.","Static breaks multiple instances and serialization."],"a":0,"r":"GetComponent has a lookup cost. Caching it in a field avoids repeating it every frame.","e":"Also: use [SerializeField] references assigned in the Inspector, TryGetComponent (no allocation in the Editor when missing), and avoid Find* in hot paths.","src":"new","g":"lifecycle"},{"id":"NGD-50","ex":["GD"],"d":"Programming","q":"What is the correct way to wait 2 seconds and then spawn an enemy using a coroutine?","code":"IEnumerator SpawnLater() {\n    yield return new WaitForSeconds(2f);\n    Instantiate(enemyPrefab);\n}","o":["StartCoroutine(SpawnLater());","SpawnLater();","Invoke(SpawnLater, 2f);","yield SpawnLater();"],"w":[null,"Calling an IEnumerator method directly runs none of its body.","Invoke takes a method name string and void methods. It can't run IEnumerators, and the delay would double here.","\"yield\" can only be used inside an iterator method."],"a":0,"r":"Coroutines must be started with StartCoroutine. Calling the method directly only creates the iterator and does nothing.","e":"Stop coroutines with StopCoroutine(handle) or StopAllCoroutines(). They also stop when the GameObject is deactivated. WaitForSeconds respects Time.timeScale; WaitForSecondsRealtime ignores it (useful in pause menus).","src":"new","g":"prefab"},{"id":"NGD-51","ex":["GD"],"d":"Programming","q":"A GameManager must survive when a new scene loads. What do you call?","o":["DontDestroyOnLoad(gameObject);","SceneManager.LoadScene(name, LoadSceneMode.Additive);","Destroy(gameObject, 0);","gameObject.SetActive(false);"],"w":[null,"Additive loading keeps the old scene too, but that isn't how to make one object persist.","That destroys it.","Inactive objects are still unloaded with their scene."],"a":0,"r":"This moves the root GameObject into a special scene that isn't unloaded on scene changes.","e":"Combine it with a singleton guard: if (Instance != null && Instance != this) { Destroy(gameObject); return; } Instance = this; DontDestroyOnLoad(gameObject); It only works on root GameObjects.","src":"new","g":"lifecycle"},{"id":"NGD-52","ex":["GD"],"d":"Programming","q":"Which data container is best for designer-editable item stats shared by many prefabs, without duplicating data on each instance?","o":["A ScriptableObject asset","A public static class","PlayerPrefs","A MonoBehaviour on every prefab with copied values"],"w":[null,"It isn't editable in the Inspector and isn't an asset.","PlayerPrefs stores small user settings on the device, not design data.","That duplicates data and makes balancing error-prone."],"a":0,"r":"ScriptableObjects are assets that store shared data. Many objects reference one asset, which saves memory and makes balancing easy.","e":"Create them with [CreateAssetMenu(menuName=\"Game/Item\")] public class ItemData : ScriptableObject { ... }. Changes made in Play Mode persist in the Editor, and they don't save at runtime in builds.","src":"new","g":"lifecycle"},{"id":"NGD-53","ex":["GD"],"d":"Physics","q":"A fast bullet with a Rigidbody passes straight through a thin wall. What setting helps most?","o":["Set the bullet Rigidbody's Collision Detection to Continuous (or Continuous Dynamic)","Set the wall collider to Is Trigger","Increase the bullet's Mass","Move the bullet in Update instead of FixedUpdate"],"w":[null,"Then nothing would ever block.","Mass doesn't stop tunneling.","Changing the transform directly skips physics entirely and makes tunneling worse."],"a":0,"r":"Continuous detection sweeps between physics steps so fast objects don't skip past thin colliders (tunneling).","e":"Alternatives: use a Raycast or SphereCast from the previous to the current position (hitscan), make walls thicker, or reduce Fixed Timestep (expensive).","src":"new","g":"lifecycle"},{"id":"NGD-54","ex":["GD"],"d":"Physics","q":"Which statement about OnTriggerEnter is TRUE?","o":["At least one of the two objects needs a Rigidbody (kinematic is fine), and at least one collider needs Is Trigger","It fires between two static colliders with Is Trigger checked","It needs both objects to have non-kinematic Rigidbodies","It fires even if both GameObjects are on layers that don't interact in the Collision Matrix"],"w":[null,"Static-to-static pairs aren't checked for messages.","One Rigidbody of any kind is enough.","Layers ignored in the matrix produce no events at all."],"a":0,"r":"Trigger messages need a Rigidbody on one participant. Two static colliders never generate events.","e":"Remember the 2D versions: OnTriggerEnter2D(Collider2D other) and OnCollisionEnter2D(Collision2D c) need Rigidbody2D and Collider2D. Mixing 2D and 3D physics never interacts.","src":"new","g":"collision"},{"id":"NGD-55","ex":["GD"],"d":"Physics","q":"Which Physics call checks whether the player is standing on ground, ignoring the player's own collider?","o":["Physics.Raycast(origin, Vector3.down, out hit, 1.1f, groundLayerMask)","Physics.Raycast(origin, Vector3.up, 100f)","GameObject.FindWithTag(\"Ground\")","Rigidbody.IsSleeping()"],"w":[null,"Upward, and too long. It detects ceilings.","That finds an object, not contact.","Sleeping means the body is at rest, not grounded."],"a":0,"r":"A short downward ray with a LayerMask that includes only the ground layers is the classic ground check.","e":"Variants: Physics.SphereCast or CheckSphere for wider feet, and CharacterController.isGrounded. Build masks with LayerMask.GetMask(\"Ground\").","src":"new","g":"collision"},{"id":"NGD-56","ex":["GD","AA"],"d":"Lighting","q":"A character walking through a baked-lit level looks flat and unlit compared to the environment. What is missing?","o":["Light Probes placed around the walkable area","Reflection Probes on the character","Marking the character as Static","Setting all lights to Realtime only"],"w":[null,"Reflection probes provide specular reflections, not diffuse baked light.","Moving objects must not be static, and lightmaps can't follow animation.","That loses the baked GI and costs more."],"a":0,"r":"Light Probes store baked indirect light at points so dynamic objects get matching lighting.","e":"Static scenery → lightmaps. Dynamic objects → Light Probes (or Adaptive Probe Volumes in Unity 6 URP/HDRP). Shiny surfaces → Reflection Probes.","src":"new","g":"probes"},{"id":"NGD-57","ex":["GD","AA"],"d":"Lighting","q":"Which Light Mode lets static objects receive baked indirect light while the light still casts realtime shadows from moving objects?","o":["Mixed","Baked","Realtime","Important"],"w":[null,"Baked lights contribute nothing in realtime, so no dynamic shadows.","Realtime-only lights don't bake indirect light (without Realtime GI).","That's a Built-in per-pixel render mode, not a Light Mode."],"a":0,"r":"Mixed lights bake indirect lighting (and optionally shadows, depending on Lighting Mode such as Shadowmask or Subtractive) and still light dynamic objects in realtime.","e":"Mixed Lighting Modes: Baked Indirect (realtime shadows, baked bounce), Shadowmask (baked shadows from static objects, blended with realtime), Subtractive (cheapest, one light, lower quality).","src":"new","g":"lightmodes"},{"id":"NGD-58","ex":["GD","AA"],"d":"Materials & Effects","q":"In URP, which material setting makes a glass window see-through?","o":["Surface Type = Transparent (with alpha < 1 in Base Map color)","Rendering Mode = Fade","Alpha Clipping only","Increase Smoothness to 1"],"w":[null,"That's the Built-in Standard shader. It doesn't exist on URP/Lit.","Alpha Clipping cuts pixels fully on or off. It suits foliage, not partial glass.","Smoothness makes it shiny, not transparent."],"a":0,"r":"URP/Lit uses Surface Type Opaque/Transparent instead of the Built-in Standard shader's Rendering Mode.","e":"Watch out: transparent objects don't write depth by default, can sort wrongly, and cost more (overdraw). Use Alpha Clipping (cutout) for leaves and fences.","src":"new","g":"pipeline"},{"id":"NGD-59","ex":["GD","AA"],"d":"Materials & Effects","q":"An explosion effect needs debris that bounces off the floor. Which Particle System module do you enable?","o":["Collision","Shape","Renderer","Color over Lifetime"],"w":[null,"Shape defines where particles spawn from.","Renderer defines how particles are drawn.","That module only changes color."],"a":0,"r":"The Collision module lets particles collide with planes or the world and bounce, die, or send messages.","e":"For GPU-scale effects (millions of particles) use the VFX Graph (URP/HDRP compute). Particle System (Shuriken) is CPU-based and has broad platform support.","src":"new","g":"shader"},{"id":"NGD-60","ex":["GD"],"d":"Asset Management","q":"Which modern Unity system loads content by address and supports remote content and memory management via reference counting?","o":["Addressables","The Resources folder","Prefab Variants","The Library folder"],"w":[null,"Resources loads by path, but everything in it is always included in the build. Unity discourages it.","Variants are an editing workflow, not a loading system.","Library is a local import cache. It's never committed or shipped."],"a":0,"r":"The Addressables package wraps Asset Bundles with addresses, groups, async loading and Release() reference counting.","e":"Load with Addressables.LoadAssetAsync<T>(\"key\") or InstantiateAsync. Always Release the handle. Groups define bundle packing and local or remote paths.","src":"new","g":"prefab"},{"id":"NGD-61","ex":["GD"],"d":"Asset Management","q":"Which folders of a Unity project should be committed to version control?","o":["Assets, Packages and ProjectSettings","Library and Temp","Only the Assets folder","Everything including Library"],"w":[null,"Those are machine-specific caches, regenerated on import.","Without Packages/manifest.json and ProjectSettings the project won't reproduce.","Library is huge and causes conflicts. Never commit it."],"a":0,"r":"These contain your content, package manifest and settings. Library, Temp, Logs, obj and UserSettings are generated locally.","e":"Use the official Unity .gitignore, Git LFS for large binaries (PSD, FBX, WAV), Force Text serialization and Visible Meta Files (both defaults now). Always commit .meta files.","src":"new","g":"assets"},{"id":"NGD-62","ex":["GD"],"d":"Services","q":"Which Unity Gaming Services product stores per-player data such as saves on a server?","o":["Cloud Save","Remote Config","Analytics","Build Automation"],"w":[null,"Remote Config delivers settings from the server to the game, not player saves.","Analytics records events, not saves.","That builds projects."],"a":0,"r":"Cloud Save stores player (and game) data in the cloud, keyed per player after Authentication.","e":"Typical UGS stack: Authentication → Cloud Save / Economy / Leaderboards, Lobby + Relay + Netcode for multiplayer, Analytics, Remote Config, Unity Version Control (formerly Plastic SCM), Build Automation (formerly Cloud Build).","src":"new","g":"ugs"},{"id":"NGD-63","ex":["GD"],"d":"Services","q":"Your team needs version control that handles large binary art files well and is built into Unity's DevOps tools. Which service is it?","o":["Unity Version Control (formerly Plastic SCM)","Unity Analytics","Unity Remote Config","Unity Ads"],"w":[null,"Analytics is for player data.","Remote Config is for live settings.","Ads is for monetization."],"a":0,"r":"It's Unity's version control, strong with large binaries and offering file locking for artists.","e":"Git + LFS is also very common. The exam may ask about file locking: it stops two artists overwriting the same binary file, which can't be merged.","src":"new","g":"ugs"},{"id":"NGD-64","ex":["GD","AA"],"d":"Game Design","q":"Which is the best example of negative feedback (a balancing loop) in game design?","o":["Mario Kart giving stronger items to players in last place","Monopoly owners earning rent that buys more property","An RTS where more workers produce more resources to buy more workers","A score counter that never changes"],"w":[null,"That's positive feedback: the leader keeps growing their lead.","That's positive (snowballing) feedback.","Nothing loops there, so it's no feedback."],"a":0,"r":"Negative feedback helps whoever is behind, keeping the race close.","e":"Positive feedback amplifies differences and ends games decisively. Negative feedback narrows differences and prolongs tension. Good designs mix both.","src":"new","g":"feedback"},{"id":"NGD-65","ex":["GD","AA"],"d":"Game Design","q":"In a Game Design Document (GDD), what does the \"core pillars\" section capture?","o":["3–5 key experience goals that every feature is judged against","The full source code architecture","The marketing budget","The list of voice actors"],"w":[null,"That's a technical design doc.","That's business planning.","That's production."],"a":0,"r":"Pillars (for example \"fast, readable combat\") keep scope focused and help the team decide.","e":"A one-page GDD often has: high concept, pillars, core loop, target audience, platforms, monetization, and scope/MVP.","src":"new","g":"feedback"},{"id":"NGD-66","ex":["GD","AA"],"d":"Employment Preparedness","q":"A recruiter has 30 seconds to look at your portfolio. What should be at the top?","o":["Your best, most relevant project with a short video or GIF, a play link, and your specific role","An alphabetical list of every tutorial project","A long paragraph about your passion for games","Download-only zip files with no preview"],"w":[null,"It hides your best work and signals quantity over quality.","Show work before telling.","Recruiters rarely download unknown builds."],"a":0,"r":"Lead with impact. Show the result and say exactly what you did.","e":"Tailor the portfolio to the role (a programmer shows systems and code samples, an artist shows breakdowns and wireframes), and keep it short: 3–5 strong pieces.","src":"new","g":"portfolio"},{"id":"NMORE-67","ex":["GD","PP"],"d":"Programming","q":"What does [System.Serializable] on a plain C# class allow?","code":"[System.Serializable] public class Wave { public int count; public float delay; }\npublic class Spawner : MonoBehaviour { public Wave[] waves; }","o":["Its fields show as a nested, editable group in the Inspector and get saved with the scene or prefab","It makes the class a component you can add to GameObjects","It lets the class be networked automatically","It makes the class thread-safe"],"w":[null,"Only MonoBehaviour subclasses are components.","Serialization isn't networking.","It has nothing to do with threading."],"a":0,"r":"Unity serializes plain classes marked [Serializable] when a MonoBehaviour or ScriptableObject field uses them.","e":"Unity serializes public or [SerializeField] fields of supported types: primitives, enums, strings, Unity objects, arrays and List<T> of those, and [Serializable] classes and structs. It doesn't serialize Dictionaries, properties or static fields.","src":"new","g":"lifecycle"},{"id":"NMORE-68","ex":["GD","PP"],"d":"Programming","q":"Which method is called when a GameObject leaves a 2D trigger?","o":["OnTriggerExit2D(Collider2D other)","OnTriggerExit(Collider other)","OnCollisionExit2D(Collider2D other)","OnTriggerLeave2D(Collider2D other)"],"w":[null,"That's the 3D version. It never fires for 2D colliders.","Collision callbacks are for non-trigger contacts and take Collision2D.","That isn't a Unity message."],"a":0,"r":"2D physics messages end in 2D and take Collider2D or Collision2D.","e":"A misspelled message name compiles fine but is never called, which is a classic bug. Check exact names and parameter types.","src":"new","g":"trigger"},{"id":"NMORE-69","ex":["GD","PP"],"d":"Programming","q":"What is the difference between Destroy(gameObject) and Destroy(this)?","o":["Destroy(gameObject) removes the whole object. Destroy(this) removes only this script component","They're identical","Destroy(this) deletes the prefab asset from the project","Destroy(gameObject) only disables it"],"w":[null,"They target different objects.","Runtime Destroy never deletes assets.","Use SetActive(false) for that."],"a":0,"r":"\"this\" is the MonoBehaviour instance, so only the component is destroyed.","e":"Destroy happens at the end of the current frame. Use DestroyImmediate only in Editor scripts. Destroy(obj, 3f) delays destruction.","src":"new","g":"lifecycle"},{"id":"NMORE-70","ex":["GD","PP"],"d":"Programming","q":"Where should you subscribe to and unsubscribe from C# events on a MonoBehaviour?","o":["Subscribe in OnEnable, unsubscribe in OnDisable","Subscribe in Update every frame","Subscribe in Awake and never unsubscribe","Subscribe in OnDestroy"],"w":[null,"That adds duplicate handlers every frame.","That leaves dangling handlers on disabled or destroyed objects.","That's too late. The object is going away."],"a":0,"r":"This pairs the lifetime correctly, even when objects are toggled or pooled.","e":"Symmetry rule: Awake↔OnDestroy, OnEnable↔OnDisable. This avoids MissingReferenceException and memory leaks from static events.","src":"new","g":"lifecycle"},{"id":"NMORE-71","ex":["GD","PP"],"d":"Programming","q":"Which code correctly rotates an object smoothly toward a target over time?","o":["transform.rotation = Quaternion.RotateTowards(transform.rotation, targetRot, degPerSec * Time.deltaTime);","transform.rotation = targetRot * Time.deltaTime;","transform.eulerAngles += targetRot;","transform.LookAt(targetRot);"],"w":[null,"You can't multiply a quaternion by a float like that.","You can't add a quaternion to a Vector3.","LookAt takes a position or Transform, not a rotation."],"a":0,"r":"RotateTowards steps by a maximum angle each frame, giving constant angular speed.","e":"Use Quaternion.LookRotation(dir) to build a rotation from a direction, and Slerp for an eased approach. Avoid Euler angles for blending (gimbal lock).","src":"new","g":"lifecycle"},{"id":"NMORE-72","ex":["GD","PP"],"d":"Programming","q":"What does Vector3.Distance(a, b) return compared with (a - b).sqrMagnitude?","o":["The real distance. sqrMagnitude returns the squared distance, which is cheaper and fine for comparisons","Both return the same value","Distance returns a direction vector","sqrMagnitude returns a negative value for close objects"],"w":[null,"sqrMagnitude is the square.","It returns a float.","Squares are never negative."],"a":0,"r":"Comparing squared distances avoids a square root: if ((a-b).sqrMagnitude < r*r).","e":"Also: normalized (direction of length 1), Vector3.Dot (facing checks: > 0 is in front), Vector3.Cross (perpendicular), Lerp and MoveTowards.","src":"new","g":"lifecycle"},{"id":"NMORE-73","ex":["GD","PP"],"d":"Physics","q":"You need a character that walks up stairs and slopes without being pushed by physics. Which component is designed for this?","o":["CharacterController","A Rigidbody with Is Kinematic and gravity","A Wheel Collider","A Tilemap Collider 2D"],"w":[null,"Kinematic bodies ignore gravity.","Wheel Colliders are for vehicles.","That's 2D tile collision."],"a":0,"r":"CharacterController handles slope limit, step offset and collision without Rigidbody forces. Move it with controller.Move().","e":"CharacterController doesn't respond to forces. Apply gravity yourself. Use OnControllerColliderHit for its collision callbacks.","src":"new","g":"tilemap"},{"id":"NMORE-74","ex":["GD","PP"],"d":"Physics","q":"Two objects on the \"Player\" and \"PlayerBullet\" layers should never collide. Where do you configure this?","o":["Project Settings > Physics > Layer Collision Matrix, unticking Player × PlayerBullet","In each bullet's Tag","By setting both colliders to Is Trigger","In the Audio Mixer"],"w":[null,"Tags don't filter physics.","Triggers still detect overlaps.","Unrelated."],"a":0,"r":"The matrix filters layer pairs before any collision is processed.","e":"Per collider, Unity 2022+ also has Include/Exclude Layers on Colliders and Rigidbodies, plus Physics.IgnoreCollision for specific pairs at runtime.","src":"new","g":"audio"},{"id":"NMORE-75","ex":["GD","PP"],"d":"Physics","q":"Which force mode applies an instant change in velocity regardless of mass, such as a jump?","o":["ForceMode.VelocityChange","ForceMode.Force","ForceMode.Acceleration","ForceMode.Impulse"],"w":[null,"Force is continuous and depends on mass. Use it every FixedUpdate.","Acceleration is continuous and ignores mass.","Impulse is instant but divided by mass."],"a":0,"r":"VelocityChange ignores mass and changes velocity immediately.","e":"Force/Acceleration: continuous (apply every FixedUpdate). Impulse/VelocityChange: one-shot. Mass matters for Force and Impulse only.","src":"new","g":"trigger"},{"id":"NMORE-76","ex":["GD","PP"],"d":"Physics","q":"Which joint lets a door swing around a single axis with optional limits and a motor?","o":["Hinge Joint","Fixed Joint","Spring Joint","Character Joint"],"w":[null,"That locks two bodies together.","That pulls bodies together like a spring.","That's for ragdoll limbs with cone limits."],"a":0,"r":"The Hinge Joint constrains rotation to one axis and supports limits, springs and motors.","e":"Configurable Joint is the general-purpose joint. Break Force makes joints snap under load.","src":"new","g":"trigger"},{"id":"NMORE-77","ex":["GD","AA"],"d":"Asset Management","q":"You changed a Prefab instance's color in a scene and want ALL instances to update. What do you do?","o":["Use Overrides > Apply All on the instance (or edit the prefab asset in Prefab Mode)","Duplicate the instance into every scene","Unpack the prefab completely","Change the color in each instance manually"],"w":[null,"That doesn't link anything.","Unpacking breaks the link.","That's error-prone and doesn't keep a single source of truth."],"a":0,"r":"Applying pushes the override back to the source prefab, which updates every instance.","e":"Overridden properties show bold with a blue bar in the Inspector. Revert discards them. Prefab Mode in Context shows the prefab with the scene around it.","src":"new","g":"prefab"},{"id":"NMORE-78","ex":["GD","AA"],"d":"Asset Management","q":"Which audio import setting is best for many short, frequently played SFX like footsteps on mobile?","o":["Load Type = Decompress On Load, with ADPCM or PCM compression","Load Type = Streaming","Compression Format = Vorbis at 1% quality","Preload Audio Data off with Streaming"],"w":[null,"Streaming has overhead per playing instance. It's for long music.","That's quality loss and decode cost for no reason.","That's for long, rarely played clips."],"a":0,"r":"Short clips decode once and play with minimal CPU, which suits frequent playback.","e":"Music: Streaming + Vorbis. Medium dialog: Compressed In Memory. Short SFX: Decompress On Load (ADPCM). Force To Mono saves memory for 3D SFX.","src":"new","g":"assets"},{"id":"NMORE-79","ex":["GD","AA"],"d":"UI","q":"A health bar must always sit in the top-left corner with a 20 px margin on any resolution. How do you anchor it?","o":["Anchor preset top-left (anchor min/max = 0,1), pivot (0,1), position (20, -20)","Anchor to the middle-center with position (-900, 500)","Stretch anchors full-screen","Use World Space canvas"],"w":[null,"That works at one resolution only.","That makes the bar resize with the screen.","That has nothing to do with screen corners."],"a":0,"r":"Anchoring to the corner keeps a fixed offset from that corner.","e":"Hold Alt (sets the position) and Shift (sets the pivot) while clicking an anchor preset to snap there.","src":"new","g":"anchors"},{"id":"NMORE-80","ex":["GD","AA"],"d":"UI","q":"You want a UI Button to call PlayGame() on a MenuManager without writing listener code. Where do you set it?","o":["In the Button's On Click () UnityEvent list in the Inspector, assigning the MenuManager object and its public method","In the Canvas Scaler","In the EventSystem's First Selected field","In the Graphic Raycaster's Blocking Mask"],"w":[null,"The Canvas Scaler handles scaling only.","That only sets controller focus.","That's raycast filtering."],"a":0,"r":"UnityEvents can be wired in the Inspector to public methods.","e":"In code: button.onClick.AddListener(PlayGame). Remove it in OnDestroy if needed. For gamepads, set Navigation and the EventSystem's first selected object.","src":"new","g":"eventsystem"},{"id":"NMORE-81","ex":["AA","PA"],"d":"Materials & Effects","q":"Which Shader Graph target and setting creates a material that shows the back faces of a cloth plane?","o":["Set Render Face = Both (Two Sided) in the Graph Settings","Increase the Normal Strength","Set Surface to Transparent","Use Alpha Clipping threshold 1"],"w":[null,"That adds bump intensity, not back faces.","Transparency doesn't enable back faces.","That would clip everything."],"a":0,"r":"Two-sided rendering draws back faces. Normals may need flipping for lighting on back faces.","e":"Double-sided materials cost more fill. Use them selectively for leaves, cloth and paper.","src":"new","g":"shader"},{"id":"NMORE-82","ex":["AA","PA"],"d":"Materials & Effects","q":"In Shader Graph, which node creates procedural cloudy patterns without a texture?","o":["Simple Noise or Gradient Noise","Fresnel Effect","Sample Texture 2D","Split"],"w":[null,"That's view-angle rim.","That needs a texture asset.","Split separates vector channels."],"a":0,"r":"Noise nodes generate procedural values from UVs. Combine them with Time for animation.","e":"Combine nodes: Noise → Remap → Step or Smoothstep for a dissolve effect, feeding Alpha with Alpha Clipping, plus an emissive edge.","src":"new","g":"shader"},{"id":"NMORE-83","ex":["AA","PA"],"d":"Materials & Effects","q":"How do you create a dissolve effect where an object burns away?","o":["Compare a noise texture to a threshold with Step, feed it into Alpha with Alpha Clipping, and animate the threshold","Lower the Transparency of the material evenly","Scale the object to zero","Disable its MeshRenderer"],"w":[null,"That's a uniform fade, not a dissolve.","That's a shrink.","That's an instant disappear."],"a":0,"r":"Pixels below the threshold are clipped, so raising the threshold dissolves the object.","e":"Add an edge glow by using a slightly larger threshold for a colored emission band.","src":"new","g":"shader"},{"id":"NMORE-84","ex":["AA","PA"],"d":"Lighting","q":"What is the purpose of the Lighting window's Environment settings (Skybox Material, Environment Lighting Source)?","o":["They define ambient light and default reflections from the sky or a gradient for the whole scene","They set per-object shadow casting","They control post-processing","They set lightmap UVs"],"w":[null,"That's set on the Mesh Renderer.","Post is handled by Volumes.","UVs come from mesh import."],"a":0,"r":"Environment lighting is the base fill everywhere, and it's baked into GI when baked.","e":"Use the Sun Source field to bind a Directional Light to procedural sky. HDRP uses Visual Environment and Sky volume overrides instead.","src":"new","g":"shader"},{"id":"NMORE-85","ex":["AA","PA"],"d":"Lighting","q":"Which Mesh Renderer setting stops a small decorative object from casting shadows to save performance?","o":["Cast Shadows = Off","Receive Shadows = Off","Contribute Global Illumination","Motion Vectors"],"w":[null,"That only stops it receiving shadows. It still casts.","That's for baking.","Motion vectors are for motion blur and TAA."],"a":0,"r":"Each shadow caster renders into the shadow maps. Turning it off removes that cost.","e":"Shadows Only mode renders a shadow without drawing the mesh, which is useful for proxies.","src":"new","g":"lightmodes"},{"id":"NMORE-86","ex":["AA"],"d":"Asset Management","q":"Which texture compression format is the modern standard for Android and iOS?","o":["ASTC","DXT1/BC1","Uncompressed RGBA32","BC7"],"w":[null,"That's a desktop format.","Very large in memory.","BC7 is for desktop and consoles."],"a":0,"r":"ASTC is supported on modern mobile GPUs and offers flexible block sizes (4×4 high quality to 12×12 small).","e":"Use per-platform override tabs on the texture importer: max size, format and quality.","src":"new","g":"assets"},{"id":"NMORE-87","ex":["AA"],"d":"Asset Management","q":"What does the \"Max Size\" property on a texture importer do?","o":["It sets the maximum resolution the texture is imported at, downscaling larger sources","It sets the maximum file size in MB","It limits how many objects can use the texture","It controls the mipmap count"],"w":[null,"It's measured in pixels.","There's no such limit.","Mip count follows from resolution."],"a":0,"r":"You can keep a 4K source and ship it at 1024 to save memory.","e":"Check the memory cost shown at the bottom of the importer preview.","src":"new","g":"assets"},{"id":"NMORE-88","ex":["GD","AA"],"d":"Animation","q":"In the Animation window, what happens when Record mode is on and you move the selected object?","o":["A keyframe is created on the current time for the changed property","The object's prefab is overwritten","A Timeline track is created","The movement is saved into the scene and not the clip"],"w":[null,"Recording edits the clip only.","Timeline is separate.","In Record mode, changes go into the clip."],"a":0,"r":"Record mode captures Inspector or Scene changes as keys in the active clip.","e":"Use the Dopesheet for timing and Curves for easing. Tangent modes (Auto, Free, Linear, Constant) control interpolation.","src":"new","g":"animator"},{"id":"NMORE-89","ex":["GD","AA"],"d":"Animation","q":"Which Animator feature groups related states (for example all \"Combat\" states) into a nested graph?","o":["Sub-State Machine","Blend Tree","Animator Override Controller","Avatar Mask"],"w":[null,"A Blend Tree blends motions inside a single state.","An override controller swaps clips in a copy of the controller.","A mask limits body parts."],"a":0,"r":"A Sub-State Machine is a collapsible container of states with its own Entry and Exit.","e":"An Animator Override Controller reuses one state machine with different clips, for example a different weapon's animation set.","src":"new","g":"blendtree"},{"id":"NMORE-90","ex":["PP"],"d":"Core Interactions","q":"Which approach should a scalable interaction system use to detect what the player is looking at in first person?","o":["A raycast from the camera center each frame (or at an interval) against an \"Interactable\" layer mask, then call an interface method","OnMouseOver on every object","FindObjectsByType<Interactable>() every frame","Distance checks to every object in Update"],"w":[null,"That needs the mouse cursor and legacy input. It doesn't suit gamepads.","That's a full scene search every frame.","That costs O(n) per frame and doesn't check view direction."],"a":0,"r":"Raycast + layer mask + interface keeps it cheap and extensible.","e":"Add a UI prompt via events when the target changes, and debounce so you don't spam UI updates.","src":"new","g":"raycast"},{"id":"NMORE-91","ex":["PP"],"d":"Core Interactions","q":"A projectile should ignore the shooter's own collider. Which call does this at runtime?","o":["Physics.IgnoreCollision(bulletCollider, shooterCollider)","bullet.layer = 0","Destroy(shooterCollider)","Rigidbody.Sleep()"],"w":[null,"The Default layer probably still collides.","That breaks the shooter.","Sleep only pauses simulation temporarily."],"a":0,"r":"It disables collision between those two specific colliders.","e":"Or spawn the bullet on a layer that doesn't collide with the shooter's layer.","src":"new","g":"tilemap"},{"id":"NMORE-92","ex":["PP"],"d":"Application Systems","q":"Which pattern lets many systems react to \"PlayerDied\" without direct references to each other?","o":["An event channel (for example a ScriptableObject GameEvent that listeners register with) or a static event bus","Each system holding a public reference to every other system","Polling a global bool every frame","SendMessage to every GameObject"],"w":[null,"That's tight coupling (\"spaghetti\").","Wasteful and error-prone.","Slow and string-based."],"a":0,"r":"Decoupled publish/subscribe means the audio, UI and analytics systems don't need to know the player.","e":"ScriptableObject event channels are popular in Unity because they're Inspector-assignable and testable.","src":"new","g":"fsm"},{"id":"NMORE-93","ex":["PP"],"d":"Application Systems","q":"What is the risk of the classic singleton pattern (static Instance) in larger projects?","o":["Hidden global dependencies, initialization order issues and harder testing","They can't be used with MonoBehaviour","They always cause memory leaks","They're forbidden by Unity"],"w":[null,"MonoBehaviour singletons are common.","Not always.","Unity allows them."],"a":0,"r":"Singletons are convenient but couple code to globals. Use them sparingly or with service locators or dependency injection.","e":"Watch out for Enter Play Mode Options (domain reload off): static fields keep their values between plays, so reset them with [RuntimeInitializeOnLoadMethod].","src":"new","g":"fsm"},{"id":"NMORE-94","ex":["PP"],"d":"Application Systems","q":"Which feature changes text per language using string tables and asset tables?","o":["The Localization package (com.unity.localization)","TextMeshPro font fallback alone","PlayerPrefs","Addressables only"],"w":[null,"Fonts render glyphs. They don't translate.","That stores settings.","Addressables deliver content but don't translate."],"a":0,"r":"It provides Locales, String Tables and Asset Tables, plus LocalizeStringEvent components for UI.","e":"Smart Strings support plurals and variables. Plan for text expansion (German) and right-to-left languages in UI layouts.","src":"new","g":"fsm"},{"id":"NMORE-95","ex":["PP"],"d":"Optimization","q":"Where should you look first when the game stutters every few seconds on device?","o":["The Profiler connected to a development build on the device, checking the CPU timeline for GC.Collect and spikes","The Editor's Game view stats only","Increasing Quality settings","Removing all Debug.Log lines blindly"],"w":[null,"Editor overhead skews the results.","That makes it heavier.","That might help, but measure first."],"a":0,"r":"Profile on target hardware. Editor profiling isn't representative.","e":"Enable \"Autoconnect Profiler\" in the build. Incremental GC (Player Settings) spreads collection work over frames.","src":"new","g":"profiler"},{"id":"NMORE-96","ex":["PP"],"d":"Optimization","q":"What does occlusion culling do?","o":["It skips rendering objects hidden behind other objects, using baked visibility data","It hides objects outside the camera frustum","It reduces texture resolution","It removes unused scripts"],"w":[null,"That's frustum culling, which is automatic.","That's mip streaming.","Unrelated."],"a":0,"r":"Bake it in Window > Rendering > Occlusion Culling. Mark occluders and occludees static.","e":"It's best for dense indoor or city scenes. It has little benefit in open terrain. Unity 6 adds GPU occlusion culling with the GPU Resident Drawer.","src":"new","g":"profiler"},{"id":"NMORE-97","ex":["PP"],"d":"Teams & Testing","q":"What is a Unity Test Framework EditMode test best suited for?","o":["Pure logic like damage formulas, inventory rules and utility functions","Testing physics collisions over frames","Measuring GPU performance","Testing shader compilation on device"],"w":[null,"That needs PlayMode tests.","Use the Profiler.","That's done with device builds."],"a":0,"r":"EditMode tests run fast without entering Play Mode.","e":"Write testable code: keep logic in plain C# classes separate from MonoBehaviours (humble object pattern).","src":"new","g":"scrum"},{"id":"NMORE-98","ex":["PP"],"d":"Teams & Testing","q":"Which branching strategy reduces long, painful merges for a small game team?","o":["Short-lived feature branches merged often into main (trunk-based), with code review","One branch per developer that is merged at the end of the project","No version control, sharing a network folder","Committing the Library folder"],"w":[null,"That makes huge merges and late conflicts.","There's no history and you'll get overwrites.","That causes needless conflicts."],"a":0,"r":"Frequent integration keeps differences small.","e":"Use CI (Build Automation or GitHub Actions with game-ci) to build and run tests on each merge.","src":"new","g":"scrum"},{"id":"NMORE-99","ex":["PA"],"d":"Rendering 3D Objects","q":"Which Unity 6 feature reduces CPU draw call overhead for large numbers of static or instanced meshes in URP/HDRP?","o":["GPU Resident Drawer","Legacy Dynamic Batching","Turning on Read/Write for meshes","Using more unique materials"],"w":[null,"That's limited to small meshes and mostly irrelevant in SRP.","That adds memory with no batching benefit.","That breaks batching."],"a":0,"r":"It uses the BatchRendererGroup API to draw GameObjects with GPU instancing automatically, greatly reducing CPU cost.","e":"It needs the Forward+ rendering path in URP and the SRP Batcher on, and works best with shared materials and meshes.","src":"new","g":"pipeline"},{"id":"NMORE-100","ex":["PA"],"d":"Rendering 3D Objects","q":"A transparent water plane hides particles that are behind it. What is the most likely cause?","o":["Render queue or sorting order between transparent objects: they're sorted by distance, not depth-tested per pixel against each other","The particle material is opaque","The camera's far clipping plane","The water has no normal map"],"w":[null,"Opaque particles would draw correctly behind water.","Clipping affects distance only.","Normals don't affect sort order."],"a":0,"r":"Transparent objects don't write depth, so sorting decides order. Adjust Sorting Priority or the render queue.","e":"Sorting Priority on URP materials, Sorting Fudge on particle renderers, and the render queue (2500+ is transparent) are the tools to fix order.","src":"new","g":"pbr"},{"id":"NMORE-101","ex":["PA"],"d":"Rendering 3D Objects","q":"Which feature gives soft, smooth shading on a low-poly model's curved surfaces without adding polygons?","o":["Correct vertex normals (smoothing groups or hard/soft edges) in the DCC tool, imported with Normals = Import","Increasing texture resolution","Raising Smoothness to 1","Adding a Reflection Probe"],"w":[null,"Textures don't fix faceted shading.","That adds gloss, not smooth geometry shading.","Probes add reflections only."],"a":0,"r":"Shading follows the normals. Smooth normals make facets look round.","e":"Normals = Calculate with a Smoothing Angle (for example 60°) is the in-Unity fallback. Baked normal maps from high-poly models add fine detail.","src":"new","g":"probes"},{"id":"NMORE-102","ex":["PA"],"d":"Particles & Effects","q":"Which Particle System setting stops the effect from playing in world space when the emitter moves (for example engine flames that should trail)?","o":["Simulation Space: Local follows the emitter, World leaves particles behind","Start Lifetime","Prewarm","Max Particles"],"w":[null,"That's how long particles live.","That starts the loop as if it had already run.","That's a count cap."],"a":0,"r":"Use World for trails behind moving objects and Local for effects attached to the object.","e":"Scaling Mode (Hierarchy, Local, Shape) controls how transform scale affects the system. Culling Mode affects off-screen updates.","src":"new","g":"particles"},{"id":"NMORE-103","ex":["PA"],"d":"Particles & Effects","q":"Your mobile effect needs to stay under a performance budget. Which choice is best?","o":["Fewer, larger particles with a texture flipbook, low overdraw, and no realtime lights module","Thousands of tiny additive particles covering the screen","Turn on Collision with World at High Quality for every particle","Use VFX Graph on low-end GLES devices"],"w":[null,"Huge overdraw.","That's an expensive CPU cost.","Compute support may be missing."],"a":0,"r":"Particle count, overdraw and lights are the main costs.","e":"Use Max Particles caps, LOD-like culling, and the Profiler's Particle module. Pool particle systems instead of instantiating them.","src":"new","g":"particles"},{"id":"NMORE-104","ex":["PA"],"d":"Prototyping","q":"You want UI mockups that designers can quickly iterate on in-editor with styles shared across screens. Which tool combo is best?","o":["UI Builder with UI Toolkit (UXML + shared USS style sheets)","uGUI with hard-coded colors on every Image","IMGUI OnGUI calls","ProBuilder planes with textures"],"w":[null,"Changes have to be made everywhere.","Code-only and not designer-friendly.","Not a UI system."],"a":0,"r":"Shared USS classes let you restyle everything at once, and UI Builder is visual.","e":"USS supports variables (--main-color), pseudo-classes (:hover) and transitions, similar to CSS.","src":"new","g":"canvas"},{"id":"NMORE-105","ex":["PA"],"d":"2D Assets","q":"Which URP 2D feature lets sprites cast shadows from 2D lights?","o":["Shadow Caster 2D component (and Composite Shadow Caster 2D for groups)","Mesh Renderer Cast Shadows","A Sprite Mask","Tilemap Renderer Mode = Individual"],"w":[null,"That's for 3D meshes.","Masks clip sprites.","That's about sorting, not shadows."],"a":0,"r":"Shadow Caster 2D generates shadow shapes from sprite outlines or a custom shape.","e":"Turn on shadows on the Light 2D (Shadow Intensity). Tilemaps can use Tilemap Collider 2D with Shadow Caster 2D generation in recent versions.","src":"new","g":"tilemap"},{"id":"NMORE-106","ex":["PA"],"d":"2D Assets","q":"What does a Sprite Mask do?","o":["It shows or hides sprites inside or outside its shape, based on each sprite's Mask Interaction setting","It merges sprites into an atlas","It blocks UI clicks","It generates colliders"],"w":[null,"That's Sprite Atlas.","That's Raycast Target.","Colliders come from Collider 2D components."],"a":0,"r":"Mask Interaction: None, Visible Inside Mask, Visible Outside Mask.","e":"For UI, use the Mask or RectMask2D components instead. RectMask2D is cheaper for rectangular clipping.","src":"new","g":"tilemap"},{"id":"NMORE-107","ex":["PA"],"d":"Teams & Pipeline","q":"What is the benefit of using Presets in a team?","o":["They save component or importer settings as assets and apply them consistently, including defaults via the Preset Manager","They compress builds","They replace version control","They auto-generate art"],"w":[null,"That's not what they do.","They don't.","They don't create content."],"a":0,"r":"Presets standardize, for example, all UI textures as Sprite with no mipmaps.","e":"The Preset Manager can apply different defaults by filename filter (for example \"*_N\" → normal map).","src":"new","g":"assets"},{"id":"NMORE-108","ex":["GD","AA"],"d":"Industry Awareness","q":"What does \"LTS\" mean in Unity versions (for example Unity 6 LTS)?","o":["Long Term Support: a stable release that gets bug fixes for an extended period, recommended for production","Latest Test Snapshot","Lightweight Template Setup","Licensed Team Server"],"w":[null,"Not a Unity term.","Not a Unity term.","Not a Unity term."],"a":0,"r":"Teams ship on LTS to avoid breaking changes mid-project.","e":"Tech or Supported Updates streams bring newer features. Pin the version in ProjectVersion.txt and upgrade deliberately with backups.","src":"new","g":"audio"},{"id":"NMORE-109","ex":["GD","AA"],"d":"Industry Awareness","q":"What is an \"Early Access\" release model?","o":["Selling or releasing a game while it's still in development, and updating it with player feedback","A beta only for employees","A free demo with no updates","A console-exclusive launch"],"w":[null,"That's internal testing.","A demo is a sample, not an evolving product.","That's an exclusivity deal."],"a":0,"r":"It funds development and builds a community, but requires transparent roadmaps.","e":"Other models: premium, F2P (IAP/ads), subscription, and battle pass. Know the vocabulary of soft launch, retention (D1/D7/D30) and ARPDAU.","src":"new","g":"feedback"},{"id":"NMORE-110","ex":["GD","AA"],"d":"Project Management","q":"In Scrum, which meeting reviews HOW the team worked and decides on process improvements?","o":["Sprint Retrospective","Sprint Review","Daily Stand-up","Sprint Planning"],"w":[null,"That demos the work done.","That syncs progress and blockers.","That selects the work for the next sprint."],"a":0,"r":"The retro looks at the process. The Sprint Review looks at the product increment with stakeholders.","e":"Roles: Product Owner (backlog priority), Scrum Master (process, removes blockers), Development Team. Artifacts: Product Backlog, Sprint Backlog, Increment.","src":"new","g":"scrum"},{"id":"NMORE-111","ex":["GD","AA"],"d":"Project Management","q":"Which milestone typically means \"feature-complete, now only fixing bugs and polishing\"?","o":["Beta (after Alpha)","Prototype","Pre-production","Concept"],"w":[null,"That's early concept proof.","That's planning and the vertical slice.","That's ideas."],"a":0,"r":"Alpha = all features in a rough state. Beta = feature-complete, bug fixing. Gold/RC = release candidate.","e":"Typical pipeline: Concept → Pre-production (prototype, vertical slice) → Production (Alpha) → Beta → Release Candidate/Gold → Live ops.","src":"new","g":"scrum"},{"id":"NMORE-112","ex":["GD","PP"],"d":"Services","q":"Which UGS services together let players find each other and connect without a dedicated server, using a host?","o":["Lobby + Relay (with Netcode for GameObjects)","Cloud Save + Remote Config","Analytics + Ads","Build Automation + Version Control"],"w":[null,"Those handle data and config.","Those handle metrics and monetization.","Those are DevOps."],"a":0,"r":"Lobby matches players and Relay forwards traffic through Unity's servers, so the host needs no port forwarding.","e":"For dedicated servers, use Multiplay Hosting / Matchmaker. Authentication (anonymous sign-in) is required first.","src":"new","g":"ugs"},{"id":"NMORE-113","ex":["GD","PP"],"d":"Services","q":"A designer wants to A/B test enemy difficulty values for a live game without an app update. Which services fit?","o":["Remote Config with Game Overrides and audiences, plus Analytics to measure the outcome","Cloud Save","Version Control","Unity Ads"],"w":[null,"That's per-player data, not experiments.","That's for code.","That's monetization."],"a":0,"r":"Remote Config delivers different values per segment. Analytics measures retention and other results.","e":"Always have default in-build values in case the network is unavailable.","src":"new","g":"ugs"},{"id":"NPA-114","ex":["PA"],"d":"Rendering 3D Objects","q":"A character's normal map makes the lighting look inverted (bumps look like dents). What is the most likely cause?","o":["The normal map uses DirectX (Y−) convention while Unity expects OpenGL (Y+), so the green channel must be flipped","The texture's Filter Mode is Bilinear","The material's Metallic is too high","The model has too many polygons"],"w":[null,"Filtering doesn't invert lighting.","Metallic changes reflectance, not the bump direction.","Polycount doesn't invert normals."],"a":0,"r":"Unity uses OpenGL-style tangent-space normals. Flip green in the baker or texture tool.","e":"Also make sure Texture Type = Normal Map (Unity unpacks it correctly), the tangents are consistent (MikkTSpace on both ends), and sRGB is off for data textures (normal, mask, roughness).","src":"new","g":"pbr"},{"id":"NPA-115","ex":["PA"],"d":"Rendering 3D Objects","q":"Which textures should have the sRGB (Color Texture) checkbox turned OFF?","o":["Normal, metallic/smoothness, mask and height maps","Albedo/base color maps","Emission color maps","UI sprites"],"w":[null,"Base color is perceptual color data and should be sRGB.","Emission color is usually sRGB.","UI color art is sRGB."],"a":0,"r":"Data textures store linear values. sRGB conversion would corrupt them.","e":"Use Linear color space (Project Settings > Player) for correct PBR lighting. It's the default in modern templates.","src":"new","g":"pbr"},{"id":"NPA-116","ex":["PA"],"d":"Rendering 3D Objects","q":"In HDRP, the Lit shader's Mask Map packs four grayscale maps into one texture. Which channel layout is correct?","o":["R = Metallic, G = Ambient Occlusion, B = Detail Mask, A = Smoothness","R = Smoothness, G = Metallic, B = AO, A = Height","R = Albedo, G = Normal X, B = Normal Y, A = Emission","All four channels hold the same roughness value"],"w":[null,"That isn't HDRP's order. Wrong packing gives shiny dirt and metallic rubber.","Color and normal data never go in the mask map.","That wastes the packing and loses metallic and AO."],"a":0,"r":"This is HDRP's MODS packing. Tools like Substance Painter have an HDRP export preset that matches it.","e":"URP Lit is different: a Metallic map with Smoothness in its alpha (or albedo alpha) and a separate Occlusion map. Channel packing saves texture samples and memory. Document the team's convention.","src":"new","g":"pipeline"},{"id":"NPA-117","ex":["PA"],"d":"Rendering 3D Objects","q":"Which mesh import option should be off for a static prop that is never read or modified by script, to save memory?","o":["Read/Write Enabled","Generate Lightmap UVs","Import Normals","Weld Vertices"],"w":[null,"That's needed for baking. It doesn't add a runtime CPU copy.","Normals are required for lighting.","This reduces vertices. It doesn't cost memory."],"a":0,"r":"Turning it on keeps a CPU copy of the mesh in memory. Leave it off unless scripts or some features need mesh access.","e":"Mesh Compression (Low/Medium/High) reduces file size but can create precision artifacts. Optimize Mesh reorders vertices and indices for the GPU cache.","src":"new","g":"lightmodes"},{"id":"NPA-118","ex":["PA"],"d":"Rendering 3D Objects","q":"Thin foliage looks aliased and shimmers at a distance. Which combination helps most?","o":["Alpha Clipping with mipmaps, and Alpha To Coverage or TAA / MSAA where supported","Disable mipmaps","Use fully Transparent surfaces for all leaves","Increase the texture size to 8K"],"w":[null,"That makes shimmer worse.","That sorts badly and creates huge overdraw.","That adds memory and can make shimmer worse without mipmaps."],"a":0,"r":"MSAA with alpha-to-coverage smooths cutout edges, and mipmaps reduce shimmer.","e":"In URP: MSAA in the URP Asset, and TAA or SMAA/FXAA on the camera. HDRP: TAA or DLSS/FSR. SpeedTree assets have dedicated shaders and LOD crossfades.","src":"new","g":"scrum"},{"id":"NPA-119","ex":["PA"],"d":"Rendering 3D Objects","q":"Which feature reduces texture memory by loading only the mip levels the camera needs?","o":["Mipmap Streaming (Texture Streaming)","Sprite Atlas","GPU Instancing","Static Batching"],"w":[null,"Atlases reduce draw calls.","Instancing reduces draw calls.","That combines meshes."],"a":0,"r":"Unity streams mip levels on demand within a memory budget.","e":"Turn it on in Quality settings, then tick Streaming Mipmaps on each texture importer. Combine it with platform overrides: max size and format (ASTC, BC7, ETC2).","src":"new","g":"drawcall"},{"id":"NPA-120","ex":["PA"],"d":"Lighting","q":"A large open-world scene in Unity 6 URP needs indirect lighting on moving objects without placing thousands of light probes by hand. What should you use?","o":["Adaptive Probe Volumes (APV)","A single Light Probe at the origin","Reflection Probes only","Realtime point lights everywhere"],"w":[null,"One probe can't represent varying lighting.","These give specular reflections, not diffuse GI.","Very expensive and no bounce light."],"a":0,"r":"APV places probes automatically in a density that adapts to geometry, with per-pixel sampling and lighting scenario blending.","e":"APV supports lighting scenarios (day/night blending) and sky occlusion. Legacy Light Probe Groups are still valid for small scenes.","src":"new","g":"probes"},{"id":"NPA-121","ex":["PA"],"d":"Lighting","q":"Night scene: dozens of small lights on the CPU-bound mobile target. Which approach is most performant?","o":["Bake most small lights (Baked mode), keep few realtime lights, and use emissive materials plus light probes","Make every light Realtime with soft shadows","Use HDRP volumetric fog on mobile","Increase URP's per-object light limit to the maximum"],"w":[null,"That's the most expensive option.","HDRP isn't for mobile.","That increases shader cost."],"a":0,"r":"Baked lights cost nothing per frame. Realtime lights add per-object or per-pixel cost.","e":"URP Forward+ raises realtime light limits, but on mobile, baking plus a few dynamic lights is still the rule. Check the URP Asset's Additional Lights settings.","src":"new","g":"lightmodes"},{"id":"NPA-122","ex":["PA"],"d":"Lighting","q":"Which Lighting window property balances lightmap texel density against memory?","o":["Lightmap Resolution (texels per unit) together with each renderer's Scale In Lightmap","Fog Density","Bounce Intensity of the camera","Shadow Distance"],"w":[null,"Fog is atmospheric.","Cameras have no bounce property.","That's the realtime shadow range."],"a":0,"r":"Higher resolution gives sharper baked shadows but larger lightmaps. Scale important objects up and minor ones down.","e":"Use the Lightmap Indices / Baked Lightmap scene view mode to inspect texel density (the checker overlay).","src":"new","g":"lightmodes"},{"id":"NPA-123","ex":["PA"],"d":"Lighting","q":"Why does a bright red floor make the white walls look slightly pink after baking?","o":["Global Illumination: indirect bounce light carries the floor's albedo color","A bug in the shader","The camera's background color","Reflection probes add red fog"],"w":[null,"It's intended behavior.","The background doesn't affect baked bounce.","Probes don't create fog."],"a":0,"r":"Bounced light takes on surface color (color bleeding). It's physically correct.","e":"Reduce it with Albedo Boost or Indirect Intensity, or change the material colors. Lighting artists use it on purpose to make scenes feel cohesive.","src":"new","g":"lightmodes"},{"id":"NPA-124","ex":["PA"],"d":"Particles & Effects","q":"A smoke effect looks like flat cards intersecting the floor with hard edges. What fixes this?","o":["Turn on Soft Particles (depth fade) on the particle material","Use Mesh particles","Disable the Renderer module","Increase Start Speed"],"w":[null,"Meshes would look more solid, not softer.","Then nothing renders.","That moves particles faster but doesn't fix edges."],"a":0,"r":"Soft particles fade where they meet scene geometry, hiding hard intersections. They need the depth texture in URP.","e":"Also use flipbook texture sheet animation (Texture Sheet Animation module), and Camera fading near the lens. Keep the depth texture enabled in the URP Asset for soft particles.","src":"new","g":"particles"},{"id":"NPA-125","ex":["PA"],"d":"Particles & Effects","q":"A sparks effect should spawn smaller sub-sparks when each particle dies. Which module handles this?","o":["Sub Emitters (Death trigger)","Inherit Velocity","Lights","Noise"],"w":[null,"That passes emitter velocity to particles.","That attaches real lights to particles.","That adds turbulence."],"a":0,"r":"Sub Emitters spawn child systems on Birth, Collision, Death, Trigger or Manual events.","e":"The Lights module is expensive, so limit its ratio. Trails create ribbons. Limit Velocity over Lifetime adds drag.","src":"new","g":"particles"},{"id":"NPA-126","ex":["PA"],"d":"Particles & Effects","q":"Which post-processing setup is correct for a localized underwater color tint only when the camera is inside a water volume?","o":["A Local Volume with a collider (Is Trigger) around the water, a higher Priority, and a Color Adjustments override","A Global Volume with Weight 1","A Reflection Probe tinted blue","A Light Cookie"],"w":[null,"A global volume applies everywhere.","Probes affect reflections, not screen color.","Cookies are light masks."],"a":0,"r":"Local volumes blend in by camera position (Blend Distance) and override the global volume.","e":"Volume priority decides which wins. Weight scales influence. The camera's Volume Mask / Layer controls which volumes it reads.","src":"new","g":"trigger"},{"id":"NPA-127","ex":["PA"],"d":"Prototyping","q":"You're greyboxing a level for a playtest next week. What is the best artist workflow?","o":["Block out with ProBuilder and simple materials at correct scale, playtest, then iterate before final art","Fully texture every asset before the playtest","Model everything in a DCC tool first","Skip playtesting until the art is final"],"w":[null,"That wastes effort if the layout changes.","That's slower iteration than in-Editor blocking.","That finds problems too late."],"a":0,"r":"Fast, cheap iteration finds layout problems before expensive art.","e":"Use the grid and snapping (Ctrl drag, Grid and Snap overlay), prefabs for repeated modules, and modular kit dimensions (for example 2 m or 4 m units) for clean snapping.","src":"new","g":"canvas"},{"id":"NPA-128","ex":["PA"],"d":"Prototyping","q":"Which UI Toolkit file defines the visual structure (element hierarchy) of a menu?","o":["UXML","USS","Panel Settings asset","TMP Font Asset"],"w":[null,"USS is CSS-like styling.","Panel Settings defines scale and target, not structure.","That's a font."],"a":0,"r":"UXML is the markup for structure. USS is styling. C# handles behavior.","e":"Put a UIDocument component on a GameObject, referencing Panel Settings and the UXML Source Asset. Query elements with root.Q<Button>(\"play\").","src":"new","g":"canvas"},{"id":"NPA-129","ex":["PA"],"d":"2D Assets","q":"A 2D game has hundreds of sprites causing many draw calls. Which feature combines them for batching?","o":["Sprite Atlas (V2), with packing for the target sprites","Sprite Mode Multiple on each texture","Pixel Perfect Camera","Sprite Shape"],"w":[null,"Slicing doesn't pack separate textures.","That's about crisp rendering, not batching.","Sprite Shape makes spline-based terrain."],"a":0,"r":"Sprites in one atlas share one texture, so they can batch together.","e":"Group atlases by what's on screen together (UI atlas vs level atlas). Watch padding to avoid bleeding, and use Include in Build or late binding for variants.","src":"new","g":"drawcall"},{"id":"NPA-130","ex":["PA"],"d":"2D Assets","q":"Which package creates organic, spline-based 2D terrain with edge sprites?","o":["2D SpriteShape","2D Tilemap Extras","ProBuilder","2D Pixel Perfect"],"w":[null,"That's for grid-based Rule tiles.","That's 3D modeling.","That's camera snapping."],"a":0,"r":"SpriteShape draws sprites along a spline with fill and edge angles, which suits hills and platforms.","e":"Add an Edge Collider 2D or Polygon Collider 2D, and SpriteShapeController auto-generates colliders.","src":"new","g":"tilemap"},{"id":"NPA-131","ex":["PA"],"d":"2D Assets","q":"Sprites at the same position flicker in front of each other. What controls their draw order in 2D?","o":["Sorting Layer, then Order in Layer (and Sorting Group / Transparency Sort Axis)","Rigidbody2D mass","Collider size","The Audio Listener position"],"w":[null,"Physics doesn't affect rendering.","Colliders don't render.","Unrelated."],"a":0,"r":"Explicit sorting values decide which sprite draws first. Sorting Group keeps multi-sprite characters together.","e":"For top-down games, set Transparency Sort Mode to Custom Axis (0,1,0) so objects lower on screen draw in front.","src":"new","g":"audio"},{"id":"NPA-132","ex":["PA"],"d":"Animation","q":"A Humanoid character's feet slide on the ground during walk blending. Which settings help?","o":["Match the blend thresholds to the clips' real speeds (Compute Thresholds), use Root Motion consistently, and turn on Foot IK if needed","Increase Transition Duration to 2 seconds","Turn off the Avatar","Use Generic rig for walk and Humanoid for run"],"w":[null,"That just makes longer blends.","Without an Avatar, Humanoid animation fails.","Mixing rig types on one character breaks it."],"a":0,"r":"When the blend speed matches root velocity, feet stay planted.","e":"Animation Rigging package: Two Bone IK, Multi-Aim and Damped Transform constraints for runtime procedural adjustments like aiming or foot placement.","src":"new","g":"animator"},{"id":"NPA-133","ex":["PA"],"d":"Animation","q":"You want facial animation where several smile and blink shapes combine. Which mesh feature supports this?","o":["Blend Shapes (morph targets) driven by animation curves or SkinnedMeshRenderer.SetBlendShapeWeight","LOD Groups","Lightmap UVs","Normal maps only"],"w":[null,"LODs are detail levels.","Those are for baking.","Normal maps can't move vertices."],"a":0,"r":"Blend shapes store vertex offsets and are weighted 0–100.","e":"Export blend shapes from the DCC tool, and turn on Import BlendShapes and Blend Shape Normals in the importer.","src":"new","g":"lod"},{"id":"NPA-134","ex":["PA"],"d":"Teams & Pipeline","q":"The art director defines a budget of 15k triangles and 2 materials per hero character for mobile. Why are budgets important?","o":["They keep performance predictable across the content team and avoid late, expensive optimization","They limit artistic creativity on purpose","They're only relevant for PC","Unity enforces them automatically"],"w":[null,"The goal is to work within constraints, not suppress creativity.","Mobile needs them most.","Unity doesn't enforce budgets. Teams validate with tools and checks."],"a":0,"r":"Budgets turn performance into a shared, measurable target.","e":"Check with Statistics (Game view Stats), the Rendering Debugger, the Profiler, and custom AssetPostprocessor validators.","src":"new","g":"assets"},{"id":"NPA-135","ex":["PA"],"d":"Teams & Pipeline","q":"Which naming convention practice helps a large art team most?","o":["A documented prefix/suffix scheme (for example T_Rock_D, T_Rock_N, M_Rock, SM_Rock_LOD0) agreed by the team","Everyone chooses their own names","Spaces and special characters everywhere","Naming by date only"],"w":[null,"That leads to chaos and broken automation.","These cause problems in scripts and on some platforms.","That says nothing about content."],"a":0,"r":"Consistent names make search, automation (postprocessors) and LOD grouping reliable.","e":"Store a style guide and the folder structure (Art/Characters/Hero/Textures) in the repo wiki. Use Presets to standardize import settings.","src":"new","g":"lod"},{"id":"NPP-136","ex":["PP"],"d":"C# Constructs","q":"What is printed?","code":"List<int> nums = new List<int> { 3, 1, 4, 1, 5 };\nvar r = nums.Where(n => n > 1).Select(n => n * 2).ToList();\nDebug.Log(string.Join(\",\", r));","o":["6,8,10","6,2,8,2,10","3,4,5","8,10"],"w":[null,"That ignores the Where filter.","That forgets the Select doubling.","3 > 1 is true, so 3 is kept and doubled to 6."],"a":0,"r":"Where keeps 3, 4 and 5 (values greater than 1), and Select doubles each.","e":"LINQ is fine in setup code, but it allocates (closures, enumerators). Avoid it in Update loops on mobile, and prefer plain for loops in hot paths.","src":"new","g":"valueref"},{"id":"NPP-137","ex":["PP"],"d":"C# Constructs","q":"What happens with this struct?","code":"struct Stats { public int hp; }\nStats a = new Stats { hp = 10 };\nStats b = a; b.hp = 99;\nDebug.Log(a.hp);","o":["It prints 10, because structs are value types and are copied on assignment","It prints 99, because b references the same object","It doesn't compile, because structs can't have public fields","It prints 0, because structs reset on copy"],"w":[null,"That would be true for a class (a reference type), not a struct.","Structs can have public fields.","A copy keeps the values."],"a":0,"r":"b is an independent copy, so changing b doesn't affect a.","e":"Vector3 is a struct. That's why transform.position.x = 5 doesn't compile: you'd be modifying a temporary copy. Assign a whole new Vector3 instead.","src":"new","g":"valueref"},{"id":"NPP-138","ex":["PP"],"d":"C# Constructs","q":"Which C# feature lets a Health component notify the UI when HP changes, without the Health script knowing about the UI?","o":["An event (for example public event Action<int> OnHealthChanged) that the UI subscribes to","A public static int that the UI polls every frame","Health calling GameObject.Find(\"HealthBar\")","Making Health inherit from the UI class"],"w":[null,"Polling couples the two and wastes work.","That's a hard coupling by name, and slow.","That's an inappropriate inheritance relationship."],"a":0,"r":"Events decouple publishers from subscribers. Health invokes the event and the UI listens.","e":"Unsubscribe in OnDisable/OnDestroy (-=) to avoid leaks and calls on destroyed objects. UnityEvent is the Inspector-assignable alternative.","src":"new","g":"valueref"},{"id":"NPP-139","ex":["PP"],"d":"C# Constructs","q":"Which statement about interfaces is correct in this context?","code":"public interface IDamageable { void TakeDamage(int amount); }\nif (hit.collider.TryGetComponent(out IDamageable d)) d.TakeDamage(10);","o":["Any MonoBehaviour that implements IDamageable (enemy, crate, player) can be damaged by this one code path","Interfaces can't be retrieved with GetComponent","IDamageable must inherit from MonoBehaviour","Only one class in the project may implement an interface"],"w":[null,"They can. Unity supports interface lookups.","Interfaces can't inherit from classes.","Any number of classes can implement it."],"a":0,"r":"GetComponent/TryGetComponent works with interfaces, which makes polymorphic interactions possible.","e":"Interfaces aren't serialized in the Inspector by default. Use [SerializeReference] or a MonoBehaviour field, then cast.","src":"new","g":"valueref"},{"id":"NPP-140","ex":["PP"],"d":"C# Constructs","q":"What is the output?","code":"int x = 7;\nstring s = x % 2 == 0 ? \"even\" : (x > 5 ? \"big odd\" : \"small odd\");\nDebug.Log(s);","o":["big odd","even","small odd","Compile error: nested ternary not allowed"],"w":[null,"7 is odd.","7 is greater than 5.","Nested ternaries are legal, if harder to read."],"a":0,"r":"7 % 2 is 1, so it isn't even. 7 > 5, so the result is \"big odd\".","e":"Know the operators: % (remainder), ?: (ternary), ?? (null-coalescing), ?. (null-conditional). Watch out: ?. and ?? bypass Unity's overloaded == null check on destroyed objects, so use explicit == null checks for UnityEngine.Object.","src":"new","g":"valueref"},{"id":"NPP-141","ex":["PP"],"d":"C# Constructs","q":"Why is `if (myComponent?.enabled == true)` risky for a component that has been Destroy()ed?","o":["The ?. operator doesn't use Unity's overloaded null check, so a destroyed (but not truly null) object can pass and then throw MissingReferenceException","?. is not supported in Unity's C# version","Destroyed components automatically become null C# references immediately","The code doesn't compile"],"w":[null,"Modern Unity supports C# 9 features, including ?.","The C# wrapper still exists. Only Unity's == makes it look null.","It compiles fine."],"a":0,"r":"UnityEngine.Object overrides ==. The ?. and ?? operators check only for a true C# null.","e":"Safe pattern: if (myComponent != null && myComponent.enabled). Or use the implicit bool: if (myComponent).","src":"new","g":"valueref"},{"id":"NPP-142","ex":["PP"],"d":"C# Constructs","q":"What does this generic method allow?","code":"public T Spawn<T>(T prefab) where T : Component {\n    return Instantiate(prefab);\n}","o":["Spawning any component-typed prefab and getting a typed reference back without casting","Only spawning GameObjects, never components","It breaks Instantiate, which only accepts GameObject","It runs on a background thread"],"w":[null,"T is constrained to Component.","Instantiate has a generic overload for any Object.","Generics have nothing to do with threads."],"a":0,"r":"Generics with a constraint give type-safe reuse. Instantiate<T> returns T.","e":"Example: Enemy e = Spawn(enemyPrefab); e.Init(); This avoids GetComponent after instantiating.","src":"new","g":"valueref"},{"id":"NPP-143","ex":["PP"],"d":"Core Interactions","q":"You use the Input System with a PlayerInput component in \"Invoke Unity Events\" mode. Which method signature correctly receives a Move action?","o":["public void OnMove(InputAction.CallbackContext ctx) { move = ctx.ReadValue<Vector2>(); }","void OnMove(InputValue v) wired as a UnityEvent","void Update() { Input.GetAxis(\"Move\"); }","public void OnMove(KeyCode k)"],"w":[null,"InputValue is used by \"Send Messages\" / \"Broadcast Messages\" mode.","That's the legacy Input Manager. \"Move\" isn't an axis there.","Actions don't pass a KeyCode."],"a":0,"r":"Unity Events mode passes a CallbackContext. Read the value with ReadValue<T>().","e":"PlayerInput behaviors: Send Messages, Broadcast Messages, Invoke Unity Events, Invoke C# Events. Or skip PlayerInput and use generated C# classes or InputActionReference with action.performed += handler.","src":"new","g":"input"},{"id":"NPP-144","ex":["PP"],"d":"Core Interactions","q":"A Rigidbody character should move smoothly with physics. Where and how should input and movement be split?","o":["Read input in Update, store it, and apply rb.MovePosition or velocity in FixedUpdate","Read input and set transform.position in FixedUpdate","Read input in FixedUpdate only","Do everything in LateUpdate"],"w":[null,"Changing the transform directly fights the physics engine and can miss input.","Button-down events can be missed between physics steps.","LateUpdate isn't synced with physics."],"a":0,"r":"Input is polled per frame, and physics changes happen on the physics step. Turn on Interpolate on the Rigidbody for smooth visuals.","e":"Rigidbody Interpolate smooths rendering between physics steps. Use Extrapolate rarely. In Unity 6, velocity was renamed linearVelocity, and drag/angularDrag became linearDamping/angularDamping.","src":"new","g":"lifecycle"},{"id":"NPP-145","ex":["PP"],"d":"Core Interactions","q":"You want a NavMeshAgent enemy to chase the player. What is required?","o":["A baked NavMesh (NavMeshSurface component from the AI Navigation package) and agent.SetDestination(player.position)","A Rigidbody with gravity on the enemy","A Tilemap Collider 2D","Physics.Raycast every frame to the player"],"w":[null,"NavMeshAgent moves the transform itself. A non-kinematic Rigidbody conflicts with it.","That's 2D physics, unrelated to NavMesh.","A raycast checks line of sight. It doesn't pathfind."],"a":0,"r":"The agent pathfinds on the baked surface. Update the destination at intervals.","e":"Use NavMeshObstacle (Carve) for dynamic blockers and Off-Mesh Links / NavMeshLink for jumps. Agent Types define radius, height and step height.","src":"new","g":"tilemap"},{"id":"NPP-146","ex":["PP"],"d":"Core Interactions","q":"How do you detect a click on a 3D object with the mouse, using the camera?","o":["Camera.main.ScreenPointToRay(mousePosition) then Physics.Raycast(ray, out hit)","Camera.main.WorldToScreenPoint(mousePosition)","Physics.OverlapSphere(mousePosition, 1)","GetComponent<Collider>().bounds.Contains(mousePosition)"],"w":[null,"That converts the other way.","The mouse position is in pixels, not world space.","That mixes up screen and world space."],"a":0,"r":"Convert the screen position to a world ray and raycast against colliders.","e":"With the Input System: Mouse.current.position.ReadValue() or Pointer.current. Alternatively, implement IPointerClickHandler with a PhysicsRaycaster on the camera and an EventSystem.","src":"new","g":"raycast"},{"id":"NPP-147","ex":["PP"],"d":"Application Systems","q":"Which approach saves a player's progress (level, inventory list) to disk in a readable, cross-platform way?","o":["Serialize a [Serializable] data class with JsonUtility.ToJson and write it to Application.persistentDataPath","Write to Application.dataPath at runtime","Store the whole inventory in PlayerPrefs as one key per item","Serialize MonoBehaviours directly with JsonUtility to a file"],"w":[null,"dataPath is read-only in builds on many platforms.","PlayerPrefs is for small settings, and per-item keys are messy.","You can't recreate MonoBehaviours from JSON with new. Serialize plain data classes instead."],"a":0,"r":"persistentDataPath is writable on every platform, and JSON is easy to read and version.","e":"JsonUtility doesn't support Dictionaries or top-level arrays. Wrap arrays in a class or use Newtonsoft (com.unity.nuget.newtonsoft-json). Add a save version field for migrations.","src":"new","g":"fsm"},{"id":"NPP-148","ex":["PP"],"d":"Application Systems","q":"Which scene-loading code keeps the game responsive while showing a progress bar?","o":["AsyncOperation op = SceneManager.LoadSceneAsync(\"Level2\"); then read op.progress each frame in a coroutine","SceneManager.LoadScene(\"Level2\"); followed by a loop reading progress","Application.LoadLevel(\"Level2\")","Resources.Load(\"Level2\")"],"w":[null,"Synchronous loading blocks the frame, so there's no progress to show.","This API is obsolete.","Scenes aren't loaded through Resources."],"a":0,"r":"Async loading runs in the background. progress goes to 0.9 before activation.","e":"Set op.allowSceneActivation = false to hold at 90% until a \"press any key\" prompt. Additive loading supports streaming worlds and persistent manager scenes.","src":"new","g":"fsm"},{"id":"NPP-149","ex":["PP"],"d":"Application Systems","q":"Your game has states: MainMenu, Playing, Paused, GameOver. Which pattern best organizes transitions?","o":["A finite state machine (enum + switch, or State classes with Enter/Exit/Update)","Dozens of independent bools like isPaused, isMenu, isOver","One huge Update with nested ifs for every state","A coroutine per state that never ends"],"w":[null,"Bools can conflict (isPaused && isOver) and are hard to maintain.","That's spaghetti logic.","Unmanaged coroutines make transitions unclear."],"a":0,"r":"An FSM makes allowed transitions explicit and keeps state logic separate.","e":"A State pattern with interfaces scales best. For AI, consider FSM vs Behavior Tree vs GOAP trade-offs.","src":"new","g":"fsm"},{"id":"NPP-150","ex":["PP"],"d":"Application Systems","q":"How do you pause gameplay while keeping UI animations running?","o":["Set Time.timeScale = 0 and use unscaled time (Animator Update Mode = Unscaled Time, WaitForSecondsRealtime) for UI","Disable the Main Camera","Set Application.targetFrameRate = 0","Call Debug.Break()"],"w":[null,"That shows nothing, and physics continues.","That's a frame-rate setting. 0 means default, not paused.","That pauses the Editor only, not builds."],"a":0,"r":"timeScale stops scaled time and FixedUpdate. UI that uses unscaled time keeps running.","e":"Time.deltaTime becomes 0 when timeScale is 0. Time.unscaledDeltaTime keeps counting. Audio needs AudioListener.pause, or source.ignoreListenerPause for UI sounds.","src":"new","g":"animator"},{"id":"NPP-151","ex":["PP"],"d":"Application Systems","q":"Which Netcode for GameObjects component must be on a networked prefab?","o":["NetworkObject","NetworkTransform only","PhotonView","Rigidbody"],"w":[null,"NetworkTransform syncs the transform, but it needs a NetworkObject.","PhotonView belongs to a third-party SDK.","Physics isn't required for networking."],"a":0,"r":"NetworkObject gives the prefab a network identity. Prefabs must also be registered in the NetworkManager's prefab list.","e":"Logic goes in NetworkBehaviour. Synced data goes in NetworkVariable<T>. Calls use [Rpc(SendTo.Server)] (or the older ServerRpc/ClientRpc). Server authority is the default for NetworkTransform.","src":"new","g":"fsm"},{"id":"NPP-152","ex":["PP"],"d":"Scene & Environment","q":"Which code changes a material color on one renderer WITHOUT creating a material instance per object?","o":["Use a MaterialPropertyBlock with renderer.SetPropertyBlock(block)","renderer.material.color = Color.red;","renderer.sharedMaterial.color = Color.red;","Shader.SetGlobalColor(\"_Color\", Color.red);"],"w":[null,"Accessing .material creates a unique material copy (and a leak if it isn't destroyed).","That changes the shared asset for every object using it, and persists in the Editor.","Global properties affect every material that uses that name."],"a":0,"r":"Property blocks override values per rendere
