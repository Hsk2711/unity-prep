he scene","All child Tilemaps are deleted along with it, since they are its children","The Tilemaps are automatically re-parented to the scene root","Nothing — Grid objects cannot be deleted while they have children"],"a":1,"w":["Deleting a parent always deletes its children.",null,"Unity does not re-parent children automatically.","Parents can be deleted at any time."],"r":"","e":"Deleting a parent GameObject in Unity removes all of its children too, so every Tilemap under that Grid would be deleted as well.","src":"doc","g":"tilemap"},{"id":"TA-12","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"The Cell Gap property on a Grid component adds visible spacing between adjacent tile cells.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Cell Gap inserts extra space between cells in the X/Y/Z directions, which can be used for visual spacing or special grid effects.","src":"doc","g":"tilemap"},{"id":"TA-13","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"Which Tile Palette tool lets you select a rectangular region of already-painted tiles to copy or move elsewhere?","o":["Selection Tool","Eraser Tool","Fill Tool","Brush Tool"],"a":0,"w":[null,"The Eraser removes tiles.","Fill floods an area.","The Brush paints single tiles or brush patterns."],"r":"","e":"The Selection (Rectangle) Tool marks a region of tiles so you can copy, move, or reuse that block elsewhere on the Palette or Tilemap.","src":"doc","g":"tilemap"},{"id":"TA-14","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"A Tilemap can only ever use square, rectangular cells.","o":["True","False"],"a":1,"w":["The statement is false, so \"True\" is incorrect. See the explanation on the correct option.",null],"r":"","e":"Unity's Grid/Tilemap system also supports Hexagon and Isometric cell layouts, not just rectangular grids.","src":"doc","g":"tilemap"},{"id":"TA-15","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"What does the Fill (bucket) tool do in the Tile Palette?","o":["Deletes every tile on the Tilemap at once","Fills a contiguous, connected area with the currently selected tile","Creates a new empty Tilemap","Randomizes tile rotation across the map"],"a":1,"w":["Fill doesn't delete. Use the Eraser or Tilemap.ClearAllTiles().",null,"New Tilemaps are created from the GameObject menu.","Random rotation is a brush or Random Tile feature, not Fill."],"r":"","e":"The Fill tool floods a connected region of matching cells with the active tile, similar to a paint bucket in image editors.","src":"doc","g":"tilemap"},{"id":"TA-16","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"A Tilemap Collider 2D can be combined with a Composite Collider 2D and a Rigidbody 2D to merge and optimize collision shapes.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"This is the standard combination used to merge per-tile collider edges into fewer, larger shapes for better performance and smoother collision.","src":"doc","g":"tilemap"},{"id":"TA-17","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"Which Grid cell layout would best suit a classic hex-based wargame map?","o":["Rectangle","Isometric","Hexagon","Isometric Z as Y"],"a":2,"w":["Rectangle gives square grids.","Isometric gives diamond grids.",null,"Isometric Z as Y is diamond plus depth sorting."],"r":"","e":"The Hexagon cell layout arranges tiles in a hex grid, the standard choice for hex-based strategy/wargame maps.","src":"doc","g":"tilemap"},{"id":"TA-18","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"You must manually assign a unique Sorting Layer to every individual tile you paint.","o":["True","False"],"a":1,"w":["The statement is false, so \"True\" is incorrect. See the explanation on the correct option.",null],"r":"","e":"Sorting Layer and Order in Layer are set on the Tilemap Renderer (per Tilemap), not per individual tile.","src":"doc","g":"tilemap"},{"id":"TA-19","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"Which Tile type lets you define a sequence of sprites that automatically animate in a loop?","o":["Rule Tile","Animated Tile","Weighted Random Tile","Isometric Tile"],"a":1,"w":["Rule Tile picks sprites by neighbors; it doesn't animate.",null,"Weighted Random picks a random sprite variant.","There's no special \"Isometric Tile\" type. Isometric is a Grid layout."],"r":"","e":"An Animated Tile cycles through an assigned set of sprites over time, useful for things like flowing water or torches. Animated Tiles come from the 2D Tilemap Extras package.","src":"doc","g":"tilemap"},{"id":"TA-20","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"The Tile Palette Clipboard can store and let you switch between multiple different palettes.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"The Tile Palette window lets you create and switch between several distinct palette assets (e.g., Terrain, Interior, Props).","src":"doc","g":"tilemap"},{"id":"TA-21","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"What is the 'Isometric Z as Y' cell layout primarily used for?","o":["Making tiles fully transparent","Isometric tiles where Z position also affects Y-based sort order for visual depth/stacking","Disabling tile collision","Converting sprites to 3D meshes"],"a":1,"w":["Transparency is set by sprite alpha or color.",null,"Collision is set per tile.","Tilemaps stay 2D sprites."],"r":"","e":"This layout is used when isometric tiles need their Z depth to influence vertical sorting, common in 2.5D games with stacked/layered objects.","src":"doc","g":"tilemap"},{"id":"TA-22","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"Painting a new tile brush over an existing tile on the Tilemap replaces the old tile.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Painting over an occupied cell overwrites whatever tile was previously there with the newly selected brush.","src":"doc","g":"tilemap"},{"id":"TA-23","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"Which component would you add to make a Tilemap act as a solid, collidable wall in a 2D physics scene?","o":["Tilemap Collider 2D","Sprite Renderer","Rule Tile","Grid"],"a":0,"w":[null,"Sprite Renderer draws single sprites, not Tilemap collision.","Rule Tile is about sprite choice, not physics.","Grid is only layout."],"r":"","e":"Tilemap Collider 2D generates collision shapes matching the painted tiles, letting the Tilemap interact with 2D physics.","src":"doc","g":"tilemap"},{"id":"TA-24","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"Multiple different Tile assets can reference the exact same underlying sprite.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"There's no restriction preventing several Tile assets from sharing one sprite — useful when the same visual needs different tile behaviors/rules.","src":"doc","g":"tilemap"},{"id":"TA-25","ex":["GD","AA","PA"],"d":"Tilemap & 2D","q":"What is the main benefit of using Rule Tiles for terrain like paths or water edges?","o":["They reduce the total file size of the project","They automatically select the correct edge/corner sprite variant based on surrounding tiles","They remove the need for a Tilemap Renderer","They convert 2D tiles into 3D meshes"],"a":1,"w":["Size reduction is a minor side effect at best.",null,"A renderer is still needed.","They stay 2D."],"r":"","e":"Rule Tiles save huge amounts of manual work by auto-selecting the right variant (straight edge, corner, junction, etc.) as you paint.","src":"doc","g":"tilemap"},{"id":"TA-26","ex":["GD","AA","PA"],"d":"Animation","q":"Which window is used to create and edit keyframes for a GameObject's properties over time?","o":["Animator window","Animation window","Timeline window","Inspector window"],"a":1,"w":["The Animator window edits the state machine, not keyframes.",null,"Timeline sequences clips; keyframes are still edited in the Animation window.","The Inspector shows properties but has no keyframe timeline."],"r":"","e":"The Animation window is where you record and edit keyframes that make up an individual animation clip.","src":"doc","g":"animator"},{"id":"TA-27","ex":["GD","AA","PA"],"d":"Animation","q":"The Animator window is where you design the state machine of animation states and their transitions.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"The Animator window visualizes and lets you edit an Animator Controller's states, transitions, and parameters.","src":"doc","g":"animator"},{"id":"TA-28","ex":["GD","AA","PA"],"d":"Animation","q":"What component is required on a GameObject for it to play an Animator Controller?","o":["Animation","Animator","Rigidbody","Skinned Mesh Renderer"],"a":1,"w":["Animation is the legacy component and doesn't use Animator Controllers.",null,"Rigidbody is physics.","Skinned Mesh Renderer draws the skinned mesh."],"r":"","e":"The Animator component references and runs an Animator Controller asset on the GameObject.","src":"doc","g":"animator"},{"id":"TA-29","ex":["GD","AA","PA"],"d":"Animation","q":"A single Animator Controller can only contain one animation layer.","o":["True","False"],"a":1,"w":["The statement is false, so \"True\" is incorrect. See the explanation on the correct option.",null],"r":"","e":"Animator Controllers support multiple layers, letting different state machines control different parts of a character and blend together.","src":"doc","g":"animator"},{"id":"TA-30","ex":["GD","AA","PA"],"d":"Animation","q":"Which Animator parameter type best represents a value like 'IsGrounded' for a jump system?","o":["Float","Bool","Trigger","Vector3"],"a":1,"w":["Float is for continuous values like Speed.",null,"Trigger is for one-shot events; it resets itself.","There's no Vector3 parameter type."],"r":"","e":"Bool parameters represent persistent on/off states like whether a character is currently grounded.","src":"doc","g":"animator"},{"id":"TA-31","ex":["GD","AA","PA"],"d":"Animation","q":"Increasing a transition's Transition Duration results in a longer cross-fade blend between the two animation states.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Transition Duration controls how long the blend between the outgoing and incoming clips takes, in normalized time.","src":"doc","g":"animator"},{"id":"TA-32","ex":["GD","AA","PA"],"d":"Animation","q":"What is an Avatar Mask used for?","o":["Restricting which body parts an Animation Layer affects","Hiding a character model entirely","Converting a Generic rig into a Humanoid rig","Storing texture data for a character"],"a":0,"w":[null,"Hide a model by disabling its Renderer.","Rig type is chosen in import settings.","Textures belong to materials."],"r":"","e":"Avatar Masks let a layer apply animation only to specific parts of a rig (e.g., upper body only), while other layers control the rest.","src":"doc","g":"animator"},{"id":"TA-33","ex":["GD","AA","PA"],"d":"Animation","q":"Root Motion can cause a character to visually slide or drift if it's not configured consistently with script-driven movement.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Mixing animation-driven movement (Root Motion) with separate script-driven movement, without reconciling the two, commonly causes visible sliding/foot-skate.","src":"doc","g":"animator"},{"id":"TA-34","ex":["GD","AA","PA"],"d":"Animation","q":"Which node lets you configure a transition that can trigger from any other state in the Animator?","o":["Entry","Exit","Any State","Default State"],"a":2,"w":["Entry picks the default state when a state machine starts.","Exit leaves a sub-state machine.",null,"Default State is the first state, not a \"from anywhere\" source."],"r":"","e":"Any State allows a transition to a target state to fire regardless of which state is currently active, without drawing a transition from every individual state.","src":"doc","g":"animator"},{"id":"TA-35","ex":["GD","AA","PA"],"d":"Animation","q":"You can preview an animation clip without entering Play Mode by scrubbing the timeline in the Animation window.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"The Animation window lets you scrub through a clip's timeline in Edit Mode to preview it directly on the model.","src":"doc","g":"animator"},{"id":"TA-36","ex":["GD","AA","PA"],"d":"Animation","q":"Which feature is best suited for blending 2D directional movement, such as 8-directional strafing?","o":["1D Blend Tree","2D Blend Tree","Avatar Mask","Animation Event"],"a":1,"w":["1D blends on one parameter, so it can't do X/Y directions.",null,"Avatar Mask limits body parts; it doesn't blend directions.","Animation Events call functions."],"r":"","e":"A 2D Blend Tree blends multiple clips across two axes (e.g., X and Y movement direction) simultaneously.","src":"doc","g":"blendtree"},{"id":"TA-37","ex":["GD","AA","PA"],"d":"Animation","q":"Exit Time is expressed as a normalized value (0 to 1) representing progress through the current clip's playback.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Exit Time is normalized so 1.0 represents one full loop of the current clip, regardless of its actual duration in seconds.","src":"doc","g":"animator"},{"id":"TA-38","ex":["GD","AA","PA"],"d":"Animation","q":"What does the 'Loop Time' setting on an animation clip's import settings control?","o":["Whether the clip repeats automatically when it reaches its end","How long the clip takes to load into memory","How many times the clip can be triggered per second","Whether root motion is enabled"],"a":0,"w":[null,"Loading is controlled by the clip's compression and import settings, not Loop Time.","Loop Time doesn't limit how often a clip can be triggered.","Root motion is set by Apply Root Motion and the Root Transform settings."],"r":"","e":"Loop Time makes a clip seamlessly restart from the beginning once it finishes playing, useful for cycles like walking or idling.","src":"doc","g":"animator"},{"id":"TA-39","ex":["GD","AA","PA"],"d":"Animation","q":"Humanoid rigs allow the same animation clips to be retargeted and reused across different character models.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Because Humanoid rigs map to a standardized Avatar bone structure, clips can be shared across any Humanoid-rigged character.","src":"doc","g":"animator"},{"id":"TA-40","ex":["GD","AA","PA"],"d":"Animation","q":"Which rig type should you use if you plan to reuse the same animation clips across multiple different character models?","o":["Generic","Humanoid","Legacy","None (Root Motion)"],"a":1,"w":["Generic can't retarget between different skeletons.",null,"Legacy is for the old Animation component.","\"None (Root Motion)\" is not a rig type."],"r":"","e":"Humanoid rigs are specifically designed to support retargeting animations between different characters via the Avatar system.","src":"doc","g":"animator"},{"id":"TA-41","ex":["GD","AA","PA"],"d":"Animation","q":"Generic rigs support retargeting animations to unrelated skeletons just as easily as Humanoid rigs do.","o":["True","False"],"a":1,"w":["The statement is false, so \"True\" is incorrect. See the explanation on the correct option.",null],"r":"","e":"Generic rigs are tied closely to their own specific skeleton hierarchy and do not support the same cross-character retargeting Humanoid rigs offer.","src":"doc","g":"animator"},{"id":"TA-42","ex":["GD","AA","PA"],"d":"Animation","q":"Where would you adjust the playback speed of an individual state in the Animator?","o":["The state's Speed property in the Inspector","The Animator Controller's global settings","The Grid component","The Audio Mixer"],"a":0,"w":[null,"There's no global speed in controller settings, though Animator.speed scales the whole component.","Grid is Tilemap.","Audio Mixer is audio."],"r":"","e":"Each state in the Animator has its own Speed value (which can also be multiplied by a parameter) controlling its playback rate.","src":"doc","g":"animator"},{"id":"TA-43","ex":["GD","AA","PA"],"d":"Animation","q":"A state's Speed value can be multiplied by a float parameter for dynamic control (e.g., faster animation as movement speed increases).","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Checking 'Multiplier' on a state and assigning a parameter lets script-driven values dynamically scale that state's playback speed.","src":"doc","g":"animator"},{"id":"TA-44","ex":["GD","AA","PA"],"d":"Animation","q":"Which window shows a visual graph of an Animator Controller's states and the transitions between them?","o":["Animation window","Animator window","Console window","Timeline window"],"a":1,"w":["The Animation window edits clips.",null,"The Console shows logs.","Timeline sequences tracks."],"r":"","e":"The Animator window displays the state machine graph, including all states, transitions, and parameters.","src":"doc","g":"animator"},{"id":"TA-45","ex":["GD","AA","PA"],"d":"Animation","q":"An Animation Event can only call a method that takes no parameters.","o":["True","False"],"a":1,"w":["The statement is false, so \"True\" is incorrect. See the explanation on the correct option.",null],"r":"","e":"Animation Events can pass a single parameter (float, int, string, or Object reference) to the called method, not just parameterless calls.","src":"doc","g":"animator"},{"id":"TA-46","ex":["GD","AA","PA"],"d":"Animation","q":"What does the 'Transition Interruption Source' setting control?","o":["Which audio plays during a transition","Whether/how an in-progress transition can be interrupted by another transition","How many layers an Animator Controller has","Which Avatar Mask is applied"],"a":1,"w":["Transitions don't play audio.",null,"Layers are added in the Layers tab.","Avatar Masks are set per layer."],"r":"","e":"This setting lets you define whether a currently playing transition can be interrupted by the current state, the next state, both, or neither.","src":"doc","g":"animator"},{"id":"TA-47","ex":["GD","AA","PA"],"d":"Animation","q":"A '1D' Blend Tree blends between animation clips along a single parameter axis.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"A 1D Blend Tree interpolates clips based on one float parameter (e.g., Speed), unlike a 2D Blend Tree which uses two.","src":"doc","g":"blendtree"},{"id":"TA-48","ex":["GD","AA","PA"],"d":"Animation","q":"What is the term for the starting/default animation state, typically highlighted in orange in the Animator window?","o":["Entry State","Default State","Exit State","Any State"],"a":1,"w":["Entry is a node, not a state. It points at the default.",null,"The Exit node is not a playable state.","Any State is a transition source."],"r":"","e":"The Default State is the state the Entry node automatically transitions into when the Animator Controller starts running.","src":"doc","g":"animator"},{"id":"TA-49","ex":["GD","AA","PA"],"d":"Animation","q":"Animator Controllers can be shared and reused across multiple characters that use the same Avatar body plan.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"As long as characters share a compatible Humanoid Avatar structure, the same Animator Controller and clips can drive all of them.","src":"doc","g":"animator"},{"id":"TA-50","ex":["GD","AA","PA"],"d":"Animation","q":"Which setting must be enabled on a clip so a character's root position loops seamlessly, such as in a walk cycle?","o":["Loop Pose","Bake Into Pose","Mirror","Root Transform Rotation"],"a":0,"w":[null,"Bake Into Pose stops root motion on that axis; it doesn't smooth the loop.","Mirror flips the clip left to right.","Root Transform Rotation is an import section, not a loop setting."],"r":"","e":"Loop Pose smooths the transition between a looping clip's end and start so root motion doesn't jump or pop.","src":"doc","g":"lightmodes"},{"id":"TA-51","ex":["GD","AA"],"d":"Audio","q":"Which Audio Source property determines the volume falloff of a 3D sound over distance?","o":["Priority","Volume Rolloff","Doppler Level","Spread"],"a":1,"w":["Priority decides which voices survive when too many sounds play.",null,"Doppler Level is pitch shift from relative motion.","Spread is the stereo width of 3D sound."],"r":"","e":"The Volume Rolloff curve (Logarithmic, Linear, or Custom) defines how quickly a 3D sound's volume decreases as distance from the listener increases.","src":"doc","g":"spatial"},{"id":"TA-52","ex":["GD","AA"],"d":"Audio","q":"Unity supports Logarithmic, Linear, and Custom volume rolloff curves for 3D Audio Sources.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"All three rolloff options are available on an Audio Source's 3D Sound Settings.","src":"doc","g":"audio"},{"id":"TA-53","ex":["GD","AA"],"d":"Audio","q":"Which property limits how close a listener must be before a 3D sound reaches its maximum volume?","o":["Max Distance","Min Distance","Spread","Reverb Zone Mix"],"a":1,"w":["Max Distance is where attenuation stops.",null,"Spread is the stereo/speaker spread angle.","Reverb Zone Mix is how much signal goes to reverb zones."],"r":"","e":"Min Distance is the range within which the sound stays at full volume before rolloff begins.","src":"doc","g":"spatial"},{"id":"TA-54","ex":["GD","AA"],"d":"Audio","q":"Which setting defines the distance beyond which a 3D sound is no longer heard at all?","o":["Min Distance","Max Distance","Priority","Spread"],"a":1,"w":["Min Distance is where falloff starts.",null,"Priority is for voice culling.","Spread is stereo width."],"r":"","e":"Max Distance defines the point at which the sound's volume has fully rolled off to (near) silence.","src":"doc","g":"spatial"},{"id":"TA-55","ex":["GD","AA"],"d":"Audio","q":"Setting Loop on an Audio Source makes its clip repeat continuously once it starts playing.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"The Loop checkbox causes the clip to restart automatically from the beginning each time it finishes.","src":"doc","g":"audio"},{"id":"TA-56","ex":["GD","AA"],"d":"Audio","q":"Which effect would you add to an Audio Mixer Group to simulate the echo of a large hall?","o":["Reverb","Pitch Shifter","Low Pass Filter","Compressor"],"a":0,"w":[null,"Pitch Shifter changes pitch.","Low Pass muffles high frequencies.","A compressor evens out loudness."],"r":"","e":"The Reverb effect simulates how sound reflects and decays within a physical space, like a large hall or cave.","src":"doc","g":"audio"},{"id":"TA-57","ex":["GD","AA"],"d":"Audio","q":"Audio Mixer Snapshots let you save and transition between different mixer states, such as normal vs. underwater.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Snapshots capture a full set of mixer parameter values, which you can smoothly blend/transition to (e.g., muffled audio underwater).","src":"doc","g":"audio"},{"id":"TA-58","ex":["GD","AA"],"d":"Audio","q":"Which Audio Source setting controls whether it starts playing automatically when the scene loads?","o":["Play On Awake","Loop","Mute","Bypass Effects"],"a":0,"w":[null,"Loop repeats the clip.","Mute silences it.","Bypass Effects skips filters."],"r":"","e":"Play On Awake automatically triggers playback as soon as the GameObject becomes active, without needing a script call.","src":"doc","g":"lifecycle"},{"id":"TA-59","ex":["GD","AA"],"d":"Audio","q":"You must always manually call Play() in script even when Play On Awake is enabled on an Audio Source.","o":["True","False"],"a":1,"w":["The statement is false, so \"True\" is incorrect. See the explanation on the correct option.",null],"r":"","e":"When Play On Awake is enabled, Unity starts playback automatically — no script call is required.","src":"doc","g":"lifecycle"},{"id":"TA-60","ex":["GD","AA"],"d":"Audio","q":"What is the purpose of an Audio Mixer's Send and Receive effects?","o":["To import audio files faster","To route audio from one group into a shared effect bus processed elsewhere in the mixer","To convert 2D audio into 3D audio automatically","To compress audio file size on disk"],"a":1,"w":["Import speed is unrelated.",null,"That's Spatial Blend.","That's import compression."],"r":"","e":"Send/Receive lets multiple groups share a single processed effect (like one shared reverb bus) instead of duplicating it per group.","src":"doc","g":"audio"},{"id":"TA-61","ex":["GD","AA"],"d":"Audio","q":"A Dynamic Range Compressor effect reduces the difference between the loudest and quietest parts of a sound.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Compression narrows the dynamic range, which helps keep overall mix volume more consistent.","src":"doc","g":"audio"},{"id":"TA-62","ex":["GD","AA"],"d":"Audio","q":"Which Audio Mixer feature lets a script control a mixer value (like volume) at runtime?","o":["Exposed Parameter","Audio Listener","Spatial Blend","Reverb Zone"],"a":0,"w":[null,"Audio Listener hears sounds; it doesn't control mixer values.","Spatial Blend is per source.","Reverb Zone is a scene component."],"r":"","e":"Exposing a mixer parameter allows scripts to read/set it via AudioMixer.SetFloat(), such as adjusting music volume from a settings menu.","src":"doc","g":"spatial"},{"id":"TA-63","ex":["GD","AA"],"d":"Audio","q":"An Audio Clip's Load Type setting (e.g., Streaming, Decompress On Load) affects memory usage and performance.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Load Type determines how/when audio data is decompressed and loaded into memory, directly impacting RAM usage and CPU load.","src":"doc","g":"audio"},{"id":"TA-64","ex":["GD","AA"],"d":"Audio","q":"Which Load Type is best suited for long background music tracks, to save memory?","o":["Decompress On Load","Compressed In Memory","Streaming","Preload Audio Data"],"a":2,"w":["Decompress On Load uses the most RAM for long clips.","Compressed In Memory still holds the whole clip in RAM.",null,"Preload Audio Data is a toggle, not a Load Type."],"r":"","e":"Streaming reads audio data from disk incrementally rather than loading the entire clip into memory, ideal for long tracks.","src":"doc","g":"audio"},{"id":"TA-65","ex":["GD","AA"],"d":"Audio","q":"Compressed audio formats like Vorbis reduce file size but can introduce some quality loss compared to uncompressed audio.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Lossy compression formats trade some audio fidelity for significantly smaller file sizes.","src":"doc","g":"audio"},{"id":"TA-66","ex":["GD","AA"],"d":"Audio","q":"What does the Priority setting on an Audio Source control?","o":["Which sound plays first alphabetically","Which sounds are more likely to keep playing when the simultaneous voice limit is exceeded","How loud the sound is by default","Whether the sound loops"],"a":1,"w":["Priority isn't alphabetical.",null,"Volume is a separate property.","Loop is a separate property."],"r":"","e":"When too many sounds try to play at once, Priority helps Unity decide which ones to keep audible and which to cull.","src":"doc","g":"audio"},{"id":"TA-67","ex":["GD","AA"],"d":"Audio","q":"Increasing the number of simultaneous Audio Sources playing at once always improves game performance.","o":["True","False"],"a":1,"w":["The statement is false, so \"True\" is incorrect. See the explanation on the correct option.",null],"r":"","e":"More simultaneous sources increases CPU/memory overhead — it can hurt, not improve, performance if overused.","src":"doc","g":"audio"},{"id":"TA-68","ex":["GD","AA"],"d":"Audio","q":"Which setting makes a UI sound effect unaffected by the 3D Audio Listener's position?","o":["Set Spatial Blend to 1 (3D)","Set Spatial Blend to 0 (2D)","Enable Loop","Increase Priority"],"a":1,"w":["Spatial Blend 1 is fully 3D, the opposite of what you want.",null,"Loop doesn't affect position.","Priority doesn't affect position."],"r":"","e":"A Spatial Blend of 0 makes a sound fully 2D, playing at a consistent volume regardless of listener position — ideal for UI feedback sounds.","src":"doc","g":"spatial"},{"id":"TA-69","ex":["GD","AA"],"d":"Audio","q":"The Doppler Level setting simulates pitch shifts based on relative motion between an Audio Source and the Listener.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Doppler Level controls the strength of the classic pitch-shift effect heard when a sound source moves toward or away from the listener.","src":"doc","g":"audio"},{"id":"TA-70","ex":["GD","AA"],"d":"Audio","q":"Which effect would you apply to simulate a sound being muffled, as if heard through a wall?","o":["Reverb","Low Pass Filter","Pitch Shifter","Chorus"],"a":1,"w":["Reverb adds room echo.",null,"Pitch Shifter changes pitch.","Chorus thickens the sound."],"r":"","e":"A Low Pass Filter cuts high frequencies, producing the muffled quality typical of sound passing through a barrier.","src":"doc","g":"audio"},{"id":"TA-71","ex":["GD","AA"],"d":"Audio","q":"Muting an Audio Source with its Mute checkbox permanently removes the audio clip data from the project.","o":["True","False"],"a":1,"w":["The statement is false, so \"True\" is incorrect. See the explanation on the correct option.",null],"r":"","e":"Mute only silences playback for that source at runtime/in the Editor — it has no effect on the underlying audio asset.","src":"doc","g":"audio"},{"id":"TA-72","ex":["GD","AA"],"d":"Audio","q":"Which method is commonly used to play a short, one-off sound effect (like a UI click) without needing a dedicated, persistent Audio Source?","o":["AudioSource.PlayClipAtPoint()","AudioListener.pause","AudioMixer.SetFloat()","AudioClip.LoadAudioData()"],"a":0,"w":[null,"AudioListener.pause pauses all audio.","AudioMixer.SetFloat() sets a mixer parameter.","AudioClip.LoadAudioData() loads data; it doesn't play anything."],"r":"","e":"PlayClipAtPoint() creates a temporary Audio Source, plays the clip, and automatically cleans itself up afterward.","src":"doc","g":"audio"},{"id":"TA-73","ex":["GD","AA"],"d":"Audio","q":"2D and 3D sounds can coexist in the same scene, each using different Spatial Blend values on their own Audio Sources.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Spatial Blend is set per Audio Source, so UI/music sounds (2D) and world sounds (3D) can freely coexist.","src":"doc","g":"spatial"},{"id":"TA-74","ex":["GD","AA"],"d":"Audio","q":"What is the primary role of the Attenuation effect at the end of an Audio Mixer group's signal chain?","o":["It adds echo to the sound","It controls the final output volume/level of that mixer group","It converts stereo audio to mono","It changes the pitch of the sound"],"a":1,"w":["Echo is Reverb or Echo.",null,"Mono conversion is an import setting.","Pitch is a group property or Pitch Shifter."],"r":"","e":"Attenuation is the final volume-control stage applied after all other effects in a mixer group's chain.","src":"doc","g":"audio"},{"id":"TA-75","ex":["GD","AA"],"d":"Audio","q":"You can automate or animate an Audio Mixer's exposed parameters using Timeline or Animation clips.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Exposed mixer parameters can be keyframed like any other animatable property, enabling scripted or timeline-driven audio changes.","src":"doc","g":"audio"},{"id":"TA-76","ex":["GD","AA","PP","PA"],"d":"UI","q":"Which Canvas Render Mode makes UI always overlay on screen regardless of camera position?","o":["Screen Space - Overlay","Screen Space - Camera","World Space","Screen Space - Fixed"],"a":0,"w":[null,"Screen Space - Camera follows a camera's settings.","World Space places UI in the 3D scene.","There's no \"Screen Space - Fixed\" mode."],"r":"","e":"Screen Space - Overlay renders UI directly on top of everything else, independent of any camera's position or movement.","src":"doc","g":"canvas"},{"id":"TA-77","ex":["GD","AA","PP","PA"],"d":"UI","q":"Screen Space - Camera render mode ties the Canvas to the perspective of a specific assigned camera.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"In this mode, the Canvas is placed at a set distance in front of the assigned camera, so camera settings (like field of view) affect the UI's rendering.","src":"doc","g":"canvas"},{"id":"TA-78","ex":["GD","AA","PP","PA"],"d":"UI","q":"Which Canvas Render Mode places UI elements physically within the 3D scene, viewable like other world objects?","o":["Screen Space - Overlay","Screen Space - Camera","World Space","None of the above"],"a":2,"w":["Overlay sits on top of the screen.","Camera mode renders in front of one camera.",null,"World Space exists, so \"none of the above\" is wrong."],"r":"","e":"World Space treats the Canvas like any other GameObject in 3D space — useful for in-world UI such as health bars above characters.","src":"doc","g":"canvas"},{"id":"TA-79","ex":["GD","AA","PP","PA"],"d":"UI","q":"A single Canvas can only contain one type of UI element, such as only Buttons.","o":["True","False"],"a":1,"w":["The statement is false, so \"True\" is incorrect. See the explanation on the correct option.",null],"r":"","e":"A Canvas can hold any mix of UI element types — buttons, text, images, sliders, and more — simultaneously.","src":"doc","g":"canvas"},{"id":"TA-80","ex":["GD","AA","PP","PA"],"d":"UI","q":"Which component automatically arranges multiple child UI elements into a row or column?","o":["Content Size Fitter","Horizontal/Vertical Layout Group","Canvas Scaler","Aspect Ratio Fitter"],"a":1,"w":["Content Size Fitter sizes an element to its content; it doesn't arrange children.",null,"Canvas Scaler scales the whole canvas.","Aspect Ratio Fitter keeps a ratio."],"r":"","e":"Horizontal and Vertical Layout Group components automatically position and space their child elements in a line.","src":"doc","g":"canvas"},{"id":"TA-81","ex":["GD","AA","PP","PA"],"d":"UI","q":"A Content Size Fitter can automatically resize a UI element to fit the size of its content.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Content Size Fitter adjusts a RectTransform's width/height to match its content, such as text length or child layout size.","src":"doc","g":"canvas"},{"id":"TA-82","ex":["GD","AA","PP","PA"],"d":"UI","q":"Which component would you use to create a scrollable list of UI items?","o":["Scroll Rect (Scroll View)","Slider","Toggle Group","Mask"],"a":0,"w":[null,"Slider picks a value.","Toggle Group makes radio buttons.","Mask only clips. Scroll Rect adds the scrolling."],"r":"","e":"Scroll Rect (typically added via the Scroll View prefab) provides the scrolling viewport and content behavior for lists.","src":"doc","g":"canvas"},{"id":"TA-83","ex":["GD","AA","PP","PA"],"d":"UI","q":"The Canvas Scaler's 'Constant Pixel Size' mode keeps UI elements the same pixel size regardless of screen resolution.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Constant Pixel Size means UI elements stay a fixed number of pixels, which can look smaller/larger relatively as resolution changes, unlike 'Scale With Screen Size'.","src":"doc","g":"canvas"},{"id":"TA-84","ex":["GD","AA","PP","PA"],"d":"UI","q":"Which UI component is used to display non-interactive text?","o":["Text / TextMeshPro - Text","Input Field","Dropdown","Toggle"],"a":0,"w":[null,"Input Field is for editable text.","Dropdown is for choosing options.","Toggle is an on/off control."],"r":"","e":"The (legacy) Text component or TextMeshPro's Text component displays static, non-editable text on the UI.","src":"doc","g":"canvas"},{"id":"TA-85","ex":["GD","AA","PP","PA"],"d":"UI","q":"TextMeshPro generally provides sharper text rendering and more formatting options than the legacy UI Text component.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"TextMeshPro uses signed distance field rendering and richer styling/formatting options, making it the recommended choice over legacy Text.","src":"doc","g":"canvas"},{"id":"TA-86","ex":["GD","AA","PP","PA"],"d":"UI","q":"Which property on a RectTransform defines the point around which it rotates and scales?","o":["Anchor","Pivot","Offset","Rect"],"a":1,"w":["Anchors fix the element relative to its parent.",null,"Offsets are distances from the anchors.","Rect is the computed rectangle."],"r":"","e":"Pivot sets the local origin point (as a normalized 0–1 value) used for rotation and scaling of that RectTransform.","src":"doc","g":"anchors"},{"id":"TA-87","ex":["GD","AA","PP","PA"],"d":"UI","q":"Anchors are defined as normalized (0 to 1) positions relative to the parent RectTransform.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Anchor min/max values range from 0 to 1, representing relative positions within the parent's rectangle.","src":"doc","g":"anchors"},{"id":"TA-88","ex":["GD","AA","PP","PA"],"d":"UI","q":"Which UI component lets a player choose one option from a dropdown list?","o":["Dropdown","Toggle","Slider","Scrollbar"],"a":0,"w":[null,"Toggle is on/off.","Slider picks a range value.","Scrollbar scrolls."],"r":"","e":"The Dropdown component presents a list of options the player can open and select one from.","src":"doc","g":"canvas"},{"id":"TA-89","ex":["GD","AA","PP","PA"],"d":"UI","q":"A Toggle Group can be used to make a set of Toggle components behave like radio buttons, where only one can be selected at a time.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Assigning multiple Toggles to the same Toggle Group ensures selecting one automatically deselects the others.","src":"doc","g":"canvas"},{"id":"TA-90","ex":["GD","AA","PP","PA"],"d":"UI","q":"What does the 'Raycast Target' checkbox on a UI Graphic component control?","o":["Whether the element casts a shadow","Whether the element can block or receive pointer/click events","Whether the element is visible in builds","Whether the element uses TextMeshPro"],"a":1,"w":["UI Graphics don't cast shadows (there is a Shadow effect, but it's separate).",null,"Visibility is the GameObject or Canvas Group.","It's unrelated to TMP."],"r":"","e":"Raycast Target determines if that UI element participates in receiving/blocking UI input raycasts (clicks, taps).","src":"doc","g":"eventsystem"},{"id":"TA-91","ex":["GD","AA","PP","PA"],"d":"UI","q":"Disabling Raycast Target on a background Image can prevent it from blocking clicks meant for elements layered above or behind it.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Purely decorative background images commonly have Raycast Target disabled so they don't intercept clicks intended for interactive elements.","src":"doc","g":"eventsystem"},{"id":"TA-92","ex":["GD","AA","PP","PA"],"d":"UI","q":"Which layout component automatically arranges children into a grid of rows and columns?","o":["Grid Layout Group","Horizontal Layout Group","Vertical Layout Group","Aspect Ratio Fitter"],"a":0,"w":[null,"Horizontal makes one row.","Vertical makes one column.","Aspect Ratio Fitter keeps a ratio."],"r":"","e":"Grid Layout Group positions children in a uniform grid, commonly used for inventories or item selection screens.","src":"doc","g":"canvas"},{"id":"TA-93","ex":["GD","AA","PP","PA"],"d":"UI","q":"A Canvas Group component can be used to fade or disable interaction with a whole group of UI elements at once.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Canvas Group's Alpha, Interactable, and Blocks Raycasts properties apply uniformly to every UI element beneath it in the hierarchy.","src":"doc","g":"canvas"},{"id":"TA-94","ex":["GD","AA","PP","PA"],"d":"UI","q":"Which Canvas Group property, when set to 0, makes its UI children fully transparent?","o":["Interactable","Blocks Raycasts","Alpha","Ignore Parent Groups"],"a":2,"w":["Interactable turns interaction on or off.","Blocks Raycasts turns hit-testing on or off.",null,"Ignore Parent Groups overrides parent Canvas Groups."],"r":"","e":"Alpha controls the overall opacity of everything under that Canvas Group, with 0 being fully invisible.","src":"doc","g":"eventsystem"},{"id":"TA-95","ex":["GD","AA","PP","PA"],"d":"UI","q":"'Interactable' and 'Blocks Raycasts' are separate, independently-controllable properties on a Canvas Group.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Interactable disables/enables interaction (like clicking buttons), while Blocks Raycasts separately controls whether the group intercepts raycasts at all — they don't have to match.","src":"doc","g":"eventsystem"},{"id":"TA-96","ex":["GD","AA","PP","PA"],"d":"UI","q":"What is the primary purpose of the Event System in UI interaction?","o":["It renders the Canvas to the screen","It processes and routes input events (clicks, taps, navigation) to UI elements","It stores UI color themes","It compresses UI textures"],"a":1,"w":["The Canvas renders UI.",null,"Themes are handled by styles or TMP style sheets.","Texture compression is an import setting."],"r":"","e":"The Event System (with its Input Module) is the mechanism that detects input and sends the appropriate events to UI components.","src":"doc","g":"eventsystem"},{"id":"TA-97","ex":["GD","AA","PP","PA"],"d":"UI","q":"Only one Event System should typically be active in a scene at a time.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Having multiple active Event Systems causes conflicting input handling and Unity will warn about it — only one should be active.","src":"doc","g":"eventsystem"},{"id":"TA-98","ex":["GD","AA","PP","PA"],"d":"UI","q":"Which mechanism lets you detect drag-and-drop interactions on a UI element?","o":["Event Trigger component or IDragHandler interface","Content Size Fitter","Canvas Scaler","Text Mesh Pro Style Sheet"],"a":0,"w":[null,"Content Size Fitter resizes elements.","Canvas Scaler scales the canvas.","TMP style sheets are text styles."],"r":"","e":"You can implement drag interactions either via the Event Trigger component in the Inspector or by scripting IDragHandler/IBeginDragHandler/IEndDragHandler.","src":"doc","g":"canvas"},{"id":"TA-99","ex":["GD","AA","PP","PA"],"d":"UI","q":"Anchoring all four corners of a RectTransform to stretch across (0,0) to (1,1) makes the element resize together with its parent.","o":["True","False"],"a":0,"w":[null,"The statement is true, so \"False\" is incorrect. See the explanation on the correct option."],"r":"","e":"Stretching anchors to the full parent rectangle ties the element's edges to the parent's edges, so it resizes when the parent does.","src":"doc","g":"anchors"},{"id":"TA-100","ex":["GD","AA","PP","PA"],"d":"UI","q":"Which Canvas Scaler UI Scale Mode should you use to keep UI elements a fixed pixel size regardless of screen resolution?","o":["Scale With Screen Size","Constant Pixel Size","Constant Physical Size","World Space"],"a":1,"w":["Scale With Screen Size scales UI with resolution.",null,"Constant Physical Size keeps physical size (cm or in) using DPI.","World Space is a Canvas Render Mode, not a scale mode."],"r":"","e":"Constant Pixel Size keeps elements at the exact pixel dimensions set in the Editor, unaffected by the device's screen resolution.","src":"doc","g":"canvas"},{"id":"NAA-1","ex":["AA"],"d":"Asset Management","q":"A pixel-art sprite looks blurry and its colors are smeared in the Game view. Which import settings fix it?","o":["Filter Mode = Point (no filter) and Compression = None","Filter Mode = Trilinear and Compression = High Quality","Generate Mip Maps = On","Sprite Mode = Multiple"],"w":[null,"Trilinear blurs between texels and mip levels, the opposite of crisp pixels.","Mipmaps add blur at a distance. Pixel art usually turns them off.","That slices a sheet. It doesn't affect sharpness."],"a":0,"r":"Point filtering keeps hard pixel edges, and turning compression off prevents color artifacts in low-color art.","e":"Also set Pixels Per Unit to match your art grid (for example 16 or 32), and use the Pixel Perfect Camera (URP 2D) to snap rendering to the pixel grid.","src":"new","g":"assets"},{"id":"NAA-2","ex":["AA"],"d":"Asset Management","q":"You import a character spritesheet containing 12 animation frames on one texture. What do you do in the Sprite Editor?","o":["Set Sprite Mode to Multiple, then Slice (Grid By Cell Size or Automatic) and Apply","Set Sprite Mode to Single and crop manually","Set Texture Type to Normal Map","Import 12 copies of the texture"],"w":[null,"Single gives one sprite per texture.","That's for lighting detail, not slicing.","That wastes memory and is unnecessary."],"a":0,"r":"Multiple mode lets one texture hold many sprites. Slicing defines each frame's rect and pivot.","e":"The Sprite Editor also sets pivots, borders (for 9-slicing UI), custom outlines (Custom Outline mode, to reduce overdraw) and physics shapes.","src":"new","g":"pbr"},{"id":"NAA-3","ex":["AA"],"d":"Asset Management","q":"A UI panel image must stretch to any size without distorting its rounded corners. What should you use?","o":["9-slicing: set Borders in the Sprite Editor and Image Type = Sliced","Image Type = Simple with Preserve Aspect","Image Type = Filled","A higher texture resolution"],"w":[null,"That scales the whole image uniformly. The corners still scale.","Filled is for radial or linear fills, like cooldown and health bars.","Resolution doesn't stop corner distortion."],"a":0,"r":"The corners stay fixed while the edges and center stretch or tile.","e":"The same Border data works for Sprite Renderer Draw Mode = Sliced or Tiled in 2D world sprites.","src":"new","g":"assets"},{"id":"NAA-4","ex":["AA"],"d":"Asset Management","q":"When importing a rigged FBX character, where do you choose Humanoid vs Generic?","o":["The Rig tab of the Model Import Settings (Animation Type)","The Materials tab","The Animator Controller's Parameters tab","Project Settings > Physics"],"w":[null,"That tab handles material extraction and remapping.","Parameters drive transitions, not rig type.","Physics has nothing to do with rigs."],"a":0,"r":"Animation Type: None, Legacy, Generic, Humanoid. Humanoid creates an Avatar that you can configure and retarget.","e":"Model importer tabs: Model (scale, mesh compression, read/write, normals), Rig, Animation (clips, loop, root motion, events, masks), Materials (extract textures and materials, remap).","src":"new","g":"animator"},{"id":"NAA-5","ex":["AA"],"d":"Asset Management","q":"A model imports 100× too small compared to other assets. What is the cleanest fix?","o":["Adjust Scale Factor or Convert Units in the Model tab (or fix the export units in the DCC tool)","Set the Transform scale to 100 in every scene","Change Project Settings > Time","Re-import the model as OBJ"],"w":[null,"It works, but non-unit transform scale complicates physics, particles and child objects.","Time has nothing to do with model scale.","The format doesn't fix the unit mismatch."],"a":0,"r":"Fixing scale at import keeps the transform scale at 1, which avoids physics and lighting oddities.","e":"Unity uses 1 unit = 1 meter. Many DCC exports default to centimeters. Apply transforms in Blender (Ctrl+A) before export.","src":"new","g":"assets"},{"id":"NAA-6","ex":["AA"],"d":"Asset Management","q":"Which tool lets you model and edit simple level geometry (blockouts) directly inside the Unity Editor?","o":["ProBuilder","Terrain Tools","Shader Graph","Timeline"],"w":[null,"Terrain sculpts heightmap landscapes, not architectural meshes.","Shader Graph builds shaders, not meshes.","Timeline sequences animation."],"a":0,"r":"ProBuilder creates and edits meshes in the Editor (extrude, bevel, UV) and is ideal for greyboxing.","e":"Typical workflow: ProBuilder greybox → playtest scale and flow → replace with final art from your DCC tool. Use Polybrush for vertex painting and scattering on meshes.","src":"new","g":"shader"},{"id":"NAA-7","ex":["AA"],"d":"Asset Management","q":"You want to share a set of materials, prefabs and textures with another project. Which option keeps dependencies and folder structure?","o":["Export Package (.unitypackage) from the Project window, including dependencies","Copy the files in Explorer without .meta files","Send the Library folder","Build the game and copy the build"],"w":[null,"Missing .meta files create new GUIDs and break references.","Library is a cache, not shareable content.","Builds don't contain editable assets."],"a":0,"r":"Unitypackages bundle assets with .meta GUIDs so references stay intact.","e":"Asset Store and Package Manager packages are installed through Window > Package Manager (My Assets tab for Asset Store purchases).","src":"new","g":"assets"},{"id":"NAA-8","ex":["AA"],"d":"Animation","q":"You want the character's upper body to play a \"wave\" animation while its legs keep walking. What do you set up?","o":["A second Animator layer with an upper-body Avatar Mask, set to Override with weight 1","A Blend Tree between Walk and Wave","Any State transition into Wave","Two Animator components on the same object"],"w":[null,"That blends the whole body, half walking and half waving.","That replaces the walk entirely.","Only one Animator per GameObject is supported."],"a":0,"r":"The mask limits the layer to the spine, arms and head, while the base layer keeps animating the legs.","e":"Layer blending: Override replaces lower layers, Additive adds on top (good for breathing or recoil). Sync layers reuse a state machine with different clips (for example an injured variant).","src":"new","g":"blendtree"},{"id":"NAA-9","ex":["AA"],"d":"Animation","q":"Which tool sequences a cutscene with camera shots, animation, audio and activation tracks on a single timeline?","o":["Timeline","The Animator window","The Animation window","The Audio Mixer"],"w":[null,"The Animator is a state machine, not a linear sequence.","It edits one clip's keyframes, not a multi-track sequence.","The mixer routes sound."],"a":0,"r":"Timeline uses a Playable Director and tracks: Animation, Audio, Activation, Signal, plus Cinemachine tracks.","e":"Pair Timeline with Cinemachine for camera blends between virtual cameras. Signals fire events at specific times.","src":"new","g":"animator"},{"id":"NAA-10","ex":["AA"],"d":"Animation","q":"A 2D character is made of separate body-part sprites rigged with bones inside Unity. Which package is this?","o":["2D Animation (with the Skinning Editor)","2D Tilemap Extras","Cinemachine","ProBuilder"],"w":[null,"That adds Rule and Animated tiles.","Cinemachine is cameras.","ProBuilder is 3D mesh modeling."],"a":0,"r":"2D Animation adds bones, weights and Sprite Skin for deforming sprites, plus Sprite Library and Resolver for swapping parts.","e":"Import a layered PSB with the 2D PSD Importer to keep layers as separate sprites in a ready-made rig hierarchy.","src":"new","g":"tilemap"},{"id":"NAA-11","ex":["AA"],"d":"Lighting","q":"Which light setting softens shadow edges in HDRP/URP by modeling a larger light source?","o":["Shadow softness / light source radius (soft shadows with a higher shape radius or angular diameter)","Shadow Bias only","Culling Mask","Light Cookie"],"w":[null,"Bias fights shadow acne and peter-panning. It doesn't soften edges.","Culling Mask chooses which layers the light affects.","A cookie projects a texture pattern."],"a":0,"r":"A bigger emitting area spreads the penumbra, giving softer shadows.","e":"Shadow artifacts: acne (striped self-shadowing) → increase Depth Bias. Peter-panning (shadow detached from object) → reduce bias or Normal Bias. These are classic exam items.","src":"new","g":"pipeline"},{"id":"NAA-12","ex":["AA"],"d":"Lighting","q":"A lamp should project a stained-glass pattern onto the floor. Which feature do you use?","o":["A Light Cookie texture on a Spot Light","A Lens Flare","A Halo","Reflection Probe"],"w":[null,"Flares are bright sprites in camera space.","A halo is a glow around the light source.","Probes capture reflections."],"a":0,"r":"Cookies mask the light with a texture to create patterns like windows or foliage.","e":"Point lights use cubemap cookies, Spot and Directional use 2D cookies. In URP, enable Light Cookies in the URP Asset.","src":"new","g":"probes"},{"id":"NAA-13","ex":["AA"],"d":"Lighting","q":"Which feature fakes small-scale contact shadows in creases and corners as a post or screen-space effect?","o":["Ambient Occlusion (SSAO in URP, or baked AO)","Bloom","Vignette","Fog"],"w":[null,"Bloom adds glow to bright areas.","Vignette darkens the screen edges.","Fog fades distant objects."],"a":0,"r":"AO darkens areas where ambient light is blocked, adding depth to crevices.","e":"In URP, add the Screen Space Ambient Occlusion renderer feature to the Universal Renderer. Baked AO can also be generated by the lightmapper.","src":"new","g":"pipeline"},{"id":"NAA-14","ex":["AA"],"d":"Lighting","q":"Your lightmaps show visible seams and blotchy noise. What helps most?","o":["Make sure meshes have good lightmap UVs (Generate Lightmap UVs), and increase samples and lightmap resolution as needed","Switch every light to Realtime","Increase the Main Camera's Field of View","Lower texture compression on albedo maps"],"w":[null,"That gives up baking entirely.","The camera doesn't affect baked data.","Albedo compression doesn't create lightmap seams."],"a":0,"r":"Overlapping or bad UV2 causes seams, and too few samples cause noise. Turn on denoising in Lighting settings.","e":"Lighting window: Lightmapper (Progressive GPU/CPU), Direct/Indirect samples, Lightmap Resolution (texels per unit), Max Bounces, Filtering (OIDN/Optix denoiser), and Scale In Lightmap per renderer.","src":"new","g":"lightmodes"},{"id":"NAA-15","ex":["AA"],"d":"Lighting","q":"Which feature gives realistic reflections on a shiny marble floor that change with the room?","o":["A Reflection Probe (baked, or realtime if objects move) placed in the room","A Light Probe Group","A Directional Light with high intensity","A Normal Map"],"w":[null,"Light probes are diffuse lighting, not mirror reflections.","Intensity doesn't create reflections.","A normal map changes surface detail, not the reflected environment."],"a":0,"r":"The probe captures a cubemap of the surroundings. Box Projection makes reflections line up with interior walls.","e":"In HDRP, Screen Space Reflections and ray-traced reflections are available too. Reflection Probe updates in realtime are costly, so use Via Scripting or Every Frame carefully.","src":"new","g":"probes"},{"id":"NAA-16","ex":["AA"],"d":"Lighting, Cameras & Effects","q":"A two-player local game needs a split screen. How do you set it up?","o":["Two cameras with Viewport Rect set to (0,0,0.5,1) and (0.5,0,0.5,1)","Two Canvases in World Space","One camera with Field of View 120","Two Audio Listeners"],"w":[null,"Canvases render UI, not separate views.","That's a wide view, not a split.","Audio isn't split screen, and only one listener should be active."],"a":0,"r":"The Viewport Rect sets the normalized region of the screen each camera renders to.","e":"Use Viewport Rect for minimaps (a small corner rect), or a Render Texture assigned to a RawImage for a minimap with custom framing.","src":"new","g":"audio"},{"id":"NAA-17","ex":["AA"],"d":"Lighting, Cameras & Effects","q":"Your minimap should show the level from above on a UI panel. Which approach is standard?","o":["A top-down camera rendering to a Render Texture, displayed by a Raw Image in the UI","A second Main Camera tag","Set the Canvas to Screen Space - Camera","Use a Light Probe"],"w":[null,"Tags don't produce a minimap.","That changes how UI renders, not the map view.","Probes are lighting data."],"a":0,"r":"The render texture captures the camera output for use as a texture anywhere.","e":"Use an orthographic projection for minimaps, a Culling Mask to show only map icons, and keep the render texture resolution modest for performance.","src":"new","g":"canvas"},{"id":"NAA-18","ex":["AA"],"d":"Lighting, Cameras & Effects","q":"Which camera setting determines which layers a camera draws?","o":["Culling Mask","Clear Flags / Background Type","Depth / Priority","Clipping Planes"],"w":[null,"These decide what fills the empty background.","These decide camera render order.","These set the near and far draw distances."],"a":0,"r":"Culling Mask includes or excludes layers, for example a UI camera showing only the UI layer.","e":"In URP, a camera stack uses a Base camera plus Overlay cameras (for example for weapons or UI). In the Built-in pipeline, Depth sets order and Clear Flags = Depth Only gives overlay-like behavior.","src":"new","g":"camera"},{"id":"NAA-19","ex":["AA"],"d":"Lighting, Cameras & Effects","q":"Which package gives procedural cameras that follow, frame and blend between shots without custom code?","o":["Cinemachine","Timeline only","Post-processing Volume","ProBuilder"],"w":[null,"Timeline sequences things but doesn't provide procedural camera behavior by itself.","Volumes change the look, not camera movement.","ProBuilder is modeling."],"a":0,"r":"Cinemachine Cameras (virtual cameras) with Follow/LookAt, noise, confiners and blends are driven by a Cinemachine Brain on the Unity camera.","e":"Cinemachine 3 (Unity 6) renames Virtual Camera to CinemachineCamera, with modular Position/Rotation Control components.","src":"new","g":"camera"},{"id":"NAA-20","ex":["AA"],"d":"Materials & Effects","q":"In Shader Graph, which node lets you animate a texture scrolling over time, for example flowing water?","o":["Time node feeding a Tiling And Offset node's Offset input","Fresnel Effect node","Normal From Height only","Vertex Color node"],"w":[null,"Fresnel adds rim lighting based on view angle.","That converts height to normals.","That reads mesh vertex colors."],"a":0,"r":"Time increases each frame, and putting it into Offset shifts the UVs and scrolls the texture.","e":"Expose properties (speed, tint) on the Blackboard so materials can tweak them. Multiply Time by a speed float. Use Sample Texture 2D with the modified UVs.","src":"new","g":"shader"},{"id":"NAA-21","ex":["AA"],"d":"Materials & Effects","q":"You want a glowing rim around a character when viewed from the side, like a force field. Which Shader Graph node is key?","o":["Fresnel Effect","Gradient Noise","Step","Position node in Object space"],"w":[null,"Noise gives procedural patterns, not a rim.","Step is a hard threshold function.","Position alone doesn't capture viewing angle."],"a":0,"r":"Fresnel is bright where the surface faces away from the view, giving a rim glow. Feed it into Emission.","e":"Force-field recipe: Fresnel × color → Emission, Transparent surface, plus scene depth intersection for edge highlights.","src":"new","g":"shader"},{"id":"NAA-22","ex":["AA"],"d":"Materials & Effects","q":"Which output on a Lit material makes a surface appear to glow and drive Bloom?","o":["Emission (with HDR intensity above 1)","Metallic","Occlusion","Smoothness"],"w":[null,"Metallic controls metal vs dielectric reflection.","AO darkens crevices.","Smoothness controls glossiness."],"a":0,"r":"Emission adds light independent of scene lights. HDR values push it over the bloom threshold.","e":"For emissive surfaces to light the baked scene, set Global Illumination to Baked on the material and mark the objects static.","src":"new","g":"pbr"},{"id":"NAA-23","ex":["AA"],"d":"Materials & Effects","q":"In the PBR metallic workflow, what values does a bare, rough plastic surface usually use?","o":["Metallic ≈ 0, Smoothness low","Metallic = 1, Smoothness = 1","Metallic = 1, Smoothness low","Metallic 0.5 for everything"],"w":[null,"That's polished chrome.","That's brushed or rough metal.","Real materials are mostly 0 or 1. Middle values are only for transitions like dirt over metal."],"a":0,"r":"Plastics are dielectrics (non-metal), and a rough surface has low smoothness.","e":"The Base Map holds albedo without baked lighting. The Metallic map uses R for metallic and A for smoothness in URP. Normal maps must be imported as Texture Type = Normal Map.","src":"new","g":"pbr"},{"id":"NAA-24","ex":["AA"],"d":"Materials & Effects","q":"Which post-processing effect maps HDR scene colors to the display range and sets the film-like look?","o":["Tonemapping (for example ACES or Neutral)","Chromatic Aberration","Depth of Field","Film Grain"],"w":[null,"That splits colors at the screen edges.","That blurs by focus distance.","That adds noise texture."],"a":0,"r":"Tonemapping compresses the HDR range into displayable values and keeps highlights from clipping.","e":"In URP/HDRP, use a Volume (Global or Local with a collider) with a Volume Profile containing overrides: Bloom, Color Adjustments, Tonemapping, Vignette, and others. Turn on Post Processing on the camera.","src":"new","g":"shader"},{"id":"NAA-25","ex":["AA"],"d":"Materials & Effects","q":"Which effects tool is designed for millions of GPU-simulated particles in URP/HDRP?","o":["Visual Effect Graph","The Particle System (Shuriken)","The Trail Renderer","The Line Renderer"],"w":[null,"Shuriken is CPU-based. It's flexible but limited in count.","Trail Renderer draws trails behind moving objects.","Line Renderer draws a polyline."],"a":0,"r":"VFX Graph simulates on the GPU with compute shaders and is built for massive particle counts.","e":"Choose Shuriken for mobile, low counts, or physics collisions with the world. Choose VFX Graph for big compute-capable effects. VFX Graph needs compute-shader support.","src":"new","g":"pipeline"},{"id":"NAA-26","ex":["AA"],"d":"Materials & Effects","q":"Many objects share the same material and mesh. Which feature most directly reduces draw calls by rendering them together?","o":["GPU Instancing (or the SRP Batcher / GPU Resident Drawer in URP/HDRP)","Increasing texture resolution","Using a unique material per object","Turning on Realtime GI"],"w":[null,"That adds memory and doesn't reduce calls.","That prevents batching.","That costs more and doesn't batch anything."],"a":0,"r":"Instancing renders many copies of one mesh and material in a single call. The SRP Batcher cuts the cost of setting material state.","e":"Static Batching combines static meshes. Dynamic batching suits small meshes in Built-in. The Frame Debugger shows why batches break.","src":"new","g":"lightmodes"},{"id":"NAA-27","ex":["AA"],"d":"Render Pipelines","q":"A studio is making a mobile and Switch title with stylized art. Which render pipeline fits best?","o":["Universal Render Pipeline (URP)","High Definition Render Pipeline (HDRP)","The Built-in pipeline, because it's newest","No pipeline: render with UI Toolkit"],"w":[null,"HDRP targets high-end PC and consoles with compute-capable GPUs. It isn't for mobile or Switch.","Built-in is the legacy pipeline.","UI Toolkit is a UI system."],"a":0,"r":"URP scales from mobile to high-end and is the default for most platforms and stylized projects.","e":"HDRP is for photorealism (physically based lights in lux, volumetrics, ray tracing) on PC and consoles. URP is for broad platform reach, 2D Renderer, and mobile and XR performance.","src":"new","g":"pipeline"},{"id":"NAA-28","ex":["AA"],"d":"Render Pipelines","q":"Which URP renderer supports 2D Lights and Shadow Casters for sprite-based games?","o":["The 2D Renderer (Renderer 2D Data)","The Universal Renderer in Deferred mode","The HDRP Default Frame Settings","The Built-in Forward renderer"],"w":[null,"Deferred is a 3D rendering path, not 2D lights.","Those are HDRP, not 2D.","Built-in has no 2D light system."],"a":0,"r":"URP's 2D Renderer adds Light 2D (Global, Spot, Freeform, Sprite) and Shadow Caster 2D components.","e":"Sprites need the Sprite-Lit-Default material to react to 2D lights. Use Normal Map secondary textures for 2D bumpy lighting.","src":"new","g":"pipeline"},{"id":"NAA-29","ex":["AA"],"d":"Scene Content Design","q":"Which Terrain tool adds grass and small plants that wave in the wind?","o":["Paint Details","Paint Trees","Raise or Lower Terrain","Paint Texture"],"w":[null,"Trees are larger objects, often with LOD and colliders.","That sculpts height.","That paints terrain layers (ground materials)."],"a":0,"r":"Details (grass textures or detail meshes) are painted in density and can be affected by Wind Zones.","e":"Terrain layers hold albedo, normal and mask maps. Terrain Settings cover pixel error and base map distance (performance). Use Terrain Tools package brushes for erosion.","src":"new","g":"lod"},{"id":"NAA-30","ex":["AA"],"d":"Scene Content Design","q":"You placed hundreds of rocks with complex Mesh Colliders, and physics performance dropped. What is the best artist-side fix?","o":["Replace them with primitive or simplified convex colliders that approximate the shape","Turn on Read/Write on every rock mesh","Increase the rocks' polycount","Remove all Rigidbodies from the player"],"w":[null,"That increases memory and doesn't make collision cheaper.","That makes Mesh Colliders even more expensive.","The player needs physics to collide."],"a":0,"r":"Primitive and low-poly convex colliders are much cheaper and usually feel identical to the player.","e":"Use LOD Groups for rendering cost, simple colliders for physics cost, and mark scenery as static for batching and baking.","src":"new","g":"lod"},{"id":"NAA-31","ex":["AA"],"d":"Scene Content Design","q":"Which LOD Group behavior is correct?","o":["Unity switches between LOD0, LOD1 and so on by the object's screen-relative height, and can Cull it at the smallest size","LOD switches by how many lights affect the object","LOD0 is always the lowest detail","LOD Groups need a script to switch levels"],"w":[null,"Lights don't drive LOD.","LOD0 is the highest detail.","Switching is automatic."],"a":0,"r":"LOD transitions are based on the percentage of screen height, not raw distance.","e":"Fade Mode (Cross Fade or SpeedTree) smooths the switch. Models named _LOD0, _LOD1 are grouped automatically on import. LOD Bias in Quality settings scales all thresholds.","src":"new","g":"lod"},{"id":"NAA-32","ex":["AA"],"d":"Industry Awareness","q":"In a game studio, who is mainly responsible for building shaders, tools and pipelines that bridge art and engineering?","o":["A Technical Artist","A Producer","A QA Tester","A Community Manager"],"w":[null,"Producers manage schedule, scope and people.","QA finds bugs and verifies fixes.","Community managers engage players."],"a":0,"r":"Tech artists create shaders, VFX, rigs and tools and set performance budgets for the art team.","e":"Other roles to know: Environment Artist, Character Artist, Lighting Artist, Animator, UI/UX Designer, Level Designer, Gameplay Programmer, Tools Programmer.","src":"new","g":"roles"},{"id":"NAA-33","ex":["AA"],"d":"Industry Awareness","q":"Which file type keeps the layers of a 2D character as separate sprites when imported with the 2D PSD Importer?","o":["PSB (Photoshop Large Document)","A flattened PNG","JPG","FBX"],"w":[null,"PNG has no layers.","JPG has no layers or transparency.","FBX is for 3D models."],"a":0,"r":"The 2D PSD Importer reads PSB layers into a layered sprite prefab, ready for 2D Animation rigging.","e":"Use PNG for sprites that need alpha. Prefer lossless sources and let Unity compress per platform (ASTC for mobile, BC7 for desktop).","src":"new","g":"roles"},{"id":"NGD-34","ex":["GD","AA"],"d":"Tilemap & 2D","q":"You cut several sprites from three different spritesheets and turn them into Tile assets. Can they all be painted onto the same Tilemap?","o":["Yes. A Tilemap only stores references to Tile assets, wherever their sprites came from","No. Every tile on a Tilemap must come from the same spritesheet","Only if all three spritesheets have identical Pixels Per Unit","Only if each spritesheet gets its own Grid"],"w":[null,"There is no such restriction. You may want one atlas for batching, but that's an optimization, not a rule.","A mismatched PPU makes tiles the wrong size in a cell, but they can still be painted.","One Grid is enough. The source sheet doesn't matter to the Grid."],"a":0,"r":"Tile assets point at any sprite, and a Tilemap mixes any Tiles. For performance, pack them into one Sprite Atlas so they batch.","e":"Separate the art (sprites, from any number of sheets) from the data (Tile assets referencing a sprite) and the scene (Tilemap cells referencing Tiles). The exam often tests this layering: Sprite → Tile asset → Tile Palette → Tilemap → Tilemap Renderer.","src":"new","g":"tilemap"},{"id":"NGD-35","ex":["GD","AA"],"d":"Tilemap & 2D","q":"You create a Tilemap with GameObject > 2D Object > Tilemap > Rectangular. Which components are on the child \"Tilemap\" GameObject itself?","o":["Tilemap and Tilemap Renderer","Grid and Tilemap","Tilemap and Tilemap Collider 2D","Sprite Renderer and Tilemap"],"w":[null,"Grid is on the parent object, not the child.","The collider is optional. You add it yourself.","Tilemaps don't use Sprite Renderers. Tilemap Renderer replaces them."],"a":0,"r":"Tilemap stores cell data and Tilemap Renderer draws it. The parent GameObject holds the Grid.","e":"Structure: Grid (parent) → Tilemap child with [Tilemap + Tilemap Renderer]. Add Tilemap Collider 2D (+ Composite Collider 2D and a Static Rigidbody 2D) when the layer needs collision.","src":"new","g":"tilemap"},{"id":"NGD-36","ex":["GD","AA"],"d":"Tilemap & 2D","q":"A designer wants a collision-only layer that is invisible in-game but still blocks the player. What is the cleanest setup?","o":["Add a separate \"Collision\" Tilemap under the same Grid with Tilemap Collider 2D, and disable its Tilemap Renderer","Paint the collision tiles on the Ground layer and set their color alpha to 0","Put a Box Collider 2D on every wall tile by hand","Delete the Grid component so the tiles are hidden"],"w":[null,"They'd still be drawn (and cost fill rate), and art and collision get tangled together.","That's slow and hard to maintain. It's exactly what Tilemap Collider 2D exists to avoid.","Without a Grid the Tilemap can't place cells."],"a":0,"r":"The tiles still produce collider shapes, but nothing is drawn. Painting collision stays easy and separate from art.","e":"Layer by purpose: Background, Ground, Walls, Decoration, Collision. Each Tilemap gets its own Sorting Layer / Order and optional collider. Use Composite Collider 2D to merge many tile colliders into a few smooth outlines.","src":"new","g":"tilemap"},{"id":"NGD-37","ex":["GD","AA"],"d":"Tilemap & 2D","q":"In code, which call returns the Tile at a world position the player clicked?","code":"Vector3Int cell = tilemap.WorldToCell(worldPos);\nTileBase t = tilemap.???(cell);","o":["GetTile(cell)","GetTileAt(worldPos)","FindTile(cell)","SetTile(cell)"],"w":[null,"There is no GetTileAt method. You convert to cell coordinates first.","There is no FindTile method.","SetTile writes a tile and needs a TileBase argument; it doesn't read one."],"a":0,"r":"GetTile takes a cell position (Vector3Int) and returns the TileBase there, or null if the cell is empty.","e":"World ↔ cell conversion: WorldToCell / CellToWorld / GetCellCenterWorld. Read: GetTile, HasTile. Write: SetTile, SetTiles, BoxFill, ClearAllTiles. Call RefreshTile if a Rule Tile's neighbors change.","src":"new","g":"tilemap"},{"id":"NGD-38","ex":["GD","AA"],"d":"Animation","q":"Your player can be damaged during any animation. Where should the transition into the \"Hurt\" state start?","o":["From the Any State node","From the Entry node","From the Exit node","From every state, one transition each"],"w":[null,"Entry only runs when the state machine starts, choosing the default state.","Exit leaves a sub-state machine. It can't be a transition source to Hurt.","It works, but it's error-prone and scales badly. Any State is the intended tool."],"a":0,"r":"Any State → Hurt fires no matter which state is active, so you don't have to draw a transition from every state.","e":"Watch out: an Any State transition can fire again every frame while its condition is true. Uncheck \"Can Transition To Self\" on Any State transitions, and use a Trigger so the condition is consumed.","src":"new","g":"animator"},{"id":"NGD-39","ex":["GD","AA"],"d":"Animation","q":"You fire the \"Jump\" Trigger, but the jump only starts after the current Walk loop finishes. What is the most likely cause?","o":["Has Exit Time is enabled on the Walk → Jump transition","The Trigger parameter should be a Bool","Transition Duration is set to 0","The Animator's Update Mode is Animate Physics"],"w":[null,"Changing the type doesn't fix the waiting. Exit Time is still gating the transition.","Duration 0 means an instant cut once the transition starts. It doesn't delay the start.","That changes the update timing step, not whether a transition waits for the clip end."],"a":0,"r":"With Has Exit Time on, the transition waits for the normalized Exit Time even if the trigger is already set. Turn it off for responsive actions.","e":"Rule of thumb: input-driven actions (jump, attack, hurt) turn Has Exit Time OFF and use conditions. Clip-finishing transitions (attack → idle) turn it ON with no conditions.","src":"new","g":"animator"},{"id":"NGD-40","ex":["GD","AA"],"d":"Animation","q":"Which Animator parameter type resets itself automatically once a transition uses it?","o":["Trigger","Bool","Int","Float"],"w":[null,"Bools stay set until a script changes them.","Ints stay set until a script changes them.","Floats stay set until a script changes them."],"a":0,"r":"Triggers are one-shot flags that reset when a transition uses them. Call ResetTrigger() if one stays set without being used.","e":"Script API: animator.SetTrigger(\"Jump\"), SetBool(\"IsGrounded\", true), SetFloat(\"Speed\", v, dampTime, Time.deltaTime), SetInteger. Cache the IDs with Animator.StringToHash(\"Speed\") for performance.","src":"new","g":"animator"},{"id":"NGD-41","ex":["GD","AA"],"d":"Animation","q":"An Animation Event placed on a frame of a clip does nothing at runtime. What is the most common reason?","o":["No script on the same GameObject as the Animator has a public or private method with that exact name","Animation Events only work in the Built-in Render Pipeline","Animation Events only fire in the Editor, never in builds","The clip needs Loop Pose enabled"],"w":[null,"Events don't depend on the render pipeline.","They fire in builds too.","Loop Pose affects how the root loops, not events."],"a":0,"r":"Animation Events call methods by name on components of the Animator's GameObject. A wrong name or wrong object means nothing happens (and a warning in the Console).","e":"The event can pass one parameter: float, int, string, Object reference, or an AnimationEvent. Keep event receivers on the same GameObject as the Animator, or forward them with a relay script.","src":"new","g":"animator"},{"id":"NGD-42","ex":["GD","AA"],"d":"Audio","q":"Sounds play in your scene but you hear nothing in the Game view. The Console shows no errors. What should you check first?","o":["That exactly one active Audio Listener exists, usually on the Main Camera","That every Audio Source has Spatial Blend set to 3D","That an Audio Mixer asset exists in the project","That the clips are imported as Streaming"],"w":[null,"2D sounds are audible everywhere, so Spatial Blend isn't the cause.","Mixers are optional. Sources go straight to the listener by default.","The load type affects memory, not whether sound is heard."],"a":0,"r":"Without a listener nothing is heard. Deleting and re-creating cameras often removes it.","e":"Also check: the Game view's \"Mute Audio\" toggle, AudioListener.volume, the source's Mute/Volume, the source being out of Max Distance, and the mixer group's attenuation at -80 dB.","src":"new","g":"spatial"},{"id":"NGD-43","ex":["GD","AA"],"d":"Audio","q":"You need separate Music and SFX volume sliders in a settings menu. Which setup is correct?","o":["An Audio Mixer with Music and SFX groups, each group's Volume exposed as a parameter set via AudioMixer.SetFloat","Change AudioListener.volume for each slider","Give every Audio Source a different Priority","Use two Audio Listeners, one per category"],"w":[null,"That's one global volume. It can't separate music from SFX.","Priority decides voice culling, not user volume.","Only one listener should be active."],"a":0,"r":"Route sources into groups, expose \"MusicVol\" and \"SFXVol\", and set decibels from the slider: Mathf.Log10(value) * 20.","e":"Mixer volume is in decibels (−80 to +20). A linear 0–1 slider must be converted: dB = Mathf.Log10(Mathf.Max(v, 0.0001f)) * 20.","src":"new","g":"audio"},{"id":"NGD-44","ex":["GD","AA"],"d":"UI","q":"Buttons render correctly but nothing happens when you click them. Which object was most likely deleted?","o":["The EventSystem","The Canvas Scaler","The Main Camera","The Audio Listener"],"w":[null,"Canvas Scaler handles resolution scaling, not input.","Screen Space - Overlay UI renders and receives clicks without any camera. The camera isn't what routes input.","Audio has nothing to do with UI input."],"a":0,"r":"The EventSystem (with an Input Module) sends pointer and keyboard input to UI. Without it, UI renders but never receives clicks.","e":"A clickable UI needs: Canvas + Graphic Raycaster, an EventSystem + Input Module (Input System UI Input Module for the new Input System), and Raycast Target on the graphic. Watch out: an invisible full-screen Image with Raycast Target on will block every click.","src":"new","g":"audio"},{"id":"NGD-45","ex":["GD","AA"],"d":"UI","q":"Your HUD looks right at 1920×1080 but tiny on a 4K monitor. Which Canva
