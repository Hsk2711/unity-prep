r while sharing the material. (With the SRP Batcher, per-material instances can be faster, so profile.)","e":"In URP/HDRP the base color property is _BaseColor, not _Color. Cache Shader.PropertyToID(\"_BaseColor\").","src":"new","g":"shader"},{"id":"NPP-153","ex":["PP"],"d":"Scene & Environment","q":"You want to spawn 500 bullets per second without GC spikes. What does Unity provide out of the box (2021+)?","o":["UnityEngine.Pool.ObjectPool<T> with create, get, release and destroy callbacks","System.GC.Collect() every frame","Instantiate inside Update and Destroy after 2 seconds","Resources.UnloadUnusedAssets() each spawn"],"w":[null,"Forcing a collection causes stalls.","That causes allocation churn.","That's very slow and unrelated."],"a":0,"r":"The built-in generic pool handles reuse. Bullets call pool.Release(this) instead of Destroy.","e":"Also: ListPool, DictionaryPool and HashSetPool in UnityEngine.Pool for temporary collections. Use collectionCheck in development to catch double release.","src":"new","g":"pool"},{"id":"NPP-154","ex":["PP"],"d":"Scene & Environment","q":"Which Physics query is non-allocating and best for checking many enemies within an explosion radius every frame?","o":["Physics.OverlapSphereNonAlloc(pos, radius, resultsBuffer, mask)","Physics.OverlapSphere(pos, radius)","FindObjectsByType<Enemy>() then a distance check","GameObject.FindGameObjectsWithTag(\"Enemy\")"],"w":[null,"It allocates a new array each call.","That scans the whole scene, which is slow.","It allocates and searches by tag, which is slow."],"a":0,"r":"It fills a preallocated array and creates no garbage.","e":"Similarly RaycastNonAlloc, SphereCastNonAlloc. In Unity 6 many \"NonAlloc\" versions accept Span or array buffers. Always filter with a layer mask.","src":"new","g":"pool"},{"id":"NPP-155","ex":["PP"],"d":"Optimization","q":"The Profiler shows large \"GC.Alloc\" every frame in Update. Which code is the likely culprit?","code":"void Update() {\n    scoreText.text = \"Score: \" + score;\n}","o":["String concatenation every frame allocates a new string","The text field access itself","Update is called too rarely","int score is a value type"],"w":[null,"Reading or assigning a reference doesn't allocate.","Frequency isn't the issue. Allocation is.","Value types alone don't allocate. Boxing or concatenation does."],"a":0,"r":"Update the text only when the score changes, or use TMP SetText(\"Score: {0}\", score) which avoids allocations.","e":"Other GC sources: LINQ, boxing (object o = 5), closures/lambdas capturing variables, foreach on some collections (older runtimes), GetComponents without a list parameter, and Debug.Log in builds.","src":"new","g":"profiler"},{"id":"NPP-156","ex":["PP"],"d":"Optimization","q":"Your mobile game is GPU-bound with full-screen transparent particle effects. Which issue is most likely?","o":["Overdraw and fill rate: many transparent layers drawn on the same pixels","Too many C# scripts","Physics Fixed Timestep is too low","Audio is set to Decompress On Load"],"w":[null,"Script count affects the CPU, not GPU fill.","That's a CPU physics cost.","That's memory and CPU, not GPU."],"a":0,"r":"Transparent particles stack pixel cost. Reduce particle size and count, use the Rendering Debugger's overdraw view, and use simpler shaders.","e":"CPU-bound vs GPU-bound: check the Profiler's CPU main thread vs GPU time (or Gfx.WaitForPresent). Fixes differ: draw call batching for the CPU, resolution, shaders and overdraw for the GPU.","src":"new","g":"profiler"},{"id":"NPP-157","ex":["PP"],"d":"Optimization","q":"Which tool shows each draw call step by step to find out why batching breaks?","o":["Frame Debugger","Memory Profiler","Console","Package Manager"],"w":[null,"The Memory Profiler is for memory snapshots.","The Console shows logs.","The Package Manager installs packages."],"a":0,"r":"Window > Analysis > Frame Debugger lists every rendering event and why the SRP Batcher or a batch was split.","e":"Also know: Profiler (CPU/GPU/Memory/Rendering modules, Deep Profile, Timeline vs Hierarchy views), Profile Analyzer (compare captures), and Memory Profiler package (snapshots, leaks).","src":"new","g":"drawcall"},{"id":"NPP-158","ex":["PP"],"d":"Optimization","q":"Which settings reduce the IL2CPP build size of a mobile app most directly?","o":["Managed Stripping Level (Medium/High) and removing unused packages and assets","Switching to Mono for release builds","Enabling Development Build","Turning on Deep Profiling support"],"w":[null,"Mono isn't available for iOS, and it doesn't shrink builds.","That adds debug symbols and profiling, which makes builds larger.","That adds overhead."],"a":0,"r":"Code stripping removes unused managed code, and removing content reduces data. Use link.xml to keep reflection-used types.","e":"Also: texture compression (ASTC), audio compression (Vorbis quality), the Build Report (Editor log or Build Report Inspector), and Addressables for downloadable content.","src":"new","g":"profiler"},{"id":"NPP-159","ex":["PP"],"d":"Optimization","q":"What is the main benefit of the C# Job System combined with the Burst compiler?","o":["Safe multithreaded, highly optimized native code for data-oriented work (IJob, IJobParallelFor)","It lets you call Unity APIs like transform.position from any thread freely","It replaces coroutines for delays","It speeds up asset import only"],"w":[null,"Most UnityEngine APIs are main-thread only. Use TransformAccessArray or IJobParallelForTransform.","Jobs aren't timers.","It's for runtime code."],"a":0,"r":"Jobs run on worker threads with safety checks, and Burst compiles them to SIMD-optimized native code.","e":"Use NativeArray<T> with Allocator.TempJob/Persistent and always Dispose. Schedule jobs, then Complete() before reading the results. DOTS/ECS (Entities) builds on this.","src":"new","g":"profiler"},{"id":"NPP-160","ex":["PP"],"d":"Optimization","q":"Many UI elements change every frame, which forces the whole Canvas to rebuild. What is the recommended fix?","o":["Split dynamic elements into a separate (nested) Canvas from static ones","Put all UI into one big Canvas","Turn on Raycast Target on every element","Use a World Space canvas for the HUD"],"w":[null,"That's the cause of the problem.","That adds raycast cost and doesn't reduce rebuilds.","The render mode doesn't fix rebuild scope."],"a":0,"r":"Canvas rebuilds are per canvas. Isolating frequently changing elements avoids rebuilding the static parts.","e":"Also: disable the Canvas component instead of SetActive to hide UI cheaply, turn off Raycast Target on non-interactive graphics, and avoid Layout Groups on heavily animated content.","src":"new","g":"eventsystem"},{"id":"NPP-161","ex":["PP"],"d":"Art Pipeline","q":"An artist exports an FBX with 5 animations. How should a programmer split them into separate clips?","o":["In the Model's Animation tab, define clip ranges (start/end frames) for each clip, or import separate takes","Duplicate the FBX five times","Use Timeline to cut the clips at runtime","Write a script to read the bones"],"w":[null,"Unnecessary and wasteful.","Clips are defined at import.","Way too complex for something built in."],"a":0,"r":"The importer can slice one timeline into many clips with their own loop and root settings.","e":"Use an AssetPostprocessor (OnPreprocessModel, OnPostprocessAnimation) to automate import settings for a team's naming conventions.","src":"new","g":"assets"},{"id":"NPP-162","ex":["PP"],"d":"Art Pipeline","q":"Which Editor scripting feature automatically sets texture import settings (for example max size 1024 for \"UI_\" files) whenever files are imported?","o":["An AssetPostprocessor with OnPreprocessTexture","[ExecuteInEditMode] on a MonoBehaviour","A ScriptableObject","PlayerPrefs"],"w":[null,"That runs scene scripts in Edit mode, not import hooks.","It stores data. It doesn't intercept imports.","PlayerPrefs stores settings."],"a":0,"r":"Postprocessors hook into the import pipeline and enforce team rules automatically.","e":"Editor code must live in an Editor folder or an Editor-only assembly definition, or the build fails. Presets (and Preset Manager defaults) are the no-code alternative.","src":"new","g":"assets"},{"id":"NPP-163","ex":["PP"],"d":"Art Pipeline","q":"What is the purpose of Assembly Definition (.asmdef) files?","o":["Splitting code into assemblies so changes recompile only the affected parts and dependencies are explicit","Compressing scripts for smaller builds","Defining scene load order","Storing animation data"],"w":[null,"They don't compress anything.","Scene order is set in Build Profiles.","That's what clips are for."],"a":0,"r":"asmdefs reduce compile times and enforce architecture boundaries. Editor-only assemblies are excluded from builds.","e":"Test assemblies (Unity Test Framework) reference the code under test via asmdef references. Use the Version Defines and Define Constraints fields for optional packages.","src":"new","g":"assets"},{"id":"NPP-164","ex":["PP"],"d":"Teams & Testing","q":"Which Unity Test Framework mode runs tests that need the game loop, like coroutines and physics frames?","o":["PlayMode tests ([UnityTest] returning IEnumerator)","EditMode tests only","Profiler captures","Console Clear on Play"],"w":[null,"EditMode tests run in the Editor without the player loop. They're good for pure logic.","Profiling is measurement, not testing.","That's a Console option."],"a":0,"r":"PlayMode tests run inside Play Mode, so you can yield across frames.","e":"[Test] is for synchronous tests, and [UnityTest] can yield. Run them from the Test Runner window or the command line (-runTests) in CI.","src":"new","g":"profiler"},{"id":"NPP-165","ex":["PP"],"d":"Teams & Testing","q":"Two programmers edited the same scene and get merge conflicts. Which practice reduces this most?","o":["Split content into prefabs and additive sub-scenes, and use Smart Merge (UnityYAMLMerge) with text serialization","Turn on binary asset serialization","Delete .meta files before committing","Have each programmer work in a different Unity version"],"w":[null,"Binary files can't be merged at all.","That breaks references.","That causes even more problems."],"a":0,"r":"Smaller files mean fewer overlapping changes, and UnityYAMLMerge understands Unity's YAML.","e":"Also use file locking for binaries, short-lived feature branches, clear code reviews, and the same Unity version pinned in ProjectVersion.txt.","src":"new","g":"scrum"},{"id":"NPP-166","ex":["PP"],"d":"Teams & Testing","q":"Which preprocessor directive excludes debug-cheat code from release builds?","code":"#if UNITY_EDITOR || DEVELOPMENT_BUILD\n    EnableCheats();\n#endif","o":["The code compiles only in the Editor or in Development Builds","The code runs only on Android","It's a runtime if-statement that checks a setting","It doesn't compile, because || isn't allowed in #if"],"w":[null,"That would be UNITY_ANDROID.","Preprocessor directives work at compile time, not runtime.","Logical operators are allowed in #if."],"a":0,"r":"Scripting define symbols remove the code entirely from release builds.","e":"Custom symbols go in Player Settings > Scripting Define Symbols or the Build Profile. [Conditional(\"DEBUG\")] removes calls to a method.","src":"new","g":"scrum"},{"id":"NPP-167","ex":["PP"],"d":"Teams & Testing","q":"In an Agile team, what is a \"Definition of Done\" for a gameplay feature?","o":["A shared checklist (code reviewed, tested on target device, no new warnings, documented) that every story must meet","The date the publisher signs the contract","The total number of lines of code","A list of bugs to ignore"],"w":[null,"That's a business milestone.","Line count isn't a quality criterion.","That's not a quality standard."],"a":0,"r":"It prevents \"done but not really\" work and keeps quality consistent.","e":"Related terms: backlog, user story, story points, velocity, sprint review vs retrospective, burndown chart, Kanban WIP limits.","src":"new","g":"scrum"},{"id":"NPP-168","ex":["PP"],"d":"Platforms","q":"You need different behavior on iOS vs Android at compile time. Which approach is correct?","o":["#if UNITY_IOS ... #elif UNITY_ANDROID ... #endif","if (Application.platform == \"iOS\")","Use separate Unity projects per platform","#if MOBILE"],"w":[null,"Application.platform is a RuntimePlatform enum, not a string. It's also a runtime check, not compile-time.","That doubles maintenance unnecessarily.","That isn't a built-in Unity symbol."],"a":0,"r":"Platform-dependent compilation symbols compile only the relevant code per target.","e":"Runtime checks are valid too: Application.platform == RuntimePlatform.Android, or Application.isMobilePlatform. Use Build Profiles (Unity 6) for per-platform settings.","src":"new","g":"pipeline"},{"id":"NPP-169","ex":["PP"],"d":"Platforms","q":"Which scripting backend is required for iOS builds and generally gives better runtime performance?","o":["IL2CPP","Mono",".NET Native","WebAssembly only"],"w":[null,"Mono uses JIT and isn't allowed on iOS.","That isn't a Unity scripting backend option.","WebGL uses IL2CPP to Wasm, but that's not the backend choice for iOS."],"a":0,"r":"IL2CPP converts IL to C++ and compiles it ahead of time. It's required for iOS and consoles, and is recommended for Android release (ARM64).","e":"IL2CPP watch-outs: reflection and generic code can be stripped (use link.xml or [Preserve]), and build times are longer.","src":"new","g":"pipeline"},{"id":"NPP-170","ex":["PP"],"d":"Platforms","q":"A VR app must keep a high, stable frame rate. Which rendering choice helps most on standalone headsets?","o":["Single Pass Instanced rendering in URP with careful draw calls and fixed foveated rendering","Multi Pass rendering with HDRP volumetrics","Turning off V-Sync and letting the frame rate float","Increasing the shadow cascades to 4"],"w":[null,"That's expensive and HDRP isn't supported on standalone headsets.","Unstable frame rates cause discomfort. XR runtimes manage sync.","That increases cost."],"a":0,"r":"Single Pass Instanced draws both eyes in one pass, roughly halving the CPU rendering cost.","e":"Use the XR Interaction Toolkit and the OpenXR plugin, target 72/90 Hz, and use baked lighting, low overdraw and LODs.","src":"new","g":"pipeline"},{"id":"NZPRO-171","ex":["PP"],"d":"C# Constructs","q":"What is logged?","code":"int a = 5;\nint b = a++ + ++a;\nDebug.Log($\"{a} {b}\");","o":["7 12","7 11","6 11","5 10"],"w":[null,"That adds 5 + 6 and forgets that ++a increments before returning.","a is incremented twice, so it ends at 7.","The increments happen, so a doesn't stay 5."],"a":0,"r":"a++ returns 5 then sets a to 6. ++a sets a to 7 and returns 7. 5 + 7 = 12.","e":"Postfix (x++) returns the old value, prefix (++x) returns the new value. Exams like to mix both in one expression.","src":"new","g":"valueref"},{"id":"NZPRO-172","ex":["PP"],"d":"C# Constructs","q":"What is printed?","code":"float f = 7 / 2;\nDebug.Log(f);","o":["3","3.5","4","Compile error"],"w":[null,"You'd need 7f / 2 or 7 / 2f for floating-point division.","Integer division truncates. It doesn't round.","Converting an int to a float implicitly is allowed."],"a":0,"r":"7 / 2 is integer division (3), which is then converted to float 3.0.","e":"A classic bug in percentage math: (score / total) * 100 with ints gives 0. Cast first: (float)score / total.","src":"new","g":"valueref"},{"id":"NZPRO-173","ex":["PP"],"d":"C# Constructs","q":"Which delegate type fits a method that takes a float and returns nothing?","o":["Action<float>","Func<float>","Predicate<float>","EventHandler"],"w":[null,"Func<float> takes nothing and returns a float.","Predicate returns a bool.","That has a (sender, EventArgs) signature."],"a":0,"r":"Action<T> is a void delegate. Func<T, TResult> returns a value.","e":"Use event Action<float> OnHealthChanged; and invoke safely with OnHealthChanged?.Invoke(hp). Plain C# delegates are fine to null-check with ?. because they aren't UnityEngine.Objects.","src":"new","g":"valueref"},{"id":"NZPRO-174","ex":["PP"],"d":"C# Constructs","q":"What is the result?","code":"Dictionary<string,int> inv = new();\ninv[\"potion\"] = 2;\ninv[\"potion\"] += 3;\nDebug.Log(inv.TryGetValue(\"elixir\", out int n) + \" \" + inv[\"potion\"]);","o":["False 5","True 5","KeyNotFoundException","False 3"],"w":[null,"The \"elixir\" key doesn't exist.","TryGetValue never throws for a missing key. Indexing inv[\"elixir\"] would.","+= adds to the existing value of 2."],"a":0,"r":"The \"elixir\" key is missing, so TryGetValue returns false. The potion count is 2 + 3 = 5.","e":"Unity doesn't serialize Dictionaries in the Inspector. Use a List of key/value structs and build the dictionary in Awake.","src":"new","g":"valueref"},{"id":"NZPRO-175","ex":["PP"],"d":"C# Constructs","q":"Which keyword lets a derived class change a base method's behavior polymorphically?","code":"public class Enemy : MonoBehaviour { public ??? void Attack() { } }\npublic class Boss : Enemy { public override void Attack() { /* big slam */ } }","o":["virtual","static","sealed","new"],"w":[null,"Static methods can't be overridden.","sealed prevents further overriding.","new hides the method, which isn't polymorphic. Calls through an Enemy reference would run the base version."],"a":0,"r":"A base method must be virtual (or abstract) for derived classes to override it.","e":"abstract classes can't be instantiated or added as components. Use them for shared base logic. Call base.Attack() to extend rather than replace.","src":"new","g":"valueref"},{"id":"NZPRO-176","ex":["PP"],"d":"C# Constructs","q":"Which property definition prevents other scripts from setting Health but still shows a serialized backing field in the Inspector?","o":["[field: SerializeField] public int Health { get; private set; }","public int Health;","[SerializeField] public int Health { get; set; }","static int Health;"],"w":[null,"Any script can set it.","Without field:, the attribute targets the property, which Unity doesn't serialize.","Static fields aren't serialized."],"a":0,"r":"The field: target puts the attribute on the auto-property's backing field, so it's serialized and visible, while set stays private.","e":"Encapsulation in Unity: private serialized fields + public read-only properties + methods that validate changes (TakeDamage clamps to 0).","src":"new","g":"valueref"},{"id":"NZPRO-177","ex":["PP"],"d":"Core Interactions","q":"A coroutine moves a door over 1 second. Which loop is correct?","code":"IEnumerator Open() {\n  float t = 0;\n  while (t < 1f) {\n    t += Time.deltaTime;\n    door.position = Vector3.Lerp(closed, open, t);\n    ???\n  }\n}","o":["yield return null;","yield break;","return;","Thread.Sleep(16);"],"w":[null,"That ends the coroutine immediately.","You can't return without a value in an iterator, and it would end anyway.","That blocks the main thread and freezes the game."],"a":0,"r":"yield return null waits one frame, so the loop advances once per frame.","e":"Lerp with t from 0 to 1 gives linear motion. Use Mathf.SmoothStep(0, 1, t) for ease-in/out. Clamp t or set the final position after the loop.","src":"new","g":"raycast"},{"id":"NZPRO-178","ex":["PP"],"d":"Core Interactions","q":"Which callback is best for reacting to a mouse click on a UI image using the EventSystem?","o":["Implement IPointerClickHandler.OnPointerClick(PointerEventData e)","OnMouseDown() on the Image","Update with Input.GetMouseButtonDown and a manual rect check","OnTriggerEnter2D"],"w":[null,"OnMouseDown uses colliders and legacy input, not UI graphics.","Fragile and duplicates the EventSystem's work.","That's physics, not pointers."],"a":0,"r":"EventSystem interfaces work for UI and, with a Physics Raycaster on the camera, for 3D objects too.","e":"Other handlers: IPointerEnterHandler, IPointerExitHandler, IBeginDragHandler, IDragHandler, IEndDragHandler, IDropHandler, IScrollHandler, ISelectHandler.","src":"new","g":"eventsystem"},{"id":"NZPRO-179","ex":["PP"],"d":"Application Systems","q":"What does Time.timeScale = 0.5f do?","o":["Slows scaled time to half speed, including deltaTime, FixedUpdate frequency, Animator (Normal mode) and WaitForSeconds","Halves the rendering frame rate only","Halves audio pitch automatically","Affects only Rigidbodies"],"w":[null,"Rendering continues at normal frame rate. Only game time slows.","Audio isn't affected unless you change pitch yourself.","It affects everything that uses scaled time."],"a":0,"r":"It's a global slow-motion multiplier.","e":"For smooth slow-motion physics, also scale Time.fixedDeltaTime = 0.02f * Time.timeScale.","src":"new","g":"lifecycle"},{"id":"NZPRO-180","ex":["PP"],"d":"Application Systems","q":"Which is the safest way to store a player's chosen graphics quality between sessions?","o":["PlayerPrefs.SetInt(\"quality\", level); PlayerPrefs.Save(); and QualitySettings.SetQualityLevel on startup","Write it into a ScriptableObject at runtime in a build","A static variable","Change the Quality settings asset on disk"],"w":[null,"Runtime changes to ScriptableObject assets aren't saved in builds.","Static values are lost when the app closes.","Project assets are read-only in builds."],"a":0,"r":"PlayerPrefs is designed for small preferences like this.","e":"PlayerPrefs is stored per platform (the registry on Windows, plist on macOS and iOS). It's not secure, so never keep currency or anti-cheat data there.","src":"new","g":"fsm"},{"id":"NZPRO-181","ex":["PP"],"d":"Optimization","q":"Which change reduces CPU cost for 1,000 enemies that each run an Update() method?","o":["A single manager that loops over the enemies and calls a custom Tick() method","Adding [ExecuteAlways] to each enemy","Switching Update to OnGUI","Calling GC.Collect in each Update"],"w":[null,"That makes them run in Edit mode too.","OnGUI can run several times per frame, which is worse.","That's terrible for performance."],"a":0,"r":"Each Update is a native-to-managed call. One manager loop removes most of that overhead.","e":"Also stagger heavy work across frames (time slicing), use Jobs/Burst for math-heavy loops, and disable components on off-screen enemies.","src":"new","g":"profiler"},{"id":"NZPRO-182","ex":["PP"],"d":"Optimization","q":"Strings built every frame for a debug overlay cause GC. Which fix avoids allocation?","o":["Reuse a StringBuilder (Clear() each frame) or use TMP_Text.SetText with format arguments","Use string.Format instead of +","Use $\"interpolation\"","Mark the string static"],"w":[null,"string.Format still allocates a new string.","Interpolation also allocates (unless you use a specialized handler).","A static reference doesn't stop new strings being created."],"a":0,"r":"Reusing buffers avoids creating new strings every frame.","e":"Only update UI text when the value changes. Event-driven UI is cheapest.","src":"new","g":"profiler"},{"id":"NZPRO-183","ex":["PP"],"d":"Optimization","q":"In the Profiler, a frame shows \"Gfx.WaitForPresent\" taking most of the time on the main thread. What does it suggest?","o":["The CPU is waiting on the GPU, so you're likely GPU-bound","Scripts are too slow","Garbage collection is the bottleneck","Physics is too slow"],"w":[null,"Script time shows under PlayerLoop / BehaviourUpdate.","GC shows as GC.Collect.","Physics shows as FixedUpdate.PhysicsFixedUpdate."],"a":0,"r":"The main thread is idle waiting for the GPU to finish the previous frame.","e":"Confirm with the GPU module or a platform GPU profiler. Fix with lower resolution or render scale, simpler shaders, less overdraw and fewer post effects. Watch out: VSync can also show as waiting.","src":"new","g":"profiler"},{"id":"NZPRO-184","ex":["PP"],"d":"Teams & Testing","q":"Which assertion inside a Unity Test Framework test checks that damage reduces health?","code":"[Test] public void TakeDamage_ReducesHealth() {\n  var h = new HealthModel(100);\n  h.TakeDamage(30);\n  ???\n}","o":["Assert.AreEqual(70, h.Current);","Debug.Log(h.Current);","Assert.IsNull(h);","yield return null;"],"w":[null,"Logging doesn't verify anything.","That checks the wrong thing.","[Test] methods are void and can't yield. That's for [UnityTest]."],"a":0,"r":"NUnit's AreEqual(expected, actual) checks the result. Expected comes first.","e":"The model class is plain C# (no MonoBehaviour), so it can be tested in EditMode quickly. That's the humble object pattern.","src":"new","g":"scrum"},{"id":"NZPRO-185","ex":["PP"],"d":"Platforms","q":"A mobile game drains battery in the main menu. Which setting helps most?","o":["Lower Application.targetFrameRate in menus (for example 30) and skip unnecessary per-frame work","Increase the physics Fixed Timestep frequency","Turn on Development Build","Set Quality to Ultra"],"w":[null,"More physics steps cost more.","That adds overhead.","That costs more."],"a":0,"r":"Rendering fewer frames saves CPU and GPU power.","e":"Also: OnDemandRendering.renderFrameInterval to render less often while input stays responsive. Pause audio and effects when the app is in the background (OnApplicationPause).","src":"new","g":"pipeline"},{"id":"NZPRO-186","ex":["PP"],"d":"Platforms","q":"Which path is writable and keeps data on iOS, Android, Windows and WebGL (IndexedDB)?","o":["Application.persistentDataPath","Application.dataPath","Application.streamingAssetsPath","Application.temporaryCachePath"],"w":[null,"Read-only or packaged on many platforms.","Read-only. On Android it's inside the APK.","The OS may clear it at any time."],"a":0,"r":"It's the cross-platform location for saves and downloaded content.","e":"On WebGL, call PlayerPrefs.Save or sync after writing, because IndexedDB writes are asynchronous.","src":"new","g":"pipeline"},{"id":"NZPRO-187","ex":["PA"],"d":"Rendering 3D Objects","q":"An environment kit uses one 4K atlas texture for 40 props. What is the main benefit and risk?","o":["Benefit: shared material, so fewer draw calls and better batching. Risk: texel density and mip bleeding at atlas island borders","Benefit: infinite resolution. Risk: none","Benefit: no UVs needed","Benefit: automatic LODs"],"w":[null,"Atlases share fixed resolution.","Atlases depend on careful UVs.","Atlases have nothing to do with LOD."],"a":0,"r":"Atlases trade flexibility and padding for batching.","e":"Use enough padding (8–16 px at 4K), and keep a consistent texel density (for example 512 px/m) across the kit.","src":"new","g":"lod"},{"id":"NZPRO-188","ex":["PA"],"d":"Rendering 3D Objects","q":"What does a \"trim sheet\" let environment artists do?","o":["Reuse one tiling texture of horizontal strips (trims, panels, bolts) across many meshes by UV-mapping faces onto the strips","Bake each mesh's unique lighting","Automatically reduce polycount","Animate textures over time"],"w":[null,"That's lightmaps.","That's decimation or LOD.","That's flipbooks or UV scrolling."],"a":0,"r":"It gives high detail with little texture memory, which suits modular architecture.","e":"Combine with decals (URP Decal Projector, HDRP decals) and vertex color blending for variety without unique textures.","src":"new","g":"lightmodes"},{"id":"NZPRO-189","ex":["PA"],"d":"Rendering 3D Objects","q":"Which feature projects bullet holes or graffiti onto surfaces without editing their materials?","o":["Decal Projector (URP renderer feature / HDRP decals)","Light Cookie","Reflection Probe","Sprite Mask"],"w":[null,"A cookie masks a light.","A probe captures reflections.","A Sprite Mask clips 2D sprites."],"a":0,"r":"Decals project a material onto underlying geometry within a box volume.","e":"In URP, add the Decal renderer feature to the Universal Renderer asset first. Choose the DBuffer or Screen Space technique by platform.","src":"new","g":"probes"},{"id":"NZPRO-190","ex":["PA"],"d":"Lighting","q":"A scene uses HDRP. In which units should the sun (Directional Light) intensity be set for physically based lighting?","o":["Lux (around 100,000 lux for a bright sunny day)","Watts","Decibels","Unitless 0–1 only"],"w":[null,"Watts are electrical power, not a light unit in HDRP.","That's audio.","That's typical of URP or Built-in, not HDRP's physical setup."],"a":0,"r":"HDRP uses physical light units: lux for directional lights, lumen or candela for punctual lights.","e":"Pair it with physically based camera exposure (EV100) via an Exposure override. Otherwise extreme values look blown out or black.","src":"new","g":"pipeline"},{"id":"NZPRO-191","ex":["PA"],"d":"Lighting","q":"Indoor baked lighting looks too dark compared with the outdoor area seen through a window. Which tool adjusts camera brightness automatically when moving between them?","o":["Auto Exposure / Exposure override (Automatic mode) in the post-processing Volume","Increasing the Light Probe count","Disabling shadows","Fog density"],"w":[null,"More probes don't adjust overall brightness adaptation.","That's unrelated to exposure.","Fog is atmospheric."],"a":0,"r":"Exposure adapts to scene luminance like an eye or camera.","e":"HDRP Exposure: Fixed, Automatic, Curve Mapping, Physical Camera. In URP, adjust Post Exposure in Color Adjustments for manual control.","src":"new","g":"probes"},{"id":"NZPRO-192","ex":["PA"],"d":"Particles & Effects","q":"A fire flipbook texture has 4×4 frames. Which module plays it on particles?","o":["Texture Sheet Animation with Tiles X = 4, Y = 4","Shape module with Mesh","Trails module","External Forces"],"w":[null,"Shape sets where particles spawn.","That draws ribbons.","That handles wind and force fields."],"a":0,"r":"The module steps through grid frames over particle lifetime.","e":"Turn on random start frame to break repetition. Motion vectors or flipbook blending give smoother interpolation.","src":"new","g":"particles"},{"id":"NZPRO-193","ex":["PA"],"d":"Animation","q":"A cutscene needs a camera to smoothly track a character and cut between shots synced with dialogue audio. Which combination is best?","o":["Timeline with Cinemachine Cameras (on a Cinemachine track) and an Audio track","Animator Controller with camera states","Several Main Cameras toggled by scripts each frame","The Particle System"],"w":[null,"Awkward for linear cutscenes.","Fragile, and blends are hard.","Not a sequencing tool."],"a":0,"r":"Timeline sequences shots and audio, and Cinemachine handles framing and blends.","e":"Use Signal tracks to trigger gameplay events, and Activation tracks to show and hide props.","src":"new","g":"animator"},{"id":"NZPRO-194","ex":["PA"],"d":"2D Assets","q":"Pixel art looks uneven (some pixels wider than others) when the camera moves. What fixes it?","o":["The Pixel Perfect Camera component, with Assets PPU matching the sprites and the reference resolution set","Increase texture Max Size","Turn on mipmaps","Use Bilinear filtering"],"w":[null,"That doesn't change scaling artifacts.","That blurs pixels.","That blurs edges."],"a":0,"r":"It snaps rendering to whole pixels at integer scales.","e":"Upscale Render Texture and Crop Frame options trade crispness against screen coverage.","src":"new","g":"tilemap"},{"id":"NZPRO-195","ex":["AA"],"d":"Asset Management","q":"An imported animated character's run clip should loop and keep the character in place (script-driven movement). Which import settings fit?","o":["Loop Time on, and Bake Into Pose for Root Transform Position (XZ) so the root stays in place","Loop Time off and Mirror on","Animation Type = None","Read/Write on the mesh"],"w":[null,"That gives no loop and a flipped clip.","Then there's no rig.","Unrelated to animation."],"a":0,"r":"Baking keeps the root motion in the pose instead of moving the GameObject.","e":"For root-motion characters, leave root position un-baked and turn on Apply Root Motion on the Animator.","src":"new","g":"lightmodes"},{"id":"NZPRO-196","ex":["AA"],"d":"Asset Management","q":"Which feature lets you install a specific version of Cinemachine or ProBuilder for a project?","o":["Package Manager (Window > Package Manager, Unity Registry)","Asset Store website only","Preferences > External Tools","Build Profiles"],"w":[null,"The store has assets, but registry packages are installed through the Package Manager.","That's for IDE and SDK paths.","That's for platform builds."],"a":0,"r":"It installs, updates and removes packages per project, recorded in Packages/manifest.json.","e":"Packages can also be added by git URL or from disk. Lock versions for team consistency.","src":"new","g":"assets"},{"id":"NZPRO-197","ex":["AA"],"d":"Lighting, Cameras & Effects","q":"Which camera projection is usually used for a 2D side-scroller or an isometric strategy view?","o":["Orthographic","Perspective with FOV 179","Physical Camera only","Stereo"],"w":[null,"That's extreme distortion.","That's for real-world lens simulation.","That's for VR."],"a":0,"r":"Orthographic has no perspective foreshortening. Size sets the half-height of the view in world units.","e":"Perspective 2.5D with a parallax background is an alternative look. In URP 2D, use the Pixel Perfect Camera for pixel art.","src":"new","g":"camera"},{"id":"NZPRO-198","ex":["AA"],"d":"Lighting, Cameras & Effects","q":"Which post-processing effect simulates a camera lens focusing on a subject, blurring the foreground and background?","o":["Depth of Field","Motion Blur","Lens Distortion","Panini Projection"],"w":[null,"That blurs by movement.","That warps the image.","That corrects wide-FOV stretching."],"a":0,"r":"DoF blurs by distance from the focus plane (Gaussian or Bokeh modes in URP).","e":"Use DoF in cutscenes and photo modes. It's costly on mobile.","src":"new","g":"camera"},{"id":"NZPRO-199","ex":["AA"],"d":"Scene Content Design","q":"Which component turns a ProBuilder mesh or model into a walkable floor that blocks the player?","o":["A Mesh Collider (or simpler Box Colliders) on the geometry","A Mesh Renderer only","A Light Probe Group","An Audio Reverb Zone"],"w":[null,"That draws, but nothing collides.","That's lighting data.","That's audio."],"a":0,"r":"Rendering and collision are separate. Geometry needs a collider to block.","e":"ProBuilder can generate colliders automatically. For complex art, use a simplified collision mesh (UCX_ or a custom low-poly mesh).","src":"new","g":"probes"},{"id":"NZPRO-200","ex":["AA"],"d":"Scene Content Design","q":"Your terrain looks tiled and repetitive from a distance. Which approach helps?","o":["Blend several Terrain Layers with masks, add detail meshes and props, and use distance-based variation","Increase the terrain heightmap resolution only","Use one huge 16K texture","Turn off all terrain textures"],"w":[null,"That gives better shape, but the same texture tiling.","Memory explodes.","That looks worse."],"a":0,"r":"Mixing textures and objects breaks up the obvious tiling.","e":"Tiling scale per layer, detail normal maps and macro variation textures (in custom terrain shaders) are common professional tricks.","src":"new","g":"tilemap"}];

</script>
<script>
(function(){
'use strict';
const QB=window.QB, EX=window.EXAMS, DG=window.DIAG, LK=window.LINKS;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const L='ABCDEFGH';
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- storage (per-browser convenience) ---------- */
const KEY='ucp-lab-v1';
let P={q:{},custom:[],last:'GD'};
try{const s=localStorage.getItem(KEY);if(s)P=Object.assign(P,JSON.parse(s));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}};
const rec=id=>P.q[id]||(P.q[id]={s:0,c:0,w:0,b:0});
function mark(id,ok){const r=rec(id);r.s++;if(ok){r.c++;r.b=Math.min(5,r.b+1);}else{r.w++;r.b=0;}r.t=Date.now();save();}

let BANK=QB.concat(P.custom||[]);
const forExam=code=>BANK.filter(q=>q.ex.includes(code));
const domainsOf=list=>[...new Set(list.map(q=>q.d))].sort();
function stats(list){let seen=0,mast=0,wrong=0;list.forEach(q=>{const r=P.q[q.id];if(r&&r.s){seen++;if(r.b>=2)mast++;if(r.b===0&&r.w)wrong++;}});return{n:list.length,seen,mast,wrong};}

/* ---------- state ---------- */
const S={exam:P.last||'GD',tab:'practice',run:null,mock:null,dom:new Set(),search:''};
const app=$('#app');

function go(view,opts={}){Object.assign(S,opts);S.view=view;render();window.scrollTo({top:0});}

/* ---------- views ---------- */
function render(){
  if(S.view==='exam')return renderExam();
  if(S.view==='guide')return renderGuide();
  renderHome();
}

function renderHome(){
  const total=BANK.length;
  const cards=Object.entries(EX).map(([k,e])=>{const st=stats(forExam(k));const pct=st.n?Math.round(st.mast/st.n*100):0;
    return `<article class="exam-card" data-k="${k}">
      <div class="ec-top"><span class="lvl lvl-${e.level.toLowerCase()}">${e.level}</span><span class="ec-count">${st.n} questions</span></div>
      <h3>${esc(e.name)}</h3><p>${esc(e.blurb)}</p>
      <div class="meter" aria-label="Mastered ${pct}%"><i style="width:${pct}%"></i></div>
      <div class="ec-meta"><span>${st.mast} mastered</span><span>${st.seen} seen</span><span>${st.wrong} to review</span></div>
      <div class="ec-actions"><button class="btn primary" data-act="practice" data-k="${k}">Practice</button><button class="btn" data-act="mock" data-k="${k}">Mock exam</button><button class="btn ghost" data-act="notes" data-k="${k}">Study notes</button></div>
    </article>`;}).join('');
  app.innerHTML=`
  <header class="hero">
    <div class="hero-txt">
      <p class="eyebrow">Unity certification prep · Unity 6 objectives</p>
      <h1>Cert Prep <span>Lab</span></h1>
      <p class="lede">${total} exam-style questions across four Unity certifications. Every answer, right or wrong, is explained, with a diagram and links to videos and the Unity docs. Run timed mock exams and drill your weak spots until they stick.</p>
      <div class="hero-stats">
        <div><b>${total}</b><span>questions</span></div><div><b>${Object.keys(DG).length}</b><span>diagrams</span></div><div><b>4</b><span>exam tracks</span></div><div><b>${stats(BANK).mast}</b><span>you’ve mastered</span></div>
      </div>
    </div>
    ${heroInspector()}
  </header>
  <section><div class="sec-head"><h2>Choose your exam</h2><button class="btn ghost" data-act="guide">How this site is built →</button></div><div class="exam-grid">${cards}</div></section>
  <section class="method">
    <h2>A method that works</h2>
    <ol class="steps">
      <li><b>Read the study notes</b> for one domain (10 min).</li>
      <li><b>Practice that domain</b> in Practice mode. Read every explanation, including for the options you didn’t pick.</li>
      <li><b>Review your weak spots</b> the next day. A question counts as mastered after 2 correct answers in a row.</li>
      <li><b>Take a full timed mock</b> each week. Aim for 80% or more before booking the real exam.</li>
      <li><b>Build it in Unity.</b> Recreate any concept you missed in a test scene. Doing beats re-reading.</li>
    </ol>
  </section>
  <footer class="foot">Progress is saved in this browser only. Independent study aid, not affiliated with or endorsed by Unity Technologies. Check the official exam objectives for the current format.</footer>`;
}

function heroInspector(){
  return `<div class="inspector" aria-hidden="true">
    <div class="ins-h">Inspector <span>Mock Exam</span></div>
    <div class="ins-row"><span>Exam</span><b>Associate: Game Developer</b></div>
    <div class="ins-row"><span>Questions</span><b class="mono">100</b></div>
    <div class="ins-row"><span>Time Limit</span><b class="mono">90:00</b></div>
    <div class="ins-row"><span>Target Score</span><b class="mono">≥ 80%</b></div>
    <div class="ins-sub">▾ Animator Transition</div>
    <div class="ins-row"><span>Has Exit Time</span><i class="chk"></i></div>
    <div class="ins-row"><span>Transition Duration</span><b class="mono">0.25</b></div>
    <div class="ins-row"><span>Conditions</span><b class="mono">Jump (Trigger)</b></div>
  </div>`;
}

const TABS=[['practice','Practice'],['mock','Mock exam'],['review','Weak spots'],['notes','Study notes'],['bank','Question bank']];
function renderExam(){
  const e=EX[S.exam];P.last=S.exam;save();
  const st=stats(forExam(S.exam));
  app.innerHTML=`
  <nav class="crumbs"><button class="link" data-act="home">← All exams</button><span>/</span><span>${esc(e.full)}</span></nav>
  <header class="ex-head">
    <div><h1 class="ex-title">${esc(e.name)}</h1><p class="ex-sub">${st.n} questions · ${st.mast} mastered · ${st.wrong} to review · <a href="${e.url}" target="_blank" rel="noopener">Official exam page ↗</a></p></div>
    <div class="ex-switch">${Object.keys(EX).map(k=>`<button class="chip ${k===S.exam?'on':''}" data-act="exam" data-k="${k}">${esc(EX[k].name.replace('Associate: ','A · ').replace('Professional: ','P · '))}</button>`).join('')}</div>
  </header>
  <div class="tabs" role="tablist">${TABS.map(([k,l])=>`<button role="tab" aria-selected="${S.tab===k}" class="tab ${S.tab===k?'on':''}" data-tab="${k}">${l}${k==='review'&&st.wrong?` <em>${st.wrong}</em>`:''}</button>`).join('')}</div>
  <div id="pane"></div>`;
  ({practice:paneSetup,mock:paneMock,review:paneReview,notes:paneNotes,bank:paneBank})[S.tab]();
}

/* ---------- practice ---------- */
function paneSetup(){
  const pane=$('#pane');
  if(S.run&&S.run.exam===S.exam&&S.run.kind!=='mock')return paneRun();
  const list=forExam(S.exam), doms=domainsOf(list);
  pane.innerHTML=`<div class="setup">
    <div class="setup-col">
      <h2>Pick domains</h2><p class="muted">Leave all unselected to practice everything.</p>
      <div class="chips">${doms.map(d=>{const n=list.filter(q=>q.d===d).length;const m=stats(list.filter(q=>q.d===d));return `<button class="chip dchip ${S.dom.has(d)?'on':''}" data-dom="${esc(d)}">${esc(d)} <small>${m.mast}/${n}</small></button>`;}).join('')}</div>
    </div>
    <div class="setup-col side">
      <h2>Session</h2>
      <label class="field"><span>Questions</span><select id="pCount"><option>10</option><option selected>20</option><option>40</option><option value="9999">All matching</option></select></label>
      <label class="field"><span>Order</span><select id="pOrder"><option value="smart" selected>Smart (unseen & weak first)</option><option value="rand">Random</option><option value="seq">In order</option></select></label>
      <label class="check"><input type="checkbox" id="pUnseen"> Only questions I haven’t seen</label>
      <button class="btn primary big" data-act="startP">Start practice</button>
      <p class="muted small">Keys: <kbd>1</kbd>–<kbd>4</kbd> to answer, <kbd>Enter</kbd> for the next question.</p>
    </div></div>`;
}
function pickPool(){
  let list=forExam(S.exam);if(S.dom.size)list=list.filter(q=>S.dom.has(q.d));return list;
}
function startPractice(list,kind='practice'){
  if(!list.length){toast('No questions match. Choose other domains.');return;}
  S.run={exam:S.exam,kind,items:list.map(q=>({q,ord:q.o.length===2&&q.o[0]==='True'?[0,1]:shuffle(q.o.map((_,i)=>i)),pick:null})),i:0,score:0};
  S.tab=kind==='review'?'review':'practice';render();
}
function paneRun(){
  const R=S.run, pane=$('#pane');
  if(R.i>=R.items.length){
    const n=R.items.length, pct=Math.round(R.score/n*100);
    pane.innerHTML=`<div class="done"><p class="eyebrow">Session complete</p><div class="big-score ${pct>=80?'ok':pct>=60?'mid':'bad'}">${pct}%</div><p>${R.score} of ${n} correct.</p>
      <div class="row"><button class="btn primary" data-act="again">New session</button><button class="btn" data-tab="review">Review weak spots</button></div>
      <div class="sum-list">${R.items.map((it,k)=>`<div class="sum ${it.pick===it.q.a?'ok':'bad'}"><span>${it.pick===it.q.a?'✓':'✗'}</span>${fmt(it.q.q)}</div>`).join('')}</div></div>`;
    S.run=null;return;
  }
  const it=R.items[R.i];
  pane.innerHTML=`<div class="runbar"><span>Question ${R.i+1} of ${R.items.length}</span><div class="meter thin"><i style="width:${R.i/R.items.length*100}%"></i></div><span class="mono">${R.score} ✓</span><button class="link" data-act="quit">End</button></div>
  ${qCard(it,it.pick!==null)}`;
}
function qCard(it,answered,mockMode,noNext){
  const q=it.q;
  const opts=it.ord.map((oi,k)=>{let cls='opt';
    if(answered&&!mockMode){if(oi===q.a)cls+=' right';else if(oi===it.pick)cls+=' wrong';else cls+=' dim';}
    else if(it.pick===oi)cls+=' sel';
    return `<button class="${cls}" data-opt="${oi}" ${answered&&!mockMode?'disabled':''}><span class="key">${L[k]}</span><span class="otxt">${fmt(q.o[oi])}</span></button>`;}).join('');
  return `<article class="qcard">
    <div class="qmeta"><span class="tag">${esc(q.d)}</span><span class="tag ghost">${q.src==='doc'?'From your study docs':q.src==='custom'?'Your question':'New question'}</span>${q.o.length===2&&q.o[0]==='True'?'<span class="tag ghost">True / False</span>':''}</div>
    <h2 class="qtext">${fmt(q.q)}</h2>
    ${q.code?`<pre class="code"><code>${esc(q.code)}</code></pre>`:''}
    <div class="opts">${opts}</div>
    ${answered&&!mockMode?explain(it,!noNext):''}
  </article>`;
}
function explain(it,showNext){
  const q=it.q, ok=it.pick===q.a, g=q.g&&DG[q.g], lk=q.g&&LK[q.g];
  const term=lk?lk[0]:'Unity '+q.d;
  const rows=it.ord.map((oi,k)=>{const right=oi===q.a;const why=right?(q.r||q.e):q.w[oi];
    return `<li class="${right?'r':'w'} ${oi===it.pick?'you':''}"><span class="mk">${right?'✓':'✗'}</span><div><b>${L[k]}. ${fmt(q.o[oi])}</b>${oi===it.pick?' <em class="youtag">your answer</em>':''}<p>${fmt(why)}</p></div></li>`;}).join('');
  return `<section class="explain ${ok?'good':'bad'}" aria-live="polite">
    <div class="verdict">${ok?'Correct.':'Not quite.'} <span>The answer is ${L[it.ord.indexOf(q.a)]}: ${fmt(q.o[q.a])}</span></div>
    <h3>Why each option is right or wrong</h3><ul class="why">${rows}</ul>
    ${q.r&&q.e&&q.e!==q.r?`<h3>Deep dive</h3><p class="deep">${fmt(q.e)}</p>`:''}
    ${g?`<figure class="diag"><figcaption><b>${esc(g.t)}</b></figcaption><div class="svgwrap">${g.s}</div><p>${esc(g.c)}</p></figure>`:''}
    <div class="learn">
      <a class="lbtn vid" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(term+' tutorial')}">▶ Watch video tutorials</a>
      <a class="lbtn" target="_blank" rel="noopener" href="https://learn.unity.com/search?k=${encodeURIComponent(term.replace(/^Unity /,''))}">Unity Learn courses</a>
      ${lk&&lk[1]?`<a class="lbtn" target="_blank" rel="noopener" href="${lk[1]}">Read the docs</a>`:''}
    </div>
    ${showNext&&S.run?`<div class="nextrow"><button class="btn primary" data-act="next">${S.run.i+1<S.run.items.length?'Next question →':'See results →'}</button></div>`:''}
  </section>`;
}

/* ---------- mock ---------- */
function paneMock(){
  const pane=$('#pane'), e=EX[S.exam], list=forExam(S.exam);
  const M=S.mock;
  if(M&&M.exam===S.exam){return M.done?mockResults():mockRun();}
  const doms=domainsOf(list);
  pane.innerHTML=`<div class="setup"><div class="setup-col">
    <h2>Timed mock exam</h2>
    <p>Answers are revealed only when you submit, like the real test. The questions are drawn across every domain in proportion to the bank. Flag uncertain questions and come back to them before time runs out.</p>
    <ul class="facts"><li><b>${list.length}</b> questions in this track's bank</li><li><b>${doms.length}</b> domains covered</li><li>Target: <b>${e.pass}%</b> to pass this practice exam. Aim for 80% or more before booking the real one.</li></ul>
    <p class="muted small">Official question count, time limit and passing score can change. Confirm them on the <a href="${e.url}" target="_blank" rel="noopener">official exam page</a>.</p>
  </div><div class="setup-col side">
    <label class="field"><span>Questions</span><select id="mCount">${[20,40,60,80,100].filter(n=>n<=list.length).map(n=>`<option ${n===Math.min(e.mockN,list.length)?'selected':''}>${n}</option>`).join('')}</select></label>
    <label class="field"><span>Minutes</span><select id="mMin">${[20,30,45,60,75,90,105].map(n=>`<option ${n===e.mockMin?'selected':''}>${n}</option>`).join('')}</select></label>
    <button class="btn primary big" data-act="startM">Start mock exam</button></div></div>`;
}
function startMock(){
  const n=+$('#mCount').value, min=+$('#mMin').value, list=forExam(S.exam);
  const byD={};list.forEach(q=>(byD[q.d]=byD[q.d]||[]).push(q));
  let pick=[];Object.values(byD).forEach(a=>{pick=pick.concat(shuffle(a).slice(0,Math.max(1,Math.round(a.length/list.length*n))));});
  pick=shuffle(pick).slice(0,n);if(pick.length<n)pick=pick.concat(shuffle(list.filter(q=>!pick.includes(q))).slice(0,n-pick.length));
  S.mock={exam:S.exam,items:pick.map(q=>({q,ord:q.o[0]==='True'&&q.o.length===2?[0,1]:shuffle(q.o.map((_,i)=>i)),pick:null,flag:false})),i:0,end:Date.now()+min*60000,min,done:false};
  render();
}
let timerH=null;
function mockRun(){
  const M=S.mock, pane=$('#pane'), it=M.items[M.i];
  const answered=M.items.filter(x=>x.pick!==null).length;
  pane.innerHTML=`<div class="mock">
    <div class="mock-main">
      <div class="runbar"><span>Question ${M.i+1} of ${M.items.length}</span><span class="timer mono" id="timer">--:--</span><button class="btn small ${it.flag?'flagged':''}" data-act="flag">${it.flag?'⚑ Flagged':'⚐ Flag'}</button></div>
      ${qCard(it,false,true)}
      <div class="mock-nav"><button class="btn" data-act="mprev" ${M.i?'':'disabled'}>← Previous</button><button class="btn primary" data-act="mnext">${M.i+1<M.items.length?'Next →':'Review & submit'}</button></div>
    </div>
    <aside class="mock-side"><h3>Navigator</h3><p class="muted small">${answered}/${M.items.length} answered · ${M.items.filter(x=>x.flag).length} flagged</p>
      <div class="grid">${M.items.map((x,k)=>`<button class="cell ${k===M.i?'cur':''} ${x.pick!==null?'ans':''} ${x.flag?'fl':''}" data-jump="${k}" aria-label="Question ${k+1}">${k+1}</button>`).join('')}</div>
      <button class="btn danger" data-act="submit">Submit exam</button>
      <div id="confirm" hidden class="confirm"><p>${M.items.length-answered} unanswered. Submit anyway?</p><div class="row"><button class="btn danger small" data-act="submitYes">Submit</button><button class="btn small" data-act="submitNo">Keep going</button></div></div>
    </aside></div>`;
  tick();
}
function tick(){clearInterval(timerH);const f=()=>{const M=S.mock;if(!M||M.done){clearInterval(timerH);return;}const ms=M.end-Date.now();const el=$('#timer');
  if(ms<=0){clearInterval(timerH);finishMock();return;}
  if(el){const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);el.textContent=`${m}:${String(s).padStart(2,'0')}`;el.classList.toggle('low',ms<5*60000);}};f();timerH=setInterval(f,1000);}
function finishMock(){const M=S.mock;M.done=true;clearInterval(timerH);M.items.forEach(it=>{if(it.pick!==null)mark(it.q.id,it.pick===it.q.a);});M.used=Math.round((M.min*60000-(M.end-Date.now()))/60000);render();}
function mockResults(){
  const M=S.mock, e=EX[M.exam], n=M.items.length, c=M.items.filter(x=>x.pick===x.q.a).length, pct=Math.round(c/n*100);
  const byD={};M.items.forEach(x=>{const d=byD[x.q.d]=byD[x.q.d]||{n:0,c:0};d.n++;if(x.pick===x.q.a)d.c++;});
  const drows=Object.entries(byD).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).map(([d,v])=>{const p=Math.round(v.c/v.n*100);return `<div class="drow"><span>${esc(d)}</span><div class="meter"><i class="${p>=80?'ok':p>=60?'mid':'bad'}" style="width:${p}%"></i></div><b class="mono">${v.c}/${v.n}</b></div>`;}).join('');
  S.mockFilter=S.mockFilter||'wrong';
  const shown=M.items.filter(x=>S.mockFilter==='all'||(S.mockFilter==='wrong'?x.pick!==x.q.a:x.flag));
  $('#pane').innerHTML=`<div class="results">
    <div class="res-top"><div class="big-score ${pct>=e.pass?'ok':'bad'}">${pct}%</div><div><h2>${pct>=e.pass?'Pass':'Not yet'}: ${c} of ${n} correct</h2><p class="muted">Practice pass mark ${e.pass}% · time used ${Math.max(0,M.used||0)} of ${M.min} min</p>
      <div class="row"><button class="btn primary" data-act="newMock">New mock exam</button><button class="btn" data-tab="review">Drill weak spots</button></div></div></div>
    <h3>Score by domain (weakest first)</h3><div class="drows">${drows}</div>
    <div class="sec-head"><h3>Review answers</h3><div class="chips">${[['wrong','Incorrect'],['flag','Flagged'],['all','All']].map(([k,l])=>`<button class="chip ${S.mockFilter===k?'on':''}" data-mf="${k}">${l}</button>`).join('')}</div></div>
    ${shown.length?shown.map(x=>qCard(x,true,false,true)).join(''):'<p class="muted">Nothing to show here.</p>'}
  </div>`;
}

/* ---------- review ---------- */
function paneReview(){
  if(S.run&&S.run.kind==='review'&&S.run.exam===S.exam)return paneRun();
  const list=forExam(S.exam).filter(q=>{const r=P.q[q.id];return r&&r.w&&r.b<2;}).sort((a,b)=>P.q[a.id].b-P.q[b.id].b||P.q[b.id].w-P.q[a.id].w);
  $('#pane').innerHTML=list.length?`<div class="setup"><div class="setup-col"><h2>${list.length} weak spots</h2><p>These are questions you missed that you haven’t yet answered correctly twice in a row. Clear them every day.</p>
    <div class="sum-list">${list.slice(0,40).map(q=>`<div class="sum bad"><span>${P.q[q.id].w}×</span>${fmt(q.q)}</div>`).join('')}</div></div>
    <div class="setup-col side"><button class="btn primary big" data-act="startR">Drill weak spots</button><p class="muted small">Get one right twice and it moves to mastered.</p></div></div>`
  :`<div class="empty"><h2>No weak spots yet</h2><p>Questions you get wrong in Practice or a Mock exam land here so you can drill them until they stick.</p><button class="btn primary" data-tab="practice">Start practicing</button></div>`;
}

/* ---------- notes ---------- */
function paneNotes(){
  const e=EX[S.exam];
  $('#pane').innerHTML=`<div class="notes">
    <p class="lede">${esc(e.blurb)}</p>
    <div class="note-grid">${e.notes.map(([h,b])=>`<section class="note"><h3>${esc(h)}</h3><ul>${b.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul><button class="link" data-act="pdom" data-d="${esc(h)}">Practice related questions →</button></section>`).join('')}</div>
    <section class="note wide"><h3>Four-week plan</h3><ol class="plan">
      <li><b>Week 1:</b> Read every domain's notes. Practice 20 questions a day in your weakest two domains.</li>
      <li><b>Week 2:</b> Practice everything with Smart order. Recreate every missed concept in a test scene.</li>
      <li><b>Week 3:</b> One full timed mock. Drill weak spots daily. Rewatch videos for domains below 70%.</li>
      <li><b>Week 4:</b> Two more mocks. Book the exam when you score 80% or more twice in a row.</li></ol></section>
    <section class="note wide"><h3>Exam-day strategy</h3><ul>
      <li>Read the last line of the question first. Scenario questions hide the real ask at the end.</li>
      <li>Eliminate options that name the wrong system: Animator vs Animation window, Tag vs Layer, Mixer vs Listener.</li>
      <li>Watch for absolute words ("always", "only", "must") in True/False questions. They're usually false.</li>
      <li>Flag and move on after 60 seconds. Come back with fresh eyes.</li>
      <li>Never leave a question blank. Unanswered questions score zero.</li></ul></section>
  </div>`;
}

/* ---------- bank ---------- */
function paneBank(){
  const list=forExam(S.exam);
  $('#pane').innerHTML=`<div class="bank"><input id="bSearch" class="search" type="search" placeholder="Search ${list.length} questions: try “Rigidbody”, “Blend Tree”, “URP”…" value="${esc(S.search)}"><div id="bList"></div></div>`;
  bankList();
}
function bankList(){
  const term=S.search.toLowerCase(), list=forExam(S.exam).filter(q=>!term||(q.q+' '+q.o.join(' ')+' '+q.d+' '+q.e).toLowerCase().includes(term));
  $('#bList').innerHTML=`<p class="muted small">${list.length} shown</p>`+list.slice(0,120).map(q=>{const r=P.q[q.id];return `<details class="bq"><summary><span class="tag">${esc(q.d)}</span> ${fmt(q.q)} ${r&&r.b>=2?'<em class="mast">mastered</em>':''}</summary>
    ${q.code?`<pre class="code"><code>${esc(q.code)}</code></pre>`:''}<ul class="why">${q.o.map((o,i)=>`<li class="${i===q.a?'r':'w'}"><span class="mk">${i===q.a?'✓':'✗'}</span><div><b>${fmt(o)}</b><p>${fmt(i===q.a?(q.r||q.e):q.w[i])}</p></div></li>`).join('')}</ul>${q.r&&q.e!==q.r?`<p class="deep">${fmt(q.e)}</p>`:''}</details>`;}).join('')+(list.length>120?'<p class="muted">Refine your search to see more.</p>':'');
}

/* ---------- build guide ---------- */
function renderGuide(){
  app.innerHTML=`<nav class="crumbs"><button class="link" data-act="home">← All exams</button><span>/</span><span>How this site is built</span></nav>
  <article class="guide">
  <h1 class="ex-title">How this site is built, and how to grow it</h1>
  <p class="lede">The site is a single HTML file with no server and no build tools to run. Questions live in a data list, the app draws every screen from that list, and your progress is stored in your browser. These are the steps to rebuild it or extend it.</p>
  <ol class="gsteps">
   <li><h3>Collect and map the exam objectives</h3><p>Download each exam's objectives PDF from its official page. Turn every objective into a <b>domain</b> name (for example “Lighting, Cameras & Effects”). Each question is tagged with one domain and one or more exam codes (<code>GD</code>, <code>AA</code>, <code>PP</code>, <code>PA</code>), so shared topics are written once and appear in several tracks.</p></li>
   <li><h3>Write questions in a simple text format</h3><p>Each question is a small block. <code>+</code> marks the correct option and <code>-</code> the distractors. Text after <code>::</code> is that option's explanation. <code>C:</code> lines are code, <code>E:</code> is the deep dive.</p>
<pre class="code"><code>@GD,AA|Audio
Q: Sounds play but you hear nothing. What do you check first?
+ An active Audio Listener exists :: Without a listener nothing is heard.
- Spatial Blend is 3D :: 2D sounds are audible everywhere.
- An Audio Mixer exists :: Mixers are optional.
E: Also check the Game view Mute Audio toggle and the source's Max Distance.</code></pre>
   <p>Rules for good questions: one clear answer; distractors that are real Unity terms a learner might confuse; scenario wording (“Your UI looks tiny on 4K…”); and an explanation for every option, not just the right one.</p></li>
   <li><h3>Convert the text to data</h3><p>A short Python script reads the files, checks that every question has an answer and an explanation for each option, and writes one data file: <code>window.QB = [{id, ex, d, q, o, a, w, r, e, g}]</code>, where <code>o</code> is the options, <code>a</code> the index of the correct one, <code>w</code> the explanation for each option, and <code>g</code> the diagram key. Your three Word documents were imported the same way, with <code>pandoc</code> converting them to text and a parser reading the ✓ markers.</p></li>
   <li><h3>Attach diagrams and videos automatically</h3><p>Keyword rules (for example “Blend Tree” → blend tree diagram, “Spatial Blend” → rolloff chart) give each question a diagram key, with a per-domain fallback. Diagrams are inline SVG drawn with the page's color tokens, so they work in light and dark themes and need no image hosting. Video and course buttons open YouTube and Unity Learn searches for the topic, so they never go stale, and doc buttons link to the matching Unity Manual page.</p></li>
   <li><h3>Build the app screens</h3><p>Plain JavaScript renders five tabs per exam: <b>Practice</b> (instant feedback), <b>Mock exam</b> (timer, flags, navigator, score by domain), <b>Weak spots</b> (spaced review), <b>Study notes</b> and a searchable <b>Question bank</b>. Options are shuffled each time, so you learn the concept rather than the letter.</p></li>
   <li><h3>Track mastery</h3><p>Each question keeps a small Leitner “box” counter: a correct answer moves it up, a wrong one resets it to 0. Two in a row means mastered, and anything missed shows up in Weak spots. Smart order serves unseen and weak questions first.</p></li>
   <li><h3>Design for focus</h3><p>The look borrows from the Unity Inspector: labeled property rows, a cool neutral palette, monospace numbers, a light and dark theme, and keyboard shortcuts (1–4, Enter). Layouts stack to one column on phones.</p></li>
   <li><h3>Publish and share</h3><p>The finished single file is published as a private web page with its own link. You can share it with students, or host the same file on GitHub Pages, Netlify or your school's LMS.</p></li>
   <li><h3>Keep it growing</h3><p>Add questions in the same format below and they join your bank on this device right away. To make them permanent for everyone, send them to Claude to merge into the main data file and republish.</p></li>
  </ol>
  <section class="note wide"><h3>Add your own questions</h3><p class="muted small">Paste one or more blocks in the format above (start each group with an <code>@EXAMS|Domain</code> line). They're saved in this browser.</p>
   <textarea id="imp" rows="9" spellcheck="false">@GD|Programming
Q: Which method is called once when a script instance is destroyed?
+ OnDestroy() :: Called when the object is destroyed or the scene unloads.
- OnDisable() :: Called when disabled, which can happen many times.
- Awake() :: Called on load, not destruction.
- Reset() :: An Editor-only call when a component is added or reset.
E: Pair subscriptions: Awake↔OnDestroy, OnEnable↔OnDisable.</textarea>
   <div class="row"><button class="btn primary" data-act="import">Add to my bank</button><button class="btn ghost" data-act="clearCustom">Remove my added questions (${(P.custom||[]).length})</button><span id="impMsg" class="muted small"></span></div></section>
  <section class="note wide"><h3>Reset</h3><p class="muted small">Clear all saved progress on this device.</p><div class="row"><button class="btn danger" data-act="reset">Reset progress</button><span id="resetC" hidden class="row"><span>This can't be undone.</span><button class="btn danger small" data-act="resetYes">Yes, reset</button></span></div></section>
  </article>`;
}
function parseDSL(txt){
  const out=[];let ex=null,dom=null,q=null;const push=()=>{if(q&&q.a!=null&&q.o.length>1){if(!q.e)q.e=q.r||'';if(!q.code)delete q.code;out.push(q);}q=null;};
  txt.split(/\r?\n/).forEach(l=>{const t=l.trim();if(!t)return;
    if(t[0]==='@'){push();const [a,b]=t.slice(1).split('|');ex=a.split(',').map(s=>s.trim().toUpperCase()).filter(k=>EX[k]);dom=(b||'Custom').trim();return;}
    if(t.startsWith('Q:')){push();q={id:'U'+Date.now().toString(36)+out.length,ex:ex&&ex.length?ex:[S.exam],d:dom||'Custom',q:t.slice(2).trim(),o:[],w:[],a:null,r:'',e:'',code:'',src:'custom',g:null};return;}
    if(!q)return;
    if(t.startsWith('C:')){q.code+=(q.code?'\n':'')+l.replace(/^\s*C: ?/,'');return;}
    if(t.startsWith('E:')){q.e=t.slice(2).trim();return;}
    if(t[0]==='+'||t[0]==='-'){const [o,w]=t.slice(1).trim().split(' :: ');if(t[0]==='+'){q.a=q.o.length;q.r=w||'';q.w.push(null);}else q.w.push(w||'');q.o.push(o.trim());}
  });push();return out;}

/* ---------- toast ---------- */
function toast(m){let t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2600);}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button,[data-tab]');if(!b)return;
  const d=b.dataset;
  if(d.tab){S.tab=d.tab;if(S.run&&((d.tab==='practice'&&S.run.kind==='review')||(d.tab==='review'&&S.run.kind!=='review')))S.run=null;render();return;}
  if(d.dom){S.dom.has(d.dom)?S.dom.delete(d.dom):S.dom.add(d.dom);b.classList.toggle('on');return;}
  if(d.opt!==undefined){
    const oi=+d.opt;
    if(S.tab==='mock'&&S.mock&&!S.mock.done){S.mock.items[S.mock.i].pick=oi;mockRun();return;}
    const R=S.run;if(!R)return;const it=R.items[R.i];if(it.pick!==null)return;it.pick=oi;const ok=oi===it.q.a;if(ok)R.score++;mark(it.q.id,ok);paneRun();
    const ex=$('.explain');if(ex)ex.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return;}
  if(d.jump!==undefined){S.mock.i=+d.jump;mockRun();return;}
  if(d.mf){S.mockFilter=d.mf;mockResults();return;}
  const act=d.act;if(!act)return;
  const A={
    home:()=>go('home'),guide:()=>go('guide'),
    practice:()=>go('exam',{exam:d.k,tab:'practice',dom:new Set()}),mock:()=>go('exam',{exam:d.k,tab:'mock'}),notes:()=>go('exam',{exam:d.k,tab:'notes'}),
    exam:()=>{S.exam=d.k;S.dom=new Set();S.run=null;render();},
    startP:()=>{let list=pickPool();if($('#pUnseen').checked)list=list.filter(q=>!(P.q[q.id]&&P.q[q.id].s));const ord=$('#pOrder').value;
      if(ord==='rand')list=shuffle(list);else if(ord==='smart'){list=shuffle(list).sort((a,b)=>{const ra=P.q[a.id],rb=P.q[b.id];const sa=ra?(ra.b+1)*(ra.s?1:0):-1,sb=rb?(rb.b+1)*(rb.s?1:0):-1;return sa-sb;});}
      startPractice(list.slice(0,+$('#pCount').value));},
    next:()=>{S.run.i++;paneRun();window.scrollTo({top:$('#pane').offsetTop-70});},
    quit:()=>{S.run.i=S.run.items.length;paneRun();},
    again:()=>{S.run=null;render();},
    startR:()=>{const list=forExam(S.exam).filter(q=>{const r=P.q[q.id];return r&&r.w&&r.b<2;});startPractice(shuffle(list).slice(0,20),'review');},
    startM:startMock,
    flag:()=>{const it=S.mock.items[S.mock.i];it.flag=!it.flag;mockRun();},
    mprev:()=>{S.mock.i--;mockRun();},
    mnext:()=>{if(S.mock.i+1<S.mock.items.length){S.mock.i++;mockRun();}else{$('#confirm').hidden=false;}},
    submit:()=>{const un=S.mock.items.filter(x=>x.pick===null).length;if(un)$('#confirm').hidden=false;else finishMock();},
    submitYes:finishMock,submitNo:()=>{$('#confirm').hidden=true;},
    newMock:()=>{S.mock=null;S.mockFilter=null;render();},
    pdom:()=>{const h=d.d.toLowerCase();const doms=domainsOf(forExam(S.exam)).filter(x=>h.includes(x.toLowerCase())||x.toLowerCase().split(/[ ,&]+/).some(w=>w.length>4&&h.includes(w)));S.dom=new Set(doms);S.tab='practice';S.run=null;render();if(!doms.length)toast('Pick domains below to practice.');},
    import:()=>{const qs=parseDSL($('#imp').value);if(!qs.length){$('#impMsg').textContent='No valid questions found. Each needs a Q: line, one + option and at least one - option.';return;}P.custom=(P.custom||[]).concat(qs);save();BANK=QB.concat(P.custom);$('#impMsg').textContent=`Added ${qs.length} question${qs.length>1?'s':''} to your bank.`;},
    clearCustom:()=>{P.custom=[];save();BANK=QB.slice();renderGuide();toast('Your added questions were removed.');},
    reset:()=>{$('#resetC').hidden=false;},
    resetYes:()=>{P.q={};save();toast('Progress reset.');go('home');}
  };
  if(A[act])A[act]();
});
document.addEventListener('input',ev=>{if(ev.target.id==='bSearch'){S.search=ev.target.value;bankList();}});
document.addEventListener('keydown',ev=>{
  if(/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName))return;
  const k=ev.key.toUpperCase();const idx='1234'.indexOf(k)>=0?'1234'.indexOf(k):'ABCD'.indexOf(k);
  if(idx>=0){const btn=$$('.qcard .opt')[idx];if(btn&&!btn.disabled){btn.click();ev.preventDefault();}}
  if(ev.key==='Enter'){const n=$('[data-act="next"]')||(S.tab==='mock'&&S.mock&&!S.mock.done&&$('[data-act="mnext"]'));if(n){n.click();ev.preventDefault();}}
});
const h=(location.hash||'').slice(1).toUpperCase();
if(EX[h])go('exam',{exam:h,tab:'practice'});else if(h==='GUIDE')go('guide');else go('home');
})();

</script>
